<body data-page="reset">	<!-- 画面要素を配置 -->
    <div class="container">	<!-- 画面要素を配置 -->
        <div class="card">	<!-- 画面要素を配置 -->
            <h1>新しいパスワードを設定</h1>	<!-- 画面要素を配置 -->
            <div id="form-area">	<!-- 画面要素を配置 -->
                <input type="password" id="new-password" placeholder="新しいパスワード" maxlength="128" autocomplete="new-password">	<!-- 入力要素を配置 -->
                <input type="password" id="confirm-password" placeholder="新しいパスワード（確認）" maxlength="128" autocomplete="new-password">	<!-- 入力要素を配置 -->
                <p style="margin:-4px 2px 14px; color:#64748b; font-size:12px; line-height:1.65; text-align:left;">	<!-- 画面要素を配置 -->
                    半角4文字以上で、英大文字・英小文字・数字・記号を各1文字以上含めてください。同じ数字4桁の繰り返しや、1234・4321のような4桁の連番は使用できません。	<!-- 画面に表示する内容 -->
                </p>	<!-- 要素を閉じる -->
                <div id="message" class="message"></div>	<!-- 画面要素を配置 -->
                <button onclick="submitReset()">パスワードを更新する</button>	<!-- 操作できる要素を配置 -->
            </div>	<!-- 要素を閉じる -->
            <div id="success-area" style="display:none;">	<!-- 画面要素を配置 -->
                <p style="color:#10b981; font-weight:700;">パスワードを更新しました。</p>	<!-- 画面要素を配置 -->

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";	// GAS APIの接続先を設定

        const params = new URLSearchParams(window.location.search);	// 定数を定義
        const userId = params.get("id");	// 定数を定義
        const token = params.get("token");	// 定数を定義

        if (!userId || !token) {	// 条件に応じて処理を分ける
            document.getElementById("form-area").innerHTML = "<p style='color:#ef4444;'>無効なリンクです。パスワード再設定をやり直してください。</p>";	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        function hasWeakNumberSequence(password) {	// 関数を定義
            const numberRuns = String(password).match(/\d{4,}/g) || [];	// 定数を定義
            return numberRuns.some(run => {	// 結果を返す
                for (let i = 0; i <= run.length - 4; i++) {	// 対象を順番に処理する
                    const digits = run.slice(i, i + 4).split("").map(Number);	// 定数を定義
                    const same = digits.every(digit => digit === digits[0]);	// 定数を定義
                    const ascending = digits.slice(1).every((digit, index) => digit === (digits[index] + 1) % 10);	// 定数を定義
                    const descending = digits.slice(1).every((digit, index) => digit === (digits[index] + 9) % 10);	// 定数を定義
                    if (same || ascending || descending) return true;	// 条件に応じて処理を分ける
                }	// 処理のまとまりを閉じる
                return false;	// 結果を返す
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function validatePassword(password) {	// 関数を定義
            if (password.length < 4) return "パスワードは4文字以上で入力してください";	// 条件に応じて処理を分ける
            if (password.length > 128) return "パスワードは128文字以内で入力してください";	// 条件に応じて処理を分ける
            if (!/^[\x21-\x7E]+$/.test(password)) return "パスワードは半角英数字・記号のみ使用できます";	// 条件に応じて処理を分ける
            if (!/[A-Z]/.test(password)) return "パスワードに英大文字を1文字以上含めてください";	// 条件に応じて処理を分ける
            if (!/[a-z]/.test(password)) return "パスワードに英小文字を1文字以上含めてください";	// 条件に応じて処理を分ける
            if (!/[0-9]/.test(password)) return "パスワードに数字を1文字以上含めてください";	// 条件に応じて処理を分ける
            if (!/[^A-Za-z0-9]/.test(password)) return "パスワードに記号を1文字以上含めてください";	// 条件に応じて処理を分ける
            if (hasWeakNumberSequence(password)) return "同じ数字4桁の繰り返しや、1234・4321のような4桁の連番は使用できません";	// 条件に応じて処理を分ける
            return "";	// 結果を返す
        }	// 処理のまとまりを閉じる

        async function submitReset() {	// 関数を定義
            const newPassword = document.getElementById("new-password").value;	// 定数を定義
            const confirmPassword = document.getElementById("confirm-password").value;	// 定数を定義
            const msgEl = document.getElementById("message");	// 定数を定義

            if (!newPassword || !confirmPassword) {	// 条件に応じて処理を分ける
                msgEl.textContent = "両方の欄を入力してください";	// 処理を続ける
                msgEl.className = "message error";	// 処理を続ける
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる
            const passwordError = validatePassword(newPassword);	// 定数を定義
            if (passwordError) {	// 条件に応じて処理を分ける
                msgEl.textContent = passwordError;	// 処理を続ける
                msgEl.className = "message error";	// 処理を続ける
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる
            if (newPassword !== confirmPassword) {	// 条件に応じて処理を分ける
                msgEl.textContent = "パスワードが一致しません";	// 処理を続ける
                msgEl.className = "message error";	// 処理を続ける
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる

            msgEl.textContent = "処理中...";	// 処理を続ける
            msgEl.className = "message";	// 処理を続ける

            try {	// 失敗に備えて処理を始める
                const res = await fetch(GAS_URL, {	// 定数を定義
                    method: "POST",	// 処理を続ける
                    body: JSON.stringify({ mode: "resetPassword", userId, token, newPassword })	// 処理を続ける
                });	// 処理を完了する
                const result = await res.json();	// 定数を定義

                if (result.status === "success") {	// 条件に応じて処理を分ける
                    document.getElementById("form-area").style.display = "none";	// 画面表示を更新する
                    document.getElementById("success-area").style.display = "block";	// 画面表示を更新する
                } else {	// 処理のまとまりを始める
                    msgEl.textContent = result.message;	// 処理を続ける
                    msgEl.className = "message error";	// 処理を続ける
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                msgEl.textContent = "通信エラーが発生しました。";	// 処理を続ける
                msgEl.className = "message error";	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる
    </script>
</body>	<!-- 要素を閉じる -->
