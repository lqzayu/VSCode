<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - 平工マッチング</title>

    <style>
        /* =====================================
           ページ全体の基本スタイル
        ===================================== */
        body {
            margin: 0;
            background-color: #f8fafc;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1cbdc5;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-item {
            margin-right: 20px;
            cursor: pointer;
            color: #666;
            font-weight: bold;
            padding: 5px 0;
        }

        .nav-item.active {
            color: #1cbdc5;
            border-bottom: 2px solid #1cbdc5;
        }

        .btn-logout {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background: none;
            cursor: pointer;
            color: #ffffff;
            background-color: #ff0000;
        }

        /* ========================================================
           ハンバーガーボタン（PCサイズ時は完全に隠す）
        ======================================================== */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 110;
        }

        .hamburger-btn span {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        /* =====================================
           レイアウト・コンテンツエリア
        ===================================== */
        .container {
            display: flex;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .sidebar {
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            background: transparent;
            box-shadow: none;
        }

        #recruit-form-area .sidebar {
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        #form-title {
            font-size: 18px;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
            border-left: 4px solid #1cbdc5;
            padding-left: 10px;
        }

        #rec-grade,
        #rec-dept,
        #rec-content {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #333333;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }

        #user-name {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            color: rgb(0, 0, 0);
            background-color: #e2e8f0;
            cursor: not-allowed;
            border-color: #cbd5e1;
            outline: none;
            margin-bottom: 10px;
        }

        #rec-grade:focus,
        #rec-dept:focus,
        #rec-content:focus {
            border-color: #1cbdc5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(28, 189, 197, 0.15);
        }

        #rec-content {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .btn-search,
        #submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #1cbdc5 0%, #17a2b8 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(28, 189, 197, 0.2);
            box-sizing: border-box;
        }

        .btn-search:hover,
        #submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(28, 189, 197, 0.35);
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .user-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.01);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .user-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(28, 189, 197, 0.12);
        }

        .user-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #e6f9fa;
            color: #1cbdc5;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .btn-match {
            background: #1cbdc5;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        .big-profile-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            transition: 0.2s;
        }

        .mypage-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 40px;
        }

        #mypage-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .btn-refresh {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #000000;
            background-color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            padding: 0;
            overflow: hidden;
        }

        .refresh-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            transition: transform 0.9s ease;
        }

        .btn-refresh:hover .refresh-icon {
            transform: rotate(-360deg);
        }

        .footer {
            background-color: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding: 24px 20px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .copyright {
            color: #999;
            font-size: 0.8rem;
            margin: 0;
        }

        /* ========================================================
           📱 スマホ・縦長画面用の表示切り替え定義
        ======================================================== */
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column !important;
                display: flex;
                padding: 10px;
            }

            .sidebar {
                width: 100% !important;
                margin-bottom: 20px;
            }

            div[style*="flex: 3"] {
                width: 100% !important;
                flex: none !important;
            }

            .hamburger-btn {
                display: flex !important;
            }

            /* 🌟初期状態：openがついていない時は何が何でも上に完全に隠す */
            .nav-links {
                position: fixed !important;
                top: -100% !important;
                left: 0 !important;
                width: 100% !important;
                background: rgba(255, 255, 255, 0.98) !important;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1) !important;
                flex-direction: column !important;
                padding: 80px 0 30px 0 !important;
                gap: 20px !important;
                transition: top 0.4s cubic-bezier(0.25, 1, 0.5, 1) !important;
                z-index: 100 !important;
                display: flex !important;
            }

            /* 🌟重要：openクラスがカチッと付与された時だけ、画面上部へ出す */
            .nav-links.open {
                top: 0 !important;
            }

            .nav-item {
                margin-right: 0 !important;
                font-size: 18px !important;
                padding: 10px 0 !important;
                width: 100% !important;
                text-align: center !important;
            }

            .btn-logout {
                margin-top: 10px !important;
                width: 80% !important;
                text-align: center !important;
                padding: 12px 0 !important;
            }

            /* 🌟open適用時のみ、3本線をクロス(×)に変形させる */
            .hamburger-btn.open span:nth-child(1) {
                transform: translateY(9px) rotate(45deg) !important;
            }

            .hamburger-btn.open span:nth-child(2) {
                opacity: 0 !important;
            }

            .hamburger-btn.open span:nth-child(3) {
                transform: translateY(-9px) rotate(-45deg) !important;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo" onclick="location.href='home.html'">平工マッチング</div>

        <button class="hamburger-btn" id="hud-menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" id="nav-links">
            <span class="nav-item" id="tab-recruit-btn" onclick="switchTab('recruit'); closeMenu();">募集投稿</span>
            <span class="nav-item active" id="tab-search-btn" onclick="switchTab('search'); closeMenu();">ユーザーを探す</span>
            <span class="nav-item" onclick="location.href='messages.html'">メッセージ</span>
            <span class="nav-item" onclick="location.href='mypages.html'">マイページ</span>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </div>
    </header>

    <main class="container">
        <div class="sidebar">
            <div class="mypage-area">
                <img id="profile-icon" class="big-profile-icon" src="" alt="icon"
                    onclick="location.href='mypages.html'">
                <div id="mypage-text">マイページ</div>
            </div>

            <div id="my-post-area"
                style="border: 1.5px solid #1cbdc5; background: #fff; padding: 15px; border-radius: 8px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left;">
                <h4
                    style="margin: 0 0 10px 0; color: #333; border-bottom: 2px solid #1cbdc5; padding-bottom: 5px; font-size: 14px;">
                    📢 あなたの現在の募集</h4>
                <div id="my-post-content" style="font-size: 13px; color: #666;">投稿している募集はありません。</div>
            </div>
        </div>

        <div style="flex: 3;">
            <section id="recruit-form-area" style="display: none;">
                <div class="sidebar" style="width: 100%; border: 1.5px solid #1cbdc5;">
                    <h3 id="form-title">募集を投稿する</h3>
                    <input type="text" id="user-name" placeholder="マイページで名前を設定してください" readonly
                        style="width:80%; border: 1.5px solid #1cbdc5; margin-bottom:10px; padding:8px; background:#eee;" />
                    <select id="rec-grade"
                        style="width:80%; border: 1.5px solid #1cbdc5; margin-bottom:10px; padding:8px;">
                        <option value="1年">1年</option>
                        <option value="2年">2年</option>
                        <option value="3年">3年</option>
                    </select>
                    <select id="rec-dept"
                        style="width:80%; border: 1.5px solid #1cbdc5; margin-bottom:10px; padding:8px;">
                        <option value="機械工学科">機械工学科</option>
                        <option value="電気工学科">電気工学科</option>
                        <option value="制御工学科">制御工学科</option>
                        <option value="土木環境工学科">土木環境工学科</option>
                        <option value="情報工学科">情報工学科</option>
                    </select>
                    <textarea id="rec-content" rows="4" placeholder="募集内容を入力してください"
                        style="width:80%; border: 1.5px solid #1cbdc5; margin-bottom:10px; padding:8px;"></textarea>
                    <button class="btn-search" id="submit-btn" onclick="submitRecruitment()">投稿する</button>
                </div>
            </section>

            <div class="main-content">
                <section id="search-area">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                        <h2>他ユーザーの募集一覧</h2>
                        <button onclick="loadRecruitments()" class="btn-refresh">
                            <img class="refresh-icon"
                                src="https://kotonohaworks.com/free-icons/wp-content/uploads/kkrn_icon_koushin_17.png"
                                alt="更新">
                        </button>
                    </div>
                    <div class="user-grid" id="user-list">読み込み中...</div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="home.html">ホーム</a>
                <a href="messages.html">メッセージ</a>
                <a href="mypages.html">マイページ</a>
            </div>
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwITrmNEOqPX9Xe59kAN7gEeyz4R3RocqhC4H6P27n66TS5oWsTQdhyCo1-gl8trb5F/exec";

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        function closeMenu() {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");
        }

        function switchTab(mode) {
            document.getElementById("recruit-form-area").style.display = (mode === 'recruit') ? "block" : "none";
            document.getElementById("search-area").style.display = (mode === 'search') ? "block" : "none";
            document.getElementById("tab-recruit-btn").classList.toggle("active", mode === 'recruit');
            document.getElementById("tab-search-btn").classList.toggle("active", mode === 'search');
            if (mode === 'recruit') {
                document.getElementById("user-name").value = localStorage.getItem("userName") || "";
            }
        }

        async function loadRecruitments() {
            const myEmail = localStorage.getItem("userEmail");
            const listDiv = document.getElementById("user-list");
            const myPostContentDiv = document.getElementById("my-post-content");

            listDiv.innerHTML = `<p>データを更新中...</p>`;
            myPostContentDiv.innerHTML = "更新中...";

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getRecruitments", email: myEmail })
                });

                const result = await res.json();
                listDiv.innerHTML = "";
                myPostContentDiv.innerHTML = "投稿している募集はありません。";

                const items = result.message.reverse();
                const myPosts = items.filter(item => item.email === myEmail);
                const otherPosts = items.filter(item => item.email !== myEmail);

                if (myPosts.length > 0) {
                    const myItem = myPosts[0];
                    myPostContentDiv.innerHTML = `
                        <div style="font-weight: bold; margin-bottom: 5px; color:#1cbdc5;">${myItem.grade} | ${myItem.dept}</div>
                        <div style="word-wrap: break-word; line-height: 1.4; margin-bottom: 10px;">${myItem.content}</div>
                        <button onclick="deleteMyRecruitment()" style="width: 100%; background: #ff4d4d; color: white; border: none; padding: 5px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">
                            ✖ この募集を削除する
                        </button>
                    `;
                }

                if (otherPosts.length === 0) {
                    listDiv.innerHTML = "<p>現在、ユーザーの募集はありません</p>";
                } else {
                    const fragment = document.createDocumentFragment();
                    otherPosts.forEach(item => {
                        const card = document.createElement("div");
                        card.className = "user-card";
                        card.innerHTML = `
                            <div class="user-badge">${item.grade} | ${item.dept}</div>
                            <h3>${item.name}</h3>
                            <p>${item.content}</p>
                            <button class="btn-match" onclick="startChat('${item.email}')">チャット</button>
                        `;
                        fragment.appendChild(card);
                    });
                    listDiv.appendChild(fragment);
                }

            } catch (e) {
                console.error(e);
                listDiv.innerText = "読み込みエラーが発生しました。";
            }
        }

        async function deleteMyRecruitment() {
            if (!confirm("本当にこの募集を削除しますか？")) return;
            const myEmail = localStorage.getItem("userEmail");
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "deleteRecruitment", email: myEmail })
                });
                const result = await res.json();
                if (result.status === "success") {
                    alert("募集を削除しました。");
                    loadRecruitments();
                } else {
                    alert("削除に失敗しました。");
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
            }
        }

        async function submitRecruitment() {
            const data = {
                mode: "postRecruitment",
                name: localStorage.getItem("userName"),
                grade: document.getElementById("rec-grade").value,
                dept: document.getElementById("rec-dept").value,
                content: document.getElementById("rec-content").value,
                email: localStorage.getItem("userEmail")
            };
            await fetch(GAS_URL, { method: "POST", body: JSON.stringify(data) });
            alert("投稿しました");
            switchTab('search');
            loadRecruitments();
            document.getElementById("rec-content").value = "";
        }

        function startChat(email) {
            localStorage.setItem("chatTarget", email);
            location.href = 'messages.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        // 🌟 起動時に強制的に開閉状態（クラス）を初期化する
        window.onload = () => {
            // クラスを完全に剥ぎ取って初期状態にする
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");

            const userName = localStorage.getItem("userName");
            const profileImage = localStorage.getItem("profileImage");
            document.getElementById("mypage-text").innerText = userName || "マイページ";

            if (profileImage) {
                document.getElementById("profile-icon").src = profileImage;
            } else {
                document.getElementById("profile-icon").src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            }
            loadRecruitments();
        };
    </script>
</body>

</html>
