    <script>
        if (!localStorage.getItem("userEmail") || !localStorage.getItem("sessionToken")) {	// ログイン情報と本人確認情報を確認する
            clearHeikoSession();	// 不完全なログイン情報を消す
            window.location.href = "index.html";	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";	// GAS APIの接続先を設定
        const bgGradients = [	// 定数を定義
            "linear-gradient(135deg, #1cbdc5 0%, #119299 100%)",	// 処理を続ける
            "linear-gradient(135deg, #0284c7 0%, #06b6d4 100%)",	// 処理を続ける
            "linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)",	// 処理を続ける
            "linear-gradient(135deg, #0d9488 0%, #115e59 100%)",	// 処理を続ける
            "linear-gradient(135deg, #6366f1 0%, #4338ca 100%)"	// 処理を続ける
        ];	// 処理を続ける
        let unreadRequest = null;	// 状態を保持
        let partnersRequest = null;	// 一覧の重複通信を防ぐ
        let unreadPollTimer = null;	// 未読確認の定期処理を保持する
        let firebaseReady = false;	// Firebase一覧が利用可能かを保持する
        let firebaseInbox = [];	// Firebaseから取得した受信箱を保持する

        async function postGas(payload, timeoutMs = 12000) {	// 関数を定義
            const controller = new AbortController();	// 定数を定義
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);	// 定数を定義
            try {	// 失敗に備えて処理を始める
                const res = await fetch(GAS_URL, {	// 定数を定義
                    method: "POST",	// 処理を続ける
                    body: JSON.stringify({ ...payload, sessionToken: localStorage.getItem("sessionToken") || "" }),	// 本人確認情報を付けて送信する
                    signal: controller.signal	// 処理を続ける
                });	// 処理を完了する
                if (!res.ok) throw new Error(`HTTP ${res.status}`);	// 条件に応じて処理を分ける
                const result = await res.json();	// 応答内容を読み込む
                if (handleHeikoSessionResponse(result)) throw new Error("ログインの有効期限が切れました");	// ログイン切れを共通処理する
                return result;	// 結果を返す
            } finally {	// 処理のまとまりを始める
                clearTimeout(timeoutId);	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function withDeadline(promise, timeoutMs, message) {	// 画面を止めない通信期限を設定する
            let timerId;	// 期限確認用のタイマーを保持する
            const timeout = new Promise((resolve, reject) => {	// 期限切れを通知する処理を作る
                timerId = setTimeout(() => reject(new Error(message)), timeoutMs);	// 指定時間後に失敗として扱う
            });	// 期限切れ処理を閉じる
            return Promise.race([promise, timeout]).finally(() => clearTimeout(timerId));	// 先に終わった結果を返してタイマーを消す
        }	// 通信期限の設定を閉じる

        async function setupFirebaseInbox() {	// Firebaseの受信箱を初期化する
            if (firebaseReady || !window.HeikoFirebaseChat || !window.HeikoFirebaseChat.enabled) return firebaseReady;	// 初期化済みまたは利用不可なら終了する
            try {	// Firebase接続エラーに備える
                const userId = localStorage.getItem("userEmail");	// ログイン中のユーザーIDを取得する
                const hasFirebaseSession = await window.HeikoFirebaseChat.isSignedInAs(userId);	// 保存済みのFirebase認証を確認する
                if (!hasFirebaseSession) {	// Firebaseへの再ログインが必要な場合に処理する
                    const result = await postGas({ mode: "firebaseCustomToken", userId: userId }, 10000);	// GASからFirebaseトークンを取得する
                    const token = result && result.message && result.message.token;	// トークンを取り出す
                    if (!token || !await window.HeikoFirebaseChat.signIn(token, userId)) return false;	// Firebaseへログインする
                }	// Firebase認証の確認を閉じる
                firebaseInbox = await window.HeikoFirebaseChat.readInbox(userId);	// 受信箱を読み込む
                firebaseReady = true;	// Firebase一覧を利用可能にする
                return true;	// 初期化成功を返す
            } catch (error) {	// Firebaseが利用できない場合に処理する
                firebaseReady = false;	// GAS一覧を使い続ける
                console.warn("Firebase受信箱を利用できません", error);	// 原因を開発者向けログへ残す
                return false;	// 初期化失敗を返す
            }	// 初期化処理を閉じる
        }	// Firebase受信箱初期化を閉じる

        function mergePartnerLists(gasPartners, firebaseMessages) {	// GASとFirebaseの相手一覧をまとめる
            const map = new Map();	// 相手ごとの最新情報を保持する
            gasPartners.forEach(partner => map.set(String(partner.email), { ...partner, source: "gas" }));	// GASの相手を先に登録する
            const myUserId = localStorage.getItem("userEmail");	// 自分のユーザーIDを取得する
            firebaseMessages.forEach(message => {	// Firebaseの受信箱を相手一覧へ変換する
                const email = message.from === myUserId ? message.to : message.from;	// 相手のユーザーIDを求める
                if (!email || email === myUserId || message.isUnsent) return;	// 不正な行は飛ばす
                const previous = map.get(email);	// 既存の相手を取得する
                if (!previous || Number(message.sentAt || 0) >= Number(previous.sentAt || 0)) map.set(email, { email: email, name: email, sentAt: message.sentAt, source: "firebase" });	// 新しい相手を保存する
            });	// Firebase一覧の変換を閉じる
            return Array.from(map.values()).sort((a, b) => Number(b.sentAt || 0) - Number(a.sentAt || 0));	// 新しい順で返す
        }	// 相手一覧の統合を閉じる

        function toggleMenu() {	// 関数を定義
            document.getElementById("hud-menu-btn").classList.toggle("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.toggle("open");	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        function closeMenu() {	// 関数を定義
            document.getElementById("hud-menu-btn").classList.remove("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.remove("open");	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        async function loadChatPartners() {	// 一覧の読み込みを一度だけ実行する
            if (partnersRequest) return partnersRequest;	// 実行中なら同じ通信の完了を待つ
            partnersRequest = loadChatPartnersOnce();	// 新しい読み込みを開始する
            try {	// 完了まで通信情報を保持する
                return await partnersRequest;	// 読み込み結果を返す
            } finally {	// 成否にかかわらず後始末する
                partnersRequest = null;	// 次の読み込みを許可する
            }	// 後始末を閉じる
        }	// 処理のまとまりを閉じる

        function renderPartnerList(gasPartners, listDiv) {	// GASとFirebaseをまとめて相手一覧を描画する
            const partners = mergePartnerLists(gasPartners, firebaseInbox);	// 二つの保存先から相手をまとめる
            listDiv.innerHTML = "";	// 読み込み表示を消す
            if (partners.length === 0) {	// 相手がいない場合に案内する
                listDiv.innerHTML = `<div class="empty-message">メッセージはまだありません。<br>ホーム画面から気になる人にチャットを送ってみましょう！</div>`;	// 空の状態を表示する
                return;	// 描画を終了する
            }	// 空表示の処理を閉じる
            partners.forEach((partner, index) => {	// 相手ごとに一覧項目を作る
                const initial = partner.name ? partner.name.charAt(0) : "未";	// アイコン用の頭文字を取得する
                const avatarBg = bgGradients[index % bgGradients.length];	// アイコンの背景色を選ぶ
                const item = document.createElement("div");	// 一覧項目を作る
                item.className = "partner-item";	// 一覧項目の見た目を設定する
                item.onclick = () => openChat(partner.email);	// 選択した相手のチャットを開く
                const avatarRing = document.createElement("div");	// アイコンの外枠を作る
                avatarRing.className = "avatar-ring";	// アイコン外枠の見た目を設定する
                const avatar = document.createElement("div");	// アイコン本体を作る
                avatar.className = "partner-avatar";	// アイコンの見た目を設定する
                avatar.style.background = avatarBg;	// アイコンへ背景色を設定する
                avatar.textContent = initial;	// アイコンへ頭文字を表示する
                avatarRing.appendChild(avatar);	// 外枠へアイコンを追加する
                const contentBox = document.createElement("div");	// 名前とIDの表示欄を作る
                contentBox.className = "partner-content-box";	// 表示欄の見た目を設定する
                const name = document.createElement("div");	// 表示名の要素を作る
                name.className = "partner-name";	// 表示名の見た目を設定する
                name.textContent = partner.name;	// 表示名を安全に表示する
                const email = document.createElement("div");	// ユーザーIDの要素を作る
                email.className = "partner-email";	// ユーザーIDの見た目を設定する
                email.textContent = partner.email;	// ユーザーIDを安全に表示する
                contentBox.append(name, email);	// 名前とIDを表示欄へ追加する
                const arrow = document.createElement("div");	// 開く案内を作る
                arrow.className = "arrow-badge";	// 開く案内の見た目を設定する
                arrow.textContent = "開く ➔";	// 開く案内を表示する
                item.append(avatarRing, contentBox, arrow);	// 一覧項目へ内容を追加する
                const deleteButton = document.createElement("button");	// 履歴非表示ボタンを作る
                deleteButton.type = "button";	// 通常のボタンとして扱う
                deleteButton.className = "partner-delete-button";	// ボタンの見た目を設定する
                deleteButton.innerText = "削除";	// ボタン名を表示する
                deleteButton.addEventListener("click", event => {	// 削除操作を登録する
                    event.stopPropagation();	// チャット画面が開く動作を止める
                    deleteChatPartner(partner.email, deleteButton);	// 選択した履歴を非表示にする
                });	// 削除操作の登録を閉じる
                item.appendChild(deleteButton);	// 一覧項目へ削除ボタンを追加する
                listDiv.appendChild(item);	// 完成した項目を一覧へ追加する
            });	// 相手一覧の描画を閉じる
        }	// 相手一覧の描画処理を閉じる

        async function loadChatPartnersOnce() {	// FirebaseとGASの一覧取得を並行して始める
            const myEmail = localStorage.getItem("userEmail");	// ログイン中のユーザーIDを取得する
            const listDiv = document.getElementById("partner-list");	// 一覧の表示先を取得する
            let gasPartners = [];	// GASから取得した相手を保持する
            let hasRendered = false;	// どちらかの一覧を表示できたか保持する
            listDiv.innerHTML = `<div class="loading-box"><div class="spinner"></div><span>データを読み込み中...</span></div>`;	// 読み込み中の表示へ切り替える

            const firebaseTask = (async () => {	// Firebase一覧を待たずに取得する
                try {	// Firebase通信の失敗に備える
                    if (firebaseReady) firebaseInbox = await window.HeikoFirebaseChat.readInbox(myEmail);	// 認証済みなら最新の受信箱を読む
                    else await setupFirebaseInbox();	// 初回だけFirebaseを初期化する
                    if (firebaseReady) {	// Firebase一覧を取得できた場合に表示する
                        renderPartnerList(gasPartners, listDiv);	// 取得できた一覧をすぐ描画する
                        hasRendered = true;	// 表示済みとして記録する
                    }	// Firebase描画の条件を閉じる
                } catch (error) {	// Firebase取得に失敗した場合に処理する
                    console.warn("Firebase一覧取得エラー:", error);	// 失敗理由を開発者向けログへ残す
                }	// Firebase一覧の取得を閉じる
            })();	// Firebase一覧の取得を開始する

            try {	// GAS通信の失敗に備える
                const result = await withDeadline(postGas({ mode: "getChatPartners", email: myEmail }, 10000), 10000, "GAS一覧の取得が時間切れになりました");	// GAS一覧をFirebaseと同時に取得する
                if (result.status !== "success") throw new Error(result.message || "一覧を取得できませんでした");	// GASのエラー応答を失敗として扱う
                gasPartners = Array.isArray(result.message) ? result.message : [];	// GASの相手一覧を保存する
                renderPartnerList(gasPartners, listDiv);	// Firebase分とまとめて描画する
                hasRendered = true;	// 表示済みとして記録する
            } catch (error) {	// GAS一覧を取得できなかった場合に処理する
                console.warn("GAS一覧取得エラー:", error);	// 失敗理由を開発者向けログへ残す
                if (!hasRendered) listDiv.innerHTML = `<div class="empty-message">通信エラーが発生しました。上部の更新ボタンで再試行できます。</div>`;	// Firebaseも未表示の場合だけエラーを案内する
            }	// GAS一覧の取得を閉じる

            firebaseTask.catch(error => console.warn("Firebase一覧処理エラー:", error));	// 背景処理の失敗を確実に記録する
        }	// 相手一覧の読み込みを閉じる

        async function updateUnreadBadge() {	// 関数を定義
            const myEmail = localStorage.getItem("userEmail");	// 定数を定義
            const badge = document.getElementById("unread-badge");	// 定数を定義
            if (!myEmail || !badge || unreadRequest) return unreadRequest;	// 条件に応じて処理を分ける

            unreadRequest = (async () => {	// 処理のまとまりを始める
                try {	// 失敗に備えて処理を始める
                    const result = await postGas({ mode: "getUnreadCount", email: myEmail });	// 定数を定義

                    if (result.status === "success" && result.message) {	// 条件に応じて処理を分ける
                        const firebaseUnread = firebaseInbox.filter(message => message.to === myEmail && !message.isRead && !message.isUnsent).length;	// Firebase側の未読数を数える
                        const count = (result.message.unreadCount || 0) + firebaseUnread;	// GASとFirebaseの未読数を合計する
                        if (count > 0) {	// 条件に応じて処理を分ける
                            badge.innerText = count > 99 ? "99+" : count;	// 処理を続ける
                            badge.style.display = "inline-block";	// 処理を続ける
                        } else {	// 処理のまとまりを始める
                            badge.style.display = "none";	// 処理を続ける
                        }	// 処理のまとまりを閉じる
                    }	// 処理のまとまりを閉じる
                } catch (e) {	// 処理のまとまりを始める
                    console.error("未読チェックエラー:", e);	// 処理を完了する
                } finally {	// 処理のまとまりを始める
                    unreadRequest = null;	// 処理を続ける
                }	// 処理のまとまりを閉じる
            })();	// 処理を完了する

            return unreadRequest;	// 結果を返す
        }	// 処理のまとまりを閉じる

        function openChat(email) {	// 関数を定義
            localStorage.setItem("chatTarget", email);	// 端末内の保存情報を扱う
            location.href = 'chat.html';	// 処理を続ける
        }	// 処理のまとまりを閉じる

        async function deleteChatPartner(email, button) {	// 関数を定義
            if (!confirm("この相手とのメッセージ一覧を削除しますか？\n自分の画面から非表示になります。相手の画面には影響しません。")) return;	// 条件に応じて処理を分ける

            const originalText = button.innerText;	// 定数を定義
            button.disabled = true;	// 処理を続ける
            button.innerText = "削除中...";	// 処理を続ける

            try {	// 失敗に備えて処理を始める
                const result = await postGas({	// 定数を定義
                    mode: "deleteChatHistory",	// 処理を続ける
                    userId: localStorage.getItem("userEmail"),	// 端末内の保存情報を扱う
                    targetUserId: email	// 処理を続ける
                });	// 処理を完了する

                if (result.status === "success") {	// 条件に応じて処理を分ける
                    await loadChatPartners();	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    button.disabled = false;	// 処理を続ける
                    button.innerText = originalText;	// 処理を続ける
                    alert("リストの削除に失敗しました: " + result.message);	// 処理結果を知らせる
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                button.disabled = false;	// 処理を続ける
                button.innerText = originalText;	// 処理を続ける
                alert("通信エラーが発生しました。");	// 処理結果を知らせる
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function logout() {	// 関数を定義
            clearHeikoSession();	// 外観設定を残してログイン情報を消す
            window.location.href = "index.html";	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        function startUnreadPoll() {	// 未読確認を開始する
            if (unreadPollTimer) return;	// 二重開始を防ぐ
            unreadPollTimer = setInterval(() => {	// 定期処理を登録する
                if (document.visibilityState === "visible") updateUnreadBadge();	// 表示中だけ確認する
            }, 60000);	// Firebase一覧を優先してGAS確認は一分ごとにまとめる
        }	// 処理のまとまりを閉じる

        function stopUnreadPoll() {	// 未読確認を停止する
            clearInterval(unreadPollTimer);	// 定期処理を止める
            unreadPollTimer = null;	// タイマー情報を破棄する
        }	// 処理のまとまりを閉じる

        document.addEventListener("visibilitychange", () => {	// 表示状態の変化を監視する
            if (document.visibilityState === "visible") {	// 画面へ戻った場合に処理する
                updateUnreadBadge();	// 未読数をすぐ更新する
                startUnreadPoll();	// 定期確認を再開する
            } else {	// 画面が隠れた場合に処理する
                stopUnreadPoll();	// 不要な通信を止める
            }	// 表示状態の確認を閉じる
        });	// 監視処理を登録する
        window.addEventListener("pagehide", stopUnreadPoll);	// ページを離れた時に通信を止める
        window.addEventListener("pageshow", event => {	// 履歴から戻った場合に処理する
            if (event.persisted) {	// 画面が復元された場合だけ更新する
                loadChatPartners();	// 一覧を更新する
                updateUnreadBadge();	// 未読数を更新する
                startUnreadPoll();	// 定期確認を再開する
            }	// 復元処理を閉じる
        });	// ページ復元処理を登録する

        window.onload = async () => {	// 初期通信の順番を制御する
            document.getElementById("hud-menu-btn").classList.remove("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.remove("open");	// 画面表示を更新する

            const currentUserId = localStorage.getItem("userId") || localStorage.getItem("userEmail");	// 定数を定義
            const adminButton = document.getElementById("nav-admin-btn");	// 定数を定義
            if (adminButton && currentUserId === "admin" && localStorage.getItem("isImpersonating") !== "true") {	// 端末内の保存情報を扱う
                adminButton.style.display = "inline-block";	// 処理を続ける
            }	// 処理のまとまりを閉じる

            localStorage.removeItem("chatTarget");	// 端末内の保存情報を扱う

            await loadChatPartners();	// 最初にメッセージ一覧を表示する
            updateUnreadBadge();	// 一覧表示後に未読数を更新する

            startUnreadPoll();	// 未読確認を開始する
        };	// 処理のまとまりを閉じる
    </script>
