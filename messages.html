<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ - 平工マッチング</title>

    <style>
        /* =====================================
           ページ全体の基本スタイル
        ===================================== */
        body {
            margin: 0;
            background-color: #f8fafc;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1cbdc5;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-item {
            margin-right: 20px;
            cursor: pointer;
            color: #666;
            font-weight: bold;
            padding: 5px 0;
            text-decoration: none;
        }

        .nav-item.active {
            color: #1cbdc5;
            border-bottom: 2px solid #1cbdc5;
        }

        .btn-logout {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background: none;
            cursor: pointer;
            color: #ffffff;
            background-color: #ff0000;
        }

        /* ========================================================
           ハンバーガーボタンの設定
        ======================================================== */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 110;
        }

        .hamburger-btn span {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 3px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* =====================================
           メッセージ専用レイアウト
        ===================================== */
        .container {
            flex: 1;
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .chat-list-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
        }

        .chat-list-card h2 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #1cbdc5;
            padding-left: 10px;
        }

        .partner-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 12px;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .partner-item:hover {
            border-color: #1cbdc5;
            background-color: #ffffff;
            transform: translateY(-1px);
        }

        .partner-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .partner-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }

        .partner-email {
            font-size: 12px;
            color: #888;
        }

        .btn-chat-open {
            background-color: #1cbdc5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-chat-open:hover {
            background-color: #159ea4;
        }

        .empty-message {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 40px 0;
        }

        .footer {
            background-color: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding: 24px 20px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .copyright {
            color: #999;
            font-size: 0.8rem;
            margin: 0;
        }

        /* =====================================
           📱 スマホ・縦長画面用の安定表示
        ===================================== */
        @media screen and (max-width: 768px) {
            .container {
                margin: 20px auto;
                padding: 0 15px;
            }

            .chat-list-card {
                padding: 20px;
            }

            .hamburger-btn {
                display: flex !important;
            }

            .nav-links {
                position: fixed !important;
                top: 56px !important;
                left: 0 !important;
                width: 100% !important;
                background: rgba(255, 255, 255, 0.98) !important;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1) !important;
                flex-direction: column !important;
                padding: 20px 0 !important;
                gap: 15px !important;
                z-index: 99 !important;

                opacity: 0 !important;
                pointer-events: none !important;
                transform: translateY(-10px) !important;
                transition: transform 0.3s ease, opacity 0.3s ease !important;
            }

            .nav-links.open {
                opacity: 1 !important;
                pointer-events: auto !important;
                transform: translateY(0) !important;
            }

            .nav-item {
                margin-right: 0 !important;
                font-size: 18px !important;
                padding: 10px 0 !important;
                width: 100% !important;
                text-align: center !important;
            }

            .btn-logout {
                margin-top: 10px !important;
                width: 80% !important;
                text-align: center !important;
                padding: 12px 0 !important;
                margin: 0 auto !important;
            }

            .hamburger-btn.open span:nth-child(1) {
                transform: translateY(9px) rotate(45deg) !important;
            }

            .hamburger-btn.open span:nth-child(2) {
                opacity: 0 !important;
                transform: scale(0) !important;
            }

            .hamburger-btn.open span:nth-child(3) {
                transform: translateY(-9px) rotate(-45deg) !important;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo" onclick="location.href='main.html'">平工マッチング</div>

        <!-- 3本線ボタン -->
        <button class="hamburger-btn" id="hud-menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" id="nav-links">
            <a class="nav-item" href="main.html">ホーム</a>
            <a class="nav-item active" href="messages.html">メッセージ</a>
            <a class="nav-item" href="profile.html">マイページ</a>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </nav>
    </header>

    <main class="container">
        <div class="chat-list-card">
            <h2>トーク履歴一覧</h2>
            <div id="partner-list">読み込み中...</div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="main.html">ホーム</a>
                <a href="messages.html">メッセージ</a>
                <a href="profile.html">マイページ</a>
            </div>
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwITrmNEOqPX9Xe59kAN7gEeyz4R3RocqhC4H6P27n66TS5oWsTQdhyCo1-gl8trb5F/exec";

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        function closeMenu() {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");
        }

        async function loadChatPartners() {
            const myEmail = localStorage.getItem("userEmail");
            const listDiv = document.getElementById("partner-list");

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getChatPartners", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success") {
                    const partners = result.message;
                    listDiv.innerHTML = "";

                    if (partners.length === 0) {
                        listDiv.innerHTML = `
                            <div class="empty-message">
                                過去のチャット履歴はありません。<br>
                                ホーム画面から誰かにチャットを送ってみましょう！
                            </div>
                        `;
                    } else {
                        partners.forEach(partner => {
                            const item = document.createElement("div");
                            item.className = "partner-item";
                            item.innerHTML = `
                                <div class="partner-info">
                                    <div class="partner-name">${partner.name}</div>
                                    <div class="partner-email">${partner.email}</div>
                                </div>
                                <button class="btn-chat-open" onclick="openChat('${partner.email}')">開く</button>
                            `;
                            listDiv.appendChild(item);
                        });
                    }
                } else {
                    listDiv.innerText = "データの取得に失敗しました。";
                }
            } catch (e) {
                console.error(e);
                listDiv.innerText = "通信エラーが発生しました。";
            }
        }

        function openChat(email) {
            localStorage.setItem("chatTarget", email);
            location.href = 'chat.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = () => {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");
            loadChatPartners();
        };
    </script>
</body>

</html>
