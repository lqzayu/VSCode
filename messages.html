<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ - 平工マッチング</title>

    <style>
        /* =====================================
           ページ全体の基本スタイル（共通化）
        ===================================== */
        body {
            margin: 0;
            background-color: #f8fafc;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1cbdc5;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-item {
            cursor: pointer;
            color: #666;
            font-weight: bold;
            padding: 5px 0;
            text-decoration: none;
        }

        .nav-item.active {
            color: #1cbdc5;
            border-bottom: 2px solid #1cbdc5;
        }

        .btn-logout {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background: none;
            cursor: pointer;
            color: #ffffff;
            background-color: #ff0000;
        }

        /* =====================================
           メッセージ画面専用コンテンツレイアウト
        ===================================== */
        .container {
            flex: 1;
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .chat-list-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
        }

        .chat-list-card h2 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #1cbdc5;
            padding-left: 10px;
        }

        /* チャット相手リストのアイテム */
        .partner-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 12px;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .partner-item:hover {
            border-color: #1cbdc5;
            background-color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(28, 189, 197, 0.08);
        }

        .partner-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .partner-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }

        .partner-email {
            font-size: 12px;
            color: #888;
        }

        .btn-chat-open {
            background-color: #1cbdc5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-chat-open:hover {
            background-color: #159ea4;
        }

        .empty-message {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            padding: 40px 0;
        }

        /* =====================================
           フッターのスタイル
        ===================================== */
        .footer {
            background-color: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding: 24px 20px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .copyright {
            color: #999;
            font-size: 0.8rem;
            margin: 0;
        }

        @media screen and (max-width: 768px) {
            .container {
                margin: 20px auto;
                padding: 0 15px;
            }

            .chat-list-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo" onclick="location.href='main.html'">平工マッチング</div>

        <nav class="nav-links">
            <a class="nav-item" href="main.html">ホーム</a>
            <a class="nav-item active" href="messages.html">メッセージ</a>
            <a class="nav-item" href="profile.html">マイページ</a>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </nav>
    </header>

    <main class="container">
        <div class="chat-list-card">
            <h2>トーク履歴一覧</h2>
            <div id="partner-list">読み込み中...</div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="main.html">ホーム</a>
                <a href="messages.html">メッセージ</a>
                <a href="profile.html">マイページ</a>
            </div>
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwITrmNEOqPX9Xe59kAN7gEeyz4R3RocqhC4H6P27n66TS5oWsTQdhyCo1-gl8trb5F/exec";

        async function loadChatPartners() {
            const myEmail = localStorage.getItem("userEmail");
            const listDiv = document.getElementById("partner-list");

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getChatPartners", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success") {
                    const partners = result.message;
                    listDiv.innerHTML = "";

                    if (partners.length === 0) {
                        listDiv.innerHTML = `
                            <div class="empty-message">
                                過去のチャット履歴はありません。<br>
                                ホーム画面から誰かにチャットを送ってみましょう！
                            </div>
                        `;
                    } else {
                        partners.forEach(partner => {
                            const item = document.createElement("div");
                            item.className = "partner-item";
                            item.innerHTML = `
                                <div class="partner-info">
                                    <div class="partner-name">${partner.name}</div>
                                    <div class="partner-email">${partner.email}</div>
                                </div>
                                <button class="btn-chat-open" onclick="openChat('${partner.email}')">開く</button>
                            `;
                            listDiv.appendChild(item);
                        });
                    }
                } else {
                    listDiv.innerText = "データの取得に失敗しました。";
                }
            } catch (e) {
                console.error(e);
                listDiv.innerText = "通信エラーが発生しました。";
            }
        }

        function openChat(email) {
            localStorage.setItem("chatTarget", email);
            // 個別のトークルーム画面がある場合はそのファイル名（例: chat.html など）に変えてください
            location.href = 'chat.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = () => {
            loadChatPartners();
        };
    </script>
</body>

</html>
