<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ - 平工マッチング</title>
    <link rel="stylesheet" href="home-style.css">
    <style> /*css-style*/
        body {
            background-color: #f0f2f5;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        /* --- 1, トーク一覧画面のスタイル --- */
        .list-header {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            background: #fff;
        }
        .partner-list {
            flex: 1;
            overflow-y: auto;
            background: #fff;
        }
        .partner-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f9f9f9;
            cursor: pointer;
            gap: 12px;
            transition: background 0.2s;
        }
        .partner-item:hover {
            background: #f5f5f5;
        }
        .partner-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }
        .partner-info {
            flex: 1;
        }
        .partner-name {
            font-weight: bold;
            font-size: 15px;
            color: #333;
        }
        .partner-arrow {
            color: #ccc;
            font-size: 14px;
        }

        /* --- チャット画面のスタイル（LINE風背景） --- */
        .chat-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #7494c0; /* LINE風背景色 */
        }
        .chat-header {
            background: #ffffff;
            color: #333333;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .header-info {
            flex: 1;
        }
        .header-name {
            font-weight: bold;
            font-size: 16px;
        }
        .header-email {
            font-size: 11px;
            color: #888;
        }
        .btn-back {
            background: #1cbdc5;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }
        .msg-wrapper.me { align-self: flex-end; }
        .msg-wrapper.target { align-self: flex-start; }
        .msg {
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 14px;
            word-wrap: break-word;
            line-height: 1.4;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .msg-wrapper.me .msg {
            background: #8ee59d;
            color: #000;
            border-top-right-radius: 2px;
        }
        .msg-wrapper.target .msg {
            background: #ffffff;
            color: #000;
            border-top-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #ffffff;
            gap: 10px;
            border-top: 1px solid #eee;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: #f8f9fa;
        }
        .btn-send {
            background: #1cbdc5;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo" onclick="location.href='home.html'">平工マッチング</div>
    <div class="nav-links">
        <span class="nav-item" onclick="location.href='home.html'">ホーム（募集一覧）</span>
        <span class="nav-item active" onclick="location.href='messages.html'">メッセージ</span>
        <span class="nav-item" onclick="location.href='mypages.html'">マイページ</span>
    </div>
</header>

<div class="main-container">
    <div id="partner-list-view" style="display: block; height: 100%; display: flex; flex-direction: column;">
        <div class="list-header">トーク履歴一覧</div>
        <div class="partner-list" id="partner-list-box">
            <p style="text-align: center; color: #888; padding: 20px;">読み込み中...</p>
        </div>
    </div>

    <div id="chat-view" class="chat-view" style="display: none;">
        <div class="chat-header">
            <img id="target-icon" class="header-icon" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="icon">
            <div class="header-info">
                <div id="chat-title" class="header-name">対話中</div>
                <div id="chat-email" class="header-email">-------</div>
            </div>
            <button class="btn-back" onclick="backToPartnerList()">一覧へ戻る</button>
        </div>
        
        <div class="chat-box" id="chat-box"></div>
        
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendChatMessage()">送信</button>
        </div>
    </div>
</div>

<script>
/**
 * =======================================================
 * バックエンド（Google Apps Script）連携設定
 * =======================================================
 * GAS側にデプロイしたWebアプリのURL。
 * チャットデータの取得や送信の要求（リクエスト）をこのURLに対して送ります。
 */
const GAS_URL = "https://script.google.com/macros/s/AKfycbz6psDpbuHyxG-8bAIkCKOb6g930qiJUSYJzKKyYPsCPPzMcKIp-MTeK6sh58hViEXA/exec";

const myEmail = localStorage.getItem("userEmail");
let currentTargetEmail = null; // 現在チャットしている相手
let chatIntervalId = null;     // 自動更新用タイマーのID

window.onload = () => {
    if (!myEmail) {
        alert("ログイン情報が見つかりません。");
        location.href = "index.html";
        return;
    }

    // 🌟 募集カードの「チャット」から直接飛んできたかチェック
    const directTarget = localStorage.getItem("chatTarget");
    if (directTarget) {
        localStorage.removeItem("chatTarget"); // 一度消してメモリをクリーンに
        openChat(directTarget, "対話中...");   // 直接チャット画面を開く
    } else {
        // 通常はトーク相手一覧を読み込む
        loadPartnerList();
    }
};

// 📇 トーク相手一覧をGASから取得して描写する
async function loadPartnerList() {
    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ mode: "getChatPartners", email: myEmail })
        });
        const result = await res.json();
        
        if (result.status === "success") {
            const listBox = document.getElementById("partner-list-box");
            listBox.innerHTML = "";

            if (result.message.length === 0) {
                listBox.innerHTML = '<p style="text-align: center; color: #888; padding: 40px; font-size: 14px;">過去のチャット履歴はありません。<br>ホーム画面から誰かにチャットを送ってみましょう！</p>';
                return;
            }

            result.message.forEach(partner => {
                const item = document.createElement("div");
                item.className = "partner-item";
                // クリックしたらその人とのチャットを開く
                item.onclick = () => openChat(partner.email, partner.name);

                item.innerHTML = `
                    <img class="partner-icon" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="icon">
                    <div class="partner-info">
                        <div class="partner-name">${partner.name}</div>
                        <div style="font-size: 12px; color: #888;">${partner.email}</div>
                    </div>
                    <div class="partner-arrow">＞</div>
                `;
                listBox.appendChild(item);
            });
        }
    } catch (e) {
        document.getElementById("partner-list-box").innerText = "一覧の読み込みに失敗しました。";
    }
}

// 💬 特定の相手とのチャット画面に切り替える関数
function openChat(email, name) {
    currentTargetEmail = email;
    
    // 画面の表示切り替え
    document.getElementById("partner-list-view").style.display = "none";
    document.getElementById("chat-view").style.display = "flex";
    
    // ヘッダー情報のセット
    document.getElementById("chat-title").innerText = `対話中: ${name}`;
    document.getElementById("chat-email").innerText = email;
    
    // 相手の最新プロフィール（マイページでの最新名）を裏で取り直す
    fetchRealtimeProfile(email);

    // 最初の履歴読み込み
    loadChatMessages();
    
    // 5秒おきの自動更新を開始
    if (chatIntervalId) clearInterval(chatIntervalId);
    chatIntervalId = setInterval(loadChatMessages, 5000);
}

// ↩️ チャット画面から一覧画面に戻る関数
function backToPartnerList() {
    currentTargetEmail = null;
    if (chatIntervalId) {
        clearInterval(chatIntervalId); // タイマー停止
        chatIntervalId = null;
    }
    // 画面の表示切り替え
    document.getElementById("chat-view").style.display = "none";
    document.getElementById("partner-list-view").style.display = "flex";
    
    // 一覧を最新状態に再読み込み
    loadPartnerList();
}

// 相手のリアルタイムな設定名を取得する
async function fetchRealtimeProfile(email) {
    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ mode: "login", email: email })
        });
        const result = await res.json();
        if (result.status === "success") {
            document.getElementById("chat-title").innerText = `対話中: ${result.message.name}`;
        }
    } catch(e){}
}

// メッセージ履歴の取得（currentTargetEmail宛て）
async function loadChatMessages() {
    if (!currentTargetEmail) return;
    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
                mode: "getMessages",
                user1: myEmail,
                user2: currentTargetEmail
            })
        });
        const result = await res.json();
        
        if (result.status === "success" && currentTargetEmail) {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";
            
            result.message.forEach(msg => {
                const wrapper = document.createElement("div");
                const msgDiv = document.createElement("div");
                msgDiv.className = "msg";
                msgDiv.innerText = msg.text;
                
                if (msg.from === myEmail) {
                    wrapper.className = "msg-wrapper me";
                } else {
                    wrapper.className = "msg-wrapper target";
                }
                
                wrapper.appendChild(msgDiv);
                chatBox.appendChild(wrapper);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    } catch (e) { console.error(e); }
}

// メッセージ送信
async function sendChatMessage() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text || !currentTargetEmail) return;

    input.value = "";

    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
                mode: "sendMessage",
                from: myEmail,
                to: currentTargetEmail,
                text: text
            })
        });
        const result = await res.json();
        if (result.status === "success") {
            loadChatMessages();
        }
    } catch (e) { alert("通信エラー"); }
}

function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendChatMessage();
    }
}
</script>
