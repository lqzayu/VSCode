<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ - 平工マッチング</title>
    <link rel="stylesheet" href="home-style.css">
    <style> /*css-style*/
        body {
            background-color: #f0f2f5;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        /* スマホ（アスペクト比が縦長）の場合の調整 */
        @media screen and (max-width: 600px) {
            .main-container {
                max-width: 100%;
                height: calc(100vh - 60px); /* ヘッダー分を除いた全画面 */
            }
            .msg {
                font-size: 16px; /* スマホで読みやすいサイズに拡大 */
            }
        }

        /* --- 1, トーク一覧画面のスタイル --- */
        .list-header {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            background: #fff;
        }
        .partner-list {
            flex: 1;
            overflow-y: auto;
            background: #fff;
        }
        .partner-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f9f9f9;
            cursor: pointer;
            gap: 12px;
            transition: background 0.2s;
        }
        .partner-item:hover {
            background: #f5f5f5;
        }
        .partner-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }
        .partner-info {
            flex: 1;
        }
        .partner-name {
            font-weight: bold;
            font-size: 15px;
            color: #333;
        }
        .partner-arrow {
            color: #ccc;
            font-size: 14px;
        }

        /* --- チャット画面のスタイル（LINE風背景） --- */
        .chat-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #7494c0; /* LINE風背景色 */
        }
        .chat-header {
            background: #ffffff;
            color: #333333;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .header-info {
            flex: 1;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .header-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            line-height: 1.2;
        }
        .header-email {
            font-size: 12px;
            color: #888;
            line-height: 1.2;
        }
        .btn-back {
            background: #1cbdc5;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }
        .msg-wrapper.me { align-self: flex-end; }
        .msg-wrapper.target { align-self: flex-start; }
        .msg {
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 14px;
            word-wrap: break-word;
            line-height: 1.4;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .msg-wrapper.me .msg {
            background: #8ee59d;
            color: #000;
            border-top-right-radius: 2px;
        }
        .msg-wrapper.target .msg {
            background: #ffffff;
            color: #000;
            border-top-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #ffffff;
            gap: 10px;
            border-top: 1px solid #eee;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: #f8f9fa;
        }
        .btn-send {
            background: #1cbdc5;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        /* 💡デザイン修正: 横並び（Flex）のパーツとして絶対に隠れない位置に配置 */
        .btn-room-delete {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap; /* ボタン内の文字が改行されるのを防ぐ */
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .btn-room-delete:hover {
            opacity: 1;
            background: #e60000;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo" onclick="location.href='home.html'">平工マッチング</div>
    <div class="nav-links">
        <span class="nav-item" onclick="location.href='home.html'">ホーム（募集一覧）</span>
        <span class="nav-item active" onclick="location.href='messages.html'">メッセージ</span>
        <span class="nav-item" onclick="location.href='mypages.html'">マイページ</span>
    </div>
</header>

<div class="main-container">
    <div id="partner-list-view" style="display: block; height: 100%; display: flex; flex-direction: column;">
        <div class="list-header">トーク履歴一覧</div>
        <div class="partner-list" id="partner-list-box">
            <p style="text-align: center; color: #888; padding: 20px;">読み込み中...</p>
        </div>
    </div>

    <div id="chat-view" class="chat-view" style="display: none;">
        <div class="chat-header">
            <img id="target-icon" class="header-icon" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="icon">
            <div class="header-info">
                <div id="chat-title" class="header-name">読み込み中...</div>
                <div id="chat-email" class="header-email">-------</div>
            </div>
            <button class="btn-back" onclick="backToPartnerList()">一覧へ戻る</button>
        </div>
        
        <div class="chat-box" id="chat-box"></div>
        
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendChatMessage()">送信</button>
        </div>
    </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbz6psDpbuHyxG-8bAIkCKOb6g930qiJUSYJzKKyYPsCPPzMcKIp-MTeK6sh58hViEXA/exec";

const myEmail = localStorage.getItem("userEmail");
let currentTargetEmail = null;
let chatIntervalId = null;

window.onload = () => {
    if (!myEmail) {
        alert("ログイン情報が見つかりません。");
        location.href = "index.html";
        return;
    }

    const directTarget = localStorage.getItem("chatTarget");
    if (directTarget) {
        localStorage.removeItem("chatTarget");
        openChat(directTarget, "読み込み中...");
    } else {
        loadPartnerList();
    }
};

async function loadPartnerList() {
    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ mode: "getChatPartners", email: myEmail })
        });
        const result = await res.json();
        
        if (result.status === "success") {
            const listBox = document.getElementById("partner-list-box");
            listBox.innerHTML = "";

            if (result.message.length === 0) {
                listBox.innerHTML = '<p style="text-align: center; color: #888; padding: 40px; font-size: 14px;">過去のチャット履歴はありません。<br>ホーム画面から誰かにチャットを送ってみましょう！</p>';
                return;
            }

            result.message.forEach(partner => {
                const item = document.createElement("div");
                item.className = "partner-item";
                item.onclick = () => openChat(partner.email, partner.name);

                item.innerHTML = `
                    <img class="partner-icon" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="icon">
                    <div class="partner-info">
                        <div class="partner-name">${partner.name}</div>
                        <div style="font-size: 12px; color: #888;">${partner.email}</div>
                    </div>
                    <button class="btn-room-delete" onclick="event.stopPropagation(); deleteChatRoom('${partner.email}', '${partner.name}', this.parentElement);">削除</button>
                    <div class="partner-arrow">＞</div>
                `;
                listBox.appendChild(item);
            });
        }
    } catch (e) {
        document.getElementById("partner-list-box").innerText = "一覧の読み込みに失敗しました。";
    }
}

async function deleteChatRoom(targetEmail, targetName, itemElement) {
    if (!confirm(`${targetName} さんとのトークルーム（すべてのメッセージ履歴）を完全に削除しますか？`)) return;

    itemElement.remove();

    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
                mode: "deleteChatRoom",
                myEmail: myEmail,
                targetEmail: targetEmail
            })
        });
        const result = await res.json();
        if (result.status === "success") {
            loadPartnerList();
        }
    } catch (e) {
        alert("トークルームの削除に失敗しました。電波状況を確認してください。");
        loadPartnerList();
    }
}

function openChat(email, name) {
    currentTargetEmail = email;
    
    document.getElementById("partner-list-view").style.display = "none";
    document.getElementById("chat-view").style.display = "flex";
    
    // 🌟 「対話中:」の文字列を完全に排除して名前だけをセットするよう修正
    document.getElementById("chat-title").innerText = name;
    document.getElementById("chat-email").innerText = email;
    
    fetchRealtimeProfile(email);
    loadChatMessages();
    
    if (chatIntervalId) clearInterval(chatIntervalId);
    chatIntervalId = setInterval(loadChatMessages, 5000);
}

function backToPartnerList() {
    currentTargetEmail = null;
    if (chatIntervalId) {
        clearInterval(chatIntervalId);
        chatIntervalId = null;
    }
    document.getElementById("chat-view").style.display = "none";
    document.getElementById("partner-list-view").style.display = "flex";
    
    loadPartnerList();
}

async function fetchRealtimeProfile(email) {
    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ mode: "login", email: email })
        });
        const result = await res.json();
        if (result.status === "success" && currentTargetEmail === email) {
            // 🌟 リアルタイム更新時も「対話中:」を付けずに取得したユーザー名のみを代入
            document.getElementById("chat-title").innerText = result.message.name;
        }
    } catch(e){}
}

async function loadChatMessages() {
    if (!currentTargetEmail) return;
    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
                mode: "getMessages",
                user1: myEmail,
                user2: currentTargetEmail
            })
        });
        const result = await res.json();
        
        if (result.status === "success" && currentTargetEmail) {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";
            
            result.message.forEach(msg => {
                const wrapper = document.createElement("div");
                const msgDiv = document.createElement("div");
                msgDiv.className = "msg";
                msgDiv.innerText = msg.text;
                
                if (msg.from === myEmail) {
                    wrapper.className = "msg-wrapper me";
                } else {
                    wrapper.className = "msg-wrapper target";
                }
                
                wrapper.appendChild(msgDiv);
                chatBox.appendChild(wrapper);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    } catch (e) { console.error(e); }
}

async function sendChatMessage() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text || !currentTargetEmail) return;

    input.value = "";

    const chatBox = document.getElementById("chat-box");
    if (chatBox.querySelector("p")) {
        chatBox.innerHTML = "";
    }

    const wrapper = document.createElement("div");
    wrapper.className = "msg-wrapper me";
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg";
    msgDiv.innerText = text;
    
    wrapper.appendChild(msgDiv);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
                mode: "sendMessage",
                from: myEmail,
                to: currentTargetEmail,
                text: text
            })
        });
        const result = await res.json();
        
        if (result.status === "success") {
            loadChatMessages();
        }
    } catch (e) {
        alert("メッセージの送信に失敗しました。電波状況を確認してください。");
    }
}

function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendChatMessage();
    }
}
</script>
</body>
</html>
