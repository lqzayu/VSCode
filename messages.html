    <script>
        if (!localStorage.getItem("userEmail")) {	// 端末内の保存情報を扱う
            window.location.href = "index.html";	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";	// GAS APIの接続先を設定
        const bgGradients = [	// 定数を定義
            "linear-gradient(135deg, #1cbdc5 0%, #119299 100%)",	// 処理を続ける
            "linear-gradient(135deg, #0284c7 0%, #06b6d4 100%)",	// 処理を続ける
            "linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)",	// 処理を続ける
            "linear-gradient(135deg, #0d9488 0%, #115e59 100%)",	// 処理を続ける
            "linear-gradient(135deg, #6366f1 0%, #4338ca 100%)"	// 処理を続ける
        ];	// 処理を続ける
        let unreadRequest = null;	// 状態を保持

        async function postGas(payload, timeoutMs = 12000) {	// 関数を定義
            const controller = new AbortController();	// 定数を定義
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);	// 定数を定義
            try {	// 失敗に備えて処理を始める
                const res = await fetch(GAS_URL, {	// 定数を定義
                    method: "POST",	// 処理を続ける
                    body: JSON.stringify(payload),	// 処理を続ける
                    signal: controller.signal	// 処理を続ける
                });	// 処理を完了する
                if (!res.ok) throw new Error(`HTTP ${res.status}`);	// 条件に応じて処理を分ける
                return await res.json();	// 結果を返す
            } finally {	// 処理のまとまりを始める
                clearTimeout(timeoutId);	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function toggleMenu() {	// 関数を定義
            document.getElementById("hud-menu-btn").classList.toggle("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.toggle("open");	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        function closeMenu() {	// 関数を定義
            document.getElementById("hud-menu-btn").classList.remove("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.remove("open");	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        async function loadChatPartners() {	// 関数を定義
            const myEmail = localStorage.getItem("userEmail");	// 定数を定義
            const listDiv = document.getElementById("partner-list");	// 定数を定義

            listDiv.innerHTML = `
                <div class="loading-box">
                    <div class="spinner"></div>
                    <span>データを読み込み中...</span>
                </div>
            `;

            try {	// 失敗に備えて処理を始める
                const result = await postGas({ mode: "getChatPartners", email: myEmail });	// 定数を定義

                if (result.status === "success") {	// 条件に応じて処理を分ける
                    const partners = result.message;	// 定数を定義
                    listDiv.innerHTML = "";	// 処理を続ける

                    if (partners.length === 0) {	// 条件に応じて処理を分ける
                        listDiv.innerHTML = `
                            <div class="empty-message">
                                メッセージはまだありません。<br>
                                ホーム画面から気になる人にチャットを送ってみましょう！
                            </div>
                        `;
                    } else {	// 処理のまとまりを始める
                        partners.forEach((partner, index) => {	// 処理のまとまりを始める
                            const initial = partner.name ? partner.name.charAt(0) : "未";	// 定数を定義
                            const avatarBg = bgGradients[index % bgGradients.length];	// 定数を定義

                            const item = document.createElement("div");	// 定数を定義
                            item.className = "partner-item";	// 処理を続ける
                            item.onclick = () => openChat(partner.email);	// 処理を完了する

                            const avatarRing = document.createElement("div");	// 定数を定義
                            avatarRing.className = "avatar-ring";	// 処理を続ける
                            const avatar = document.createElement("div");	// 定数を定義
                            avatar.className = "partner-avatar";	// 処理を続ける
                            avatar.style.background = avatarBg;	// 処理を続ける
                            avatar.textContent = initial;	// 処理を続ける
                            avatarRing.appendChild(avatar);	// 処理を完了する

                            const contentBox = document.createElement("div");	// 定数を定義
                            contentBox.className = "partner-content-box";	// 処理を続ける
                            const name = document.createElement("div");	// 定数を定義
                            name.className = "partner-name";	// 処理を続ける
                            name.textContent = partner.name;	// 処理を続ける
                            const email = document.createElement("div");	// 定数を定義
                            email.className = "partner-email";	// 処理を続ける
                            email.textContent = partner.email;	// 処理を続ける
                            contentBox.append(name, email);	// 処理を完了する

                            const arrow = document.createElement("div");	// 定数を定義
                            arrow.className = "arrow-badge";	// 処理を続ける
                            arrow.textContent = "開く ➔";	// 処理を続ける
                            item.append(avatarRing, contentBox, arrow);	// 処理を完了する

                            const deleteButton = document.createElement("button");	// 定数を定義
                            deleteButton.type = "button";	// 処理を続ける
                            deleteButton.className = "partner-delete-button";	// 処理を続ける
                            deleteButton.innerText = "削除";	// 処理を続ける
                            deleteButton.addEventListener("click", event => {	// 操作イベントを登録
                                event.stopPropagation();	// 処理を完了する
                                deleteChatPartner(partner.email, deleteButton);	// 処理を完了する
                            });	// 処理を完了する
                            item.appendChild(deleteButton);	// 処理を完了する
                            listDiv.appendChild(item);	// 処理を完了する
                        });	// 処理を完了する
                    }	// 処理のまとまりを閉じる
                } else {	// 処理のまとまりを始める
                    listDiv.innerHTML = `<div class="empty-message">データの取得に失敗しました。</div>`;	// 処理を続ける
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                console.error(e);	// 処理を完了する
                listDiv.innerHTML = `<div class="empty-message">通信エラーが発生しました。</div>`;	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        async function updateUnreadBadge() {	// 関数を定義
            const myEmail = localStorage.getItem("userEmail");	// 定数を定義
            const badge = document.getElementById("unread-badge");	// 定数を定義
            if (!myEmail || !badge || unreadRequest) return unreadRequest;	// 条件に応じて処理を分ける

            unreadRequest = (async () => {	// 処理のまとまりを始める
                try {	// 失敗に備えて処理を始める
                    const result = await postGas({ mode: "getUnreadCount", email: myEmail });	// 定数を定義

                    if (result.status === "success" && result.message) {	// 条件に応じて処理を分ける
                        const count = result.message.unreadCount || 0;	// 定数を定義
                        if (count > 0) {	// 条件に応じて処理を分ける
                            badge.innerText = count > 99 ? "99+" : count;	// 処理を続ける
                            badge.style.display = "inline-block";	// 処理を続ける
                        } else {	// 処理のまとまりを始める
                            badge.style.display = "none";	// 処理を続ける
                        }	// 処理のまとまりを閉じる
                    }	// 処理のまとまりを閉じる
                } catch (e) {	// 処理のまとまりを始める
                    console.error("未読チェックエラー:", e);	// 処理を完了する
                } finally {	// 処理のまとまりを始める
                    unreadRequest = null;	// 処理を続ける
                }	// 処理のまとまりを閉じる
            })();	// 処理を完了する

            return unreadRequest;	// 結果を返す
        }	// 処理のまとまりを閉じる

        function openChat(email) {	// 関数を定義
            localStorage.setItem("chatTarget", email);	// 端末内の保存情報を扱う
            location.href = 'chat.html';	// 処理を続ける
        }	// 処理のまとまりを閉じる

        async function deleteChatPartner(email, button) {	// 関数を定義
            if (!confirm("この相手とのメッセージ一覧を削除しますか？\n自分の画面から非表示になります。相手の画面には影響しません。")) return;	// 条件に応じて処理を分ける

            const originalText = button.innerText;	// 定数を定義
            button.disabled = true;	// 処理を続ける
            button.innerText = "削除中...";	// 処理を続ける

            try {	// 失敗に備えて処理を始める
                const result = await postGas({	// 定数を定義
                    mode: "deleteChatHistory",	// 処理を続ける
                    userId: localStorage.getItem("userEmail"),	// 端末内の保存情報を扱う
                    targetUserId: email	// 処理を続ける
                });	// 処理を完了する

                if (result.status === "success") {	// 条件に応じて処理を分ける
                    await loadChatPartners();	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    button.disabled = false;	// 処理を続ける
                    button.innerText = originalText;	// 処理を続ける
                    alert("リストの削除に失敗しました: " + result.message);	// 処理結果を知らせる
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                button.disabled = false;	// 処理を続ける
                button.innerText = originalText;	// 処理を続ける
                alert("通信エラーが発生しました。");	// 処理結果を知らせる
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function logout() {	// 関数を定義
            localStorage.clear();	// 端末内の保存情報を扱う
            window.location.href = "index.html";	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        window.onload = () => {	// 処理のまとまりを始める
            document.getElementById("hud-menu-btn").classList.remove("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.remove("open");	// 画面表示を更新する

            const currentUserId = localStorage.getItem("userId") || localStorage.getItem("userEmail");	// 定数を定義
            const adminButton = document.getElementById("nav-admin-btn");	// 定数を定義
            if (adminButton && currentUserId === "admin" && localStorage.getItem("isImpersonating") !== "true") {	// 端末内の保存情報を扱う
                adminButton.style.display = "inline-block";	// 処理を続ける
            }	// 処理のまとまりを閉じる

            localStorage.removeItem("chatTarget");	// 端末内の保存情報を扱う

            loadChatPartners();	// 処理を完了する
            updateUnreadBadge();	// 処理を完了する

            setInterval(() => {	// 時間を置いて処理する
                if (document.visibilityState === "visible") updateUnreadBadge();	// 条件に応じて処理を分ける
            }, 8000);	// 処理を完了する
        };	// 処理のまとまりを閉じる
    </script>
