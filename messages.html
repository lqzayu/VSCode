<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ - 平工マッチング</title>

    <!-- favicon 404エラー防止用のダミーアイコン設定 -->
    <link rel="icon" href="data:,">

    <style>
        /* =====================================
           💡 main.html と統一したモダン調基本スタイル
        ===================================== */
        body {
            margin: 0;
            background: radial-gradient(circle at 10% 20%, rgba(238, 252, 253, 1) 0%, rgba(218, 241, 245, 1) 90%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ナビゲーションバー：洗練されたグラスモフィズム */
        .navbar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item {
            cursor: pointer;
            color: #64748b;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-item:hover {
            background-color: rgba(28, 189, 197, 0.06);
            color: #1cbdc5;
        }

        .nav-item.active {
            color: #1cbdc5;
            background-color: rgba(28, 189, 197, 0.1);
        }

        /* 🔴 未読バッジ */
        .unread-badge {
            position: absolute;
            top: 2px;
            right: 4px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
            min-width: 14px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-logout {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background-color: #ef4444;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
            transition: all 0.2s;
        }

        .btn-logout:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.25);
        }

        /* ハンバーガーボタン */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 110;
        }

        .hamburger-btn span {
            width: 100%;
            height: 2.5px;
            background-color: #1e293b;
            border-radius: 3px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* =====================================
           レイアウト・メッセージカードエリア
        ===================================== */
        .container {
            flex: 1;
            width: 100%;
            max-width: 680px;
            margin: 40px auto;
            padding: 0 24px;
            box-sizing: border-box;
        }

        .dm-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px -4px rgba(24, 76, 92, 0.05);
        }

        .dm-header {
            padding: 24px 28px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dm-header h2 {
            font-size: 1.25rem;
            margin: 0;
            color: #1e293b;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dm-header h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            border-radius: 4px;
        }

        /* リストアイテム */
        .partner-item {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            cursor: pointer;
            transition: all 0.25s ease;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .partner-item:hover {
            background-color: rgba(28, 189, 197, 0.05);
            transform: translateX(4px);
        }

        /* アバター枠 */
        .avatar-ring {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            margin-right: 18px;
            flex-shrink: 0;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(28, 189, 197, 0.2);
        }

        .partner-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 18px;
            box-sizing: border-box;
        }

        .partner-content-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow: hidden;
        }

        .partner-name {
            font-weight: 800;
            font-size: 15px;
            color: #1e293b;
        }

        .partner-email {
            font-size: 13px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow-badge {
            background: rgba(28, 189, 197, 0.1);
            color: #1cbdc5;
            font-size: 12px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            margin-left: 10px;
            transition: all 0.2s;
        }

        .partner-item:hover .arrow-badge {
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: #ffffff;
        }

        .empty-message {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            padding: 60px 20px;
            font-weight: 600;
        }

        /* 🌟 洗練されたローディングアニメーション */
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 14px;
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(28, 189, 197, 0.2);
            border-top: 3px solid #1cbdc5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* フッター */
        .footer {
            background-color: transparent;
            padding: 30px 20px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #1cbdc5;
        }

        .copyright {
            color: #94a3b8;
            font-size: 0.75rem;
            margin: 0;
            font-weight: 600;
        }

        /* 📱 レスポンシブ対応 */
        @media screen and (max-width: 768px) {
            .container {
                margin: 16px auto;
                padding: 0 16px;
            }

            .hamburger-btn {
                display: flex !important;
            }

            .nav-links {
                position: fixed !important;
                top: 54px !important;
                left: 0 !important;
                width: 100% !important;
                background: rgba(255, 255, 255, 0.98) !important;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
                flex-direction: column !important;
                padding: 24px 0 !important;
                gap: 8px !important;
                z-index: 99 !important;
                opacity: 0 !important;
                pointer-events: none !important;
                transform: translateY(-10px) !important;
                transition: transform 0.3s ease, opacity 0.3s ease !important;
            }

            .nav-links.open {
                opacity: 1 !important;
                pointer-events: auto !important;
                transform: translateY(0) !important;
            }

            .nav-item {
                font-size: 16px !important;
                padding: 12px 0 !important;
                width: 80% !important;
                text-align: center !important;
                border-radius: 10px;
            }

            .btn-logout {
                width: 80% !important;
                padding: 12px 0 !important;
                margin: 0 auto !important;
            }

            .hamburger-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg) !important; }
            .hamburger-btn.open span:nth-child(2) { opacity: 0 !important; transform: scale(0) !important; }
            .hamburger-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg) !important; }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo" onclick="location.href='main.html'">平工マッチング</div>

        <button class="hamburger-btn" id="hud-menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" id="nav-links">
            <a class="nav-item" href="main.html">ホーム</a>
            <a class="nav-item active" href="messages.html">
                メッセージ
                <span id="unread-badge" class="unread-badge" style="display: none;">0</span>
            </a>
            <a class="nav-item" href="profile.html">マイページ</a>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </nav>
    </header>

    <main class="container">
        <div class="dm-card">
            <div class="dm-header">
                <h2>メッセージ一覧</h2>
            </div>
            <div id="partner-list">
                <div class="loading-box">
                    <div class="spinner"></div>
                    <span>読み込み中...</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="main.html">ホーム</a>
                <a href="messages.html">メッセージ</a>
                <a href="profile.html">マイページ</a>
            </div>
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // 🔒 未ログインガード
        if (!localStorage.getItem("userEmail")) {
            window.location.href = "index.html";
        }

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwgAQAPaBr-HNvqToDDrspDfL02s_YN89atcNrZfVGEESNnRLC_9vnqC0vz8hHyvUrS/exec";
        
        const bgGradients = [
            "linear-gradient(135deg, #1cbdc5 0%, #119299 100%)",
            "linear-gradient(135deg, #0284c7 0%, #06b6d4 100%)",
            "linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)",
            "linear-gradient(135deg, #0d9488 0%, #115e59 100%)",
            "linear-gradient(135deg, #6366f1 0%, #4338ca 100%)"
        ];

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        function closeMenu() {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");
        }

        async function loadChatPartners() {
            const myEmail = localStorage.getItem("userEmail");
            const listDiv = document.getElementById("partner-list");

            listDiv.innerHTML = `
                <div class="loading-box">
                    <div class="spinner"></div>
                    <span>データを読み込み中...</span>
                </div>
            `;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getChatPartners", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success") {
                    const partners = result.message;
                    listDiv.innerHTML = "";

                    if (partners.length === 0) {
                        listDiv.innerHTML = `
                            <div class="empty-message">
                                メッセージはまだありません。<br>
                                ホーム画面から気になる人にチャットを送ってみましょう！
                            </div>
                        `;
                    } else {
                        partners.forEach((partner, index) => {
                            const initial = partner.name ? partner.name.charAt(0) : "未";
                            const avatarBg = bgGradients[index % bgGradients.length];

                            const item = document.createElement("div");
                            item.className = "partner-item";
                            item.onclick = () => openChat(partner.email);

                            item.innerHTML = `
                                <div class="avatar-ring">
                                    <div class="partner-avatar" style="background: ${avatarBg};">
                                        ${initial}
                                    </div>
                                </div>
                                <div class="partner-content-box">
                                    <div class="partner-name">${partner.name}</div>
                                    <div class="partner-email">${partner.email}</div>
                                </div>
                                <div class="arrow-badge">開く ➔</div>
                            `;
                            listDiv.appendChild(item);
                        });
                    }
                } else {
                    listDiv.innerHTML = `<div class="empty-message">データの取得に失敗しました。</div>`;
                }
            } catch (e) {
                console.error(e);
                listDiv.innerHTML = `<div class="empty-message">通信エラーが発生しました。</div>`;
            }
        }

        // 🔴 未読件数の更新処理
        async function updateUnreadBadge() {
            const myEmail = localStorage.getItem("userEmail");
            const badge = document.getElementById("unread-badge");
            if (!myEmail || !badge) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getUnreadCount", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success" && result.message) {
                    const count = result.message.unreadCount || 0;
                    if (count > 0) {
                        badge.innerText = count > 99 ? "99+" : count;
                        badge.style.display = "inline-block";
                    } else {
                        badge.style.display = "none";
                    }
                }
            } catch (e) {
                console.error("未読チェックエラー:", e);
            }
        }

        function openChat(email) {
            localStorage.setItem("chatTarget", email);
            location.href = 'chat.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = () => {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");

            localStorage.removeItem("chatTarget");

            loadChatPartners();
            updateUnreadBadge();

            // 3秒おきに未読チェック
            setInterval(updateUnreadBadge, 3000);
        };
    </script>
</body>

</html>
