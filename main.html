<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - 平工マッチング</title>

    <style>
        /* =====================================
           ページ全体の基本スタイル
        ===================================== */
        body {
            margin: 0;
            background-color: #f8fafc;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            /* 画面が極端に狭い時にロゴとメニューを折り返す */
            gap: 10px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1cbdc5;
            cursor: pointer;
        }

        /* 常に表示されるナビゲーションリンク */
        .nav-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-item {
            cursor: pointer;
            color: #666;
            font-weight: bold;
            padding: 5px 0;
            text-decoration: none;
        }

        .nav-item.active {
            color: #1cbdc5;
            border-bottom: 2px solid #1cbdc5;
        }

        .btn-logout {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background: none;
            cursor: pointer;
            color: #ffffff;
            background-color: #ff0000;
        }

        /* =====================================
           レイアウト・コンテンツエリア
        ===================================== */
        .container {
            display: flex;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            gap: 30px;
        }

        .sidebar {
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            background: transparent;
            box-shadow: none;
            flex-shrink: 0;
        }

        .main-area {
            flex: 1;
        }

        #recruit-form-area .sidebar-form {
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        #form-title {
            font-size: 18px;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
            border-left: 4px solid #1cbdc5;
            padding-left: 10px;
        }

        #rec-grade,
        #rec-dept,
        #rec-content {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #333333;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }

        #user-name {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            color: rgb(0, 0, 0);
            background-color: #e2e8f0;
            cursor: not-allowed;
            border-color: #cbd5e1;
            outline: none;
            margin-bottom: 10px;
        }

        #rec-grade:focus,
        #rec-dept:focus,
        #rec-content:focus {
            border-color: #1cbdc5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(28, 189, 197, 0.15);
        }

        #rec-content {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .btn-search,
        #submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #1cbdc5 0%, #17a2b8 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(28, 189, 197, 0.2);
            box-sizing: border-box;
        }

        .btn-search:hover,
        #submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(28, 189, 197, 0.35);
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .user-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.01);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .user-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(28, 189, 197, 0.12);
        }

        .user-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #e6f9fa;
            color: #1cbdc5;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .btn-match {
            background: #1cbdc5;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        .big-profile-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            transition: 0.2s;
        }

        .mypage-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 40px;
        }

        #mypage-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .btn-refresh {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #000000;
            background-color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            padding: 0;
            overflow: hidden;
        }

        .refresh-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .footer {
            background-color: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding: 24px 20px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .copyright {
            color: #999;
            font-size: 0.8rem;
            margin: 0;
        }

        /* 画面幅が狭いスマホの時はコンテンツを縦並びにするだけの最低限の設定 */
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 10px;
            }

            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo" onclick="location.href='main.html'">平工マッチング</div>

        <!-- メニューは常に横並びで表示（3本線ボタンは削除） -->
        <nav class="nav-links">
            <span class="nav-item" id="tab-recruit-btn" onclick="switchTab('recruit')">募集投稿</span>
            <span class="nav-item active" id="tab-search-btn" onclick="switchTab('search')">ユーザーを探す</span>
            <span class="nav-item" onclick="location.href='messages.html'">メッセージ</span>
            <span class="nav-item" onclick="location.href='profile.html'">マイページ</span>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </nav>
    </header>

    <main class="container">
        <!-- サイドバー -->
        <div class="sidebar">
            <div class="mypage-area">
                <img id="profile-icon" class="big-profile-icon" src="" alt="icon"
                    onclick="location.href='profile.html'">
                <div id="mypage-text">マイページ</div>
            </div>

            <div id="my-post-area"
                style="border: 1.5px solid #1cbdc5; background: #fff; padding: 15px; border-radius: 8px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; width: 100%; box-sizing: border-box;">
                <h4
                    style="margin: 0 0 10px 0; color: #333; border-bottom: 2px solid #1cbdc5; padding-bottom: 5px; font-size: 14px;">
                    📢 あなたの現在の募集</h4>
                <div id="my-post-content" style="font-size: 13px; color: #666;">投稿している募集はありません。</div>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="main-area">
            <section id="recruit-form-area" style="display: none;">
                <div class="sidebar-form">
                    <h3 id="form-title">募集を投稿する</h3>
                    <input type="text" id="user-name" placeholder="マイページで名前を設定してください" readonly
                        style="margin-bottom:10px;" />
                    <select id="rec-grade" style="margin-bottom:10px;">
                        <option value="1年">1年</option>
                        <option value="2年">2年</option>
                        <option value="3年">3年</option>
                    </select>
                    <select id="rec-dept" style="margin-bottom:10px;">
                        <option value="機械工学科">機械工学科</option>
                        <option value="電気工学科">電気工学科</option>
                        <option value="制御工学科">制御工学科</option>
                        <option value="土木環境工学科">土木環境工学科</option>
                        <option value="情報工学科">情報工学科</option>
                    </select>
                    <textarea id="rec-content" rows="4" placeholder="募集内容を入力してください"
                        style="margin-bottom:10px;"></textarea>
                    <button class="btn-search" id="submit-btn" onclick="submitRecruitment()">投稿する</button>
                </div>
            </section>

            <div class="main-content">
                <section id="search-area">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                        <h2>他ユーザーの募集一覧</h2>
                        <button onclick="loadRecruitments()" class="btn-refresh">
                            <img class="refresh-icon"
                                src="https://kotonohaworks.com/free-icons/wp-content/uploads/kkrn_icon_koushin_17.png"
                                alt="更新">
                        </button>
                    </div>
                    <div class="user-grid" id="user-list">読み込み中...</div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="main.html">ホーム</a>
                <a href="messages.html">メッセージ</a>
                <a href="profile.html">マイページ</a>
            </div>
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwITrmNEOqPX9Xe59kAN7gEeyz4R3RocqhC4H6P27n66TS5oWsTQdhyCo1-gl8trb5F/exec";

        // メニューの開閉に関するJS（toggleMenu, closeMenu）はすべて削除

        function switchTab(mode) {
            document.getElementById("recruit-form-area").style.display = (mode === 'recruit') ? "block" : "none";
            document.getElementById("search-area").style.display = (mode === 'search') ? "block" : "none";
            document.getElementById("tab-recruit-btn").classList.toggle("active", mode === 'recruit');
            document.getElementById("tab-search-btn").classList.toggle("active", mode === 'search');
            if (mode === 'recruit') {
                document.getElementById("user-name").value = localStorage.getItem("userName") || "";
            }
        }

        async function loadRecruitments() {
            const myEmail = localStorage.getItem("userEmail");
            const listDiv = document.getElementById("user-list");
            const myPostContentDiv = document.getElementById("my-post-content");

            listDiv.innerHTML = `<p>データを更新中...</p>`;
            myPostContentDiv.innerHTML = "更新中...";

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getRecruitments", email: myEmail })
                });

                const result = await res.json();
                listDiv.innerHTML = "";
                myPostContentDiv.innerHTML = "投稿している募集はありません。";

                const items = result.message.reverse();
                const myPosts = items.filter(item => item.email === myEmail);
                const otherPosts = items.filter(item => item.email !== myEmail);

                if (myPosts.length > 0) {
                    const myItem = myPosts[0];
                    myPostContentDiv.innerHTML = `
                        <div style="font-weight: bold; margin-bottom: 5px; color:#1cbdc5;">${myItem.grade} | ${myItem.dept}</div>
                        <div style="word-wrap: break-word; line-height: 1.4; margin-bottom: 10px;">${myItem.content}</div>
                        <button onclick="deleteMyRecruitment()" style="width: 100%; background: #ff4d4d; color: white; border: none; padding: 5px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">
                            ✖ この募集を削除する
                        </button>
                    `;
                }

                if (otherPosts.length === 0) {
                    listDiv.innerHTML = "<p>現在、ユーザーの募集はありません</p>";
                } else {
                    const fragment = document.createDocumentFragment();
                    otherPosts.forEach(item => {
                        const card = document.createElement("div");
                        card.className = "user-card";
                        card.innerHTML = `
                            <div class="user-badge">${item.grade} | ${item.dept}</div>
                            <h3>${item.name}</h3>
                            <p>${item.content}</p>
                            <button class="btn-match" onclick="startChat('${item.email}')">チャット</button>
                        `;
                        fragment.appendChild(card);
                    });
                    listDiv.appendChild(fragment);
                }

            } catch (e) {
                console.error(e);
                listDiv.innerText = "読み込みエラーが発生しました。";
            }
        }

        async function deleteMyRecruitment() {
            if (!confirm("本当にこの募集を削除しますか？")) return;
            const myEmail = localStorage.getItem("userEmail");
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "deleteRecruitment", email: myEmail })
                });
                const result = await res.json();
                if (result.status === "success") {
                    alert("募集を削除しました。");
                    loadRecruitments();
                } else {
                    alert("削除に失敗しました。");
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
            }
        }

        async function submitRecruitment() {
            const data = {
                mode: "postRecruitment",
                name: localStorage.getItem("userName"),
                grade: document.getElementById("rec-grade").value,
                dept: document.getElementById("rec-dept").value,
                content: document.getElementById("rec-content").value,
                email: localStorage.getItem("userEmail")
            };
            await fetch(GAS_URL, { method: "POST", body: JSON.stringify(data) });
            alert("投稿しました");
            switchTab('search');
            loadRecruitments();
            document.getElementById("rec-content").value = "";
        }

        function startChat(email) {
            localStorage.setItem("chatTarget", email);
            location.href = 'messages.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = () => {
            const userName = localStorage.getItem("userName");
            const profileImage = localStorage.getItem("profileImage");
            document.getElementById("mypage-text").innerText = userName || "マイページ";

            if (profileImage) {
                document.getElementById("profile-icon").src = profileImage;
            } else {
                document.getElementById("profile-icon").src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            }
            loadRecruitments();
        };
    </script>
</body>

</html>
