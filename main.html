<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - 平工マッチング</title>

    <!-- favicon 404エラー防止用のダミーアイコン設定 -->
    <link rel="icon" href="data:,">

    <style>
        /* =====================================
           💡 全体的なモダン調の基本スタイル
        ===================================== */
        body {
            margin: 0;
            background: radial-gradient(circle at 10% 20%, rgba(238, 252, 253, 1) 0%, rgba(218, 241, 245, 1) 90%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ナビゲーションバー：洗練されたグラスモフィズム */
        .navbar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item {
            cursor: pointer;
            color: #64748b;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-item:hover {
            background-color: rgba(28, 189, 197, 0.06);
            color: #1cbdc5;
        }

        .nav-item.active {
            color: #1cbdc5;
            background-color: rgba(28, 189, 197, 0.1);
        }

        /* 🔴 赤色の未読バッジ */
        .unread-badge {
            position: absolute;
            top: 2px;
            right: 4px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
            min-width: 14px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-logout {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background-color: #ef4444;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
            transition: all 0.2s;
        }

        .btn-logout:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.25);
        }

        /* ハンバーガーボタン */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 110;
        }

        .hamburger-btn span {
            width: 100%;
            height: 2.5px;
            background-color: #1e293b;
            border-radius: 3px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* =====================================
           レイアウト・コンテンツエリア
        ===================================== */
        .container {
            display: flex;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            gap: 40px;
        }

        .sidebar {
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .main-area {
            flex: 1;
        }

        /* 募集投稿フォーム */
        #recruit-form-area .sidebar-form {
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px -4px rgba(24, 76, 92, 0.05);
            box-sizing: border-box;
        }

        #form-title {
            font-size: 1.15rem;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #form-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            border-radius: 4px;
        }

        select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            font-size: 14px;
            color: #1e293b;
            background-color: rgba(248, 250, 252, 0.8);
            box-sizing: border-box;
            transition: all 0.25s ease;
            outline: none;
            -webkit-appearance: none;
        }

        #user-name {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            color: #64748b;
            background-color: #e2e8f0;
            cursor: not-allowed;
            outline: none;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 14px;
        }

        select:focus, textarea:focus {
            border-color: #1cbdc5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(28, 189, 197, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 130px;
            line-height: 1.6;
        }

        .btn-search, #submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(28, 189, 197, 0.25);
            box-sizing: border-box;
        }

        .btn-search:hover, #submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(28, 189, 197, 0.4);
        }

        /* ユーザー募集一覧グリッド */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 28px 24px;
            border-radius: 20px;
            text-align: left;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -4px rgba(28, 189, 197, 0.12);
            background: #ffffff;
        }

        .user-card h3 {
            margin: 0 0 12px 0;
            font-size: 1.15rem;
            color: #1e293b;
            font-weight: 800;
        }

        .user-card p {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
            margin: 0 0 20px 0;
            flex: 1;
            white-space: pre-wrap;
        }

        .user-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(28, 189, 197, 0.1) 0%, rgba(17, 146, 153, 0.1) 100%);
            color: #1cbdc5;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            margin-bottom: 14px;
            align-self: flex-start;
        }

        .btn-match {
            background: #ffffff;
            color: #1cbdc5;
            border: 1.5px solid #1cbdc5;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none;
        }

        .btn-match:hover {
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: white;
            border-color: transparent;
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(28, 189, 197, 0.25);
        }

        /* マイページアイコン */
        .big-profile-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(24, 76, 92, 0.12);
            border: 3px solid #ffffff;
            transition: all 0.25s;
        }

        .big-profile-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 24px rgba(24, 76, 92, 0.2);
        }

        .mypage-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        #mypage-text {
            font-size: 16px;
            font-weight: 800;
            color: #1e293b;
        }

        /* 更新ボタン */
        .btn-refresh {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background-color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }

        .btn-refresh:hover {
            background-color: #ffffff;
            border-color: #1cbdc5;
            transform: rotate(30deg);
        }

        .refresh-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        /* 洗練されたローディングアニメーション */
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            grid-column: 1 / -1;
            padding: 60px 20px;
            gap: 14px;
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(28, 189, 197, 0.2);
            border-top: 3px solid #1cbdc5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 🔔 ポンっと出るトースト通知のスタイル */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid #1cbdc5;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(28, 189, 197, 0.25);
            display: flex;
            align-items: center;
            gap: 14px;
            max-width: 320px;
            cursor: pointer;
            transform: translateY(-100px) scale(0.9);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-notification.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .toast-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            flex-shrink: 0;
        }

        .toast-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .toast-title {
            font-size: 13px;
            font-weight: 800;
            color: #1cbdc5;
        }

        .toast-sender {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }

        .toast-text {
            font-size: 12.5px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* フッター */
        .footer {
            background-color: transparent;
            padding: 30px 20px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #1cbdc5;
        }

        .copyright {
            color: #94a3b8;
            font-size: 0.75rem;
            margin: 0;
            font-weight: 600;
        }

        /* 📱 レスポンシブ対応 */
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 16px;
                margin: 10px auto;
                gap: 24px;
            }

            .sidebar {
                width: 100%;
            }

            .toast-notification {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
            }

            .hamburger-btn {
                display: flex !important;
            }

            .nav-links {
                position: fixed !important;
                top: 54px !important;
                left: 0 !important;
                width: 100% !important;
                background: rgba(255, 255, 255, 0.98) !important;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
                flex-direction: column !important;
                padding: 24px 0 !important;
                gap: 8px !important;
                z-index: 99 !important;
                opacity: 0 !important;
                pointer-events: none !important;
                transform: translateY(-10px) !important;
                transition: transform 0.3s ease, opacity 0.3s ease !important;
            }

            .nav-links.open {
                opacity: 1 !important;
                pointer-events: auto !important;
                transform: translateY(0) !important;
            }

            .nav-item {
                font-size: 16px !important;
                padding: 12px 0 !important;
                width: 80% !important;
                text-align: center !important;
                border-radius: 10px;
            }

            .btn-logout {
                width: 80% !important;
                padding: 12px 0 !important;
                margin: 0 auto !important;
            }

            .hamburger-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg) !important; }
            .hamburger-btn.open span:nth-child(2) { opacity: 0 !important; transform: scale(0) !important; }
            .hamburger-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg) !important; }
        }
    </style>

    
</head>

<body>

    <!-- 🔔 トースト通知のポップアップ容器 -->
    <div id="toast-notification" class="toast-notification" onclick="clickToast()">
        <div class="toast-icon">💬</div>
        <div class="toast-content">
            <div class="toast-title">新着メッセージ</div>
            <div class="toast-sender" id="toast-sender-name">ユーザー</div>
            <div class="toast-text" id="toast-text-body">メッセージが届きました</div>
        </div>
    </div>

    <header class="navbar">
        <div class="logo" onclick="location.href='main.html'">平工マッチング</div>

        <button class="hamburger-btn" id="hud-menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" id="nav-links">
            <span class="nav-item" id="tab-recruit-btn" onclick="switchTab('recruit'); closeMenu();">募集投稿</span>
            <span class="nav-item active" id="tab-search-btn" onclick="switchTab('search'); closeMenu();">ユーザーを探す</span>
            <span class="nav-item" onclick="location.href='messages.html'">
                メッセージ
                <span id="unread-badge" class="unread-badge" style="display: none;">0</span>
            </span>
            <span class="nav-item" onclick="location.href='profile.html'">マイページ</span>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </nav>
    </header>

    <main class="container">
        <!-- サイドバー -->
        <div class="sidebar">
            <div class="mypage-area">
                <img id="profile-icon" class="big-profile-icon" src="" alt="icon"
                    onclick="location.href='profile.html'">
                <div id="mypage-text">マイページ</div>
            </div>

            <div id="my-post-area"
                style="background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(28, 189, 197, 0.2); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(24, 76, 92, 0.02); text-align: left; width: 100%; box-sizing: border-box;">
                <h4 style="margin: 0 0 12px 0; color: #1e293b; font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px;">
                    📢 あなたの現在の募集
                </h4>
                <div id="my-post-content" style="font-size: 13px; color: #64748b; line-height: 1.5;">投稿している募集はありません。</div>
            </div>
        </div>

        <div class="main-area">
            <section id="recruit-form-area" style="display: none;">
                <div class="sidebar-form">
                    <h3 id="form-title">募集を投稿する</h3>
                    <input type="text" id="user-name" placeholder="マイページで名前を設定してください" readonly
                        style="margin-bottom:12px;" />
                    <select id="rec-grade" style="margin-bottom:12px;">
                        <option value="1年">1年</option>
                        <option value="2年">2年</option>
                        <option value="3年">3年</option>
                    </select>
                    <select id="rec-dept" style="margin-bottom:12px;">
                        <option value="機械工学科">機械工学科</option>
                        <option value="電気工学科">電気工学科</option>
                        <option value="制御工学科">制御工学科</option>
                        <option value="土木環境工学科">土木環境工学科</option>
                        <option value="情報工学科">情報工学科</option>
                    </select>
                    <textarea id="rec-content" rows="4" placeholder="募集内容を入力してください"
                        style="margin-bottom:16px;"></textarea>
                    <button class="btn-search" id="submit-btn" onclick="submitRecruitment()">投稿する</button>
                </div>
            </section>

            <div class="main-content">
                <section id="search-area">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                        <h2 style="font-size: 1.35rem; font-weight: 800; margin: 0; color: #1e293b;">他ユーザーの募集一覧</h2>
                        <button onclick="loadRecruitments()" class="btn-refresh">
                            <img class="refresh-icon"
                                src="https://kotonohaworks.com/free-icons/wp-content/uploads/kkrn_icon_koushin_17.png"
                                alt="更新">
                        </button>
                    </div>
                    <div class="user-grid" id="user-list">
                        <div class="loading-box">
                            <div class="spinner"></div>
                            <span>読み込み中...</span>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="main.html">ホーム</a>
                <a href="messages.html">メッセージ</a>
                <a href="profile.html">マイページ</a>
            </div>
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // 🔒 未ログインガード
        if (!localStorage.getItem("userEmail")) {
            window.location.href = "index.html";
        }

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwgAQAPaBr-HNvqToDDrspDfL02s_YN89atcNrZfVGEESNnRLC_9vnqC0vz8hHyvUrS/exec";

        let lastMessageTime = 0;
        let activeTargetEmail = "";

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        function closeMenu() {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");
        }

        function switchTab(mode) {
            document.getElementById("recruit-form-area").style.display = (mode === 'recruit') ? "block" : "none";
            document.getElementById("search-area").style.display = (mode === 'search') ? "block" : "none";
            document.getElementById("tab-recruit-btn").classList.toggle("active", mode === 'recruit');
            document.getElementById("tab-search-btn").classList.toggle("active", mode === 'search');
            if (mode === 'recruit') {
                document.getElementById("user-name").value = localStorage.getItem("userName") || "";
            }
        }

        async function loadRecruitments() {
            const myEmail = localStorage.getItem("userEmail");
            const listDiv = document.getElementById("user-list");
            const myPostContentDiv = document.getElementById("my-post-content");

            listDiv.innerHTML = `
                <div class="loading-box">
                    <div class="spinner"></div>
                    <span>データを更新中...</span>
                </div>
            `;
            myPostContentDiv.innerHTML = "更新中...";

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getRecruitments", email: myEmail })
                });

                const result = await res.json();
                listDiv.innerHTML = "";
                myPostContentDiv.innerHTML = "投稿している募集はありません。";

                const items = result.message.reverse();
                const myPosts = items.filter(item => item.email === myEmail);
                const otherPosts = items.filter(item => item.email !== myEmail);

                if (myPosts.length > 0) {
                    const myItem = myPosts[0];
                    myPostContentDiv.innerHTML = `
                        <div style="font-weight: 700; margin-bottom: 6px; color:#1cbdc5; font-size: 12px;">${myItem.grade} | ${myItem.dept}</div>
                        <div style="word-wrap: break-word; line-height: 1.5; margin-bottom: 12px; font-size: 13px; color:#475569;">${myItem.content}</div>
                        <button onclick="deleteMyRecruitment()" style="width: 100%; background: #ffe4e6; color: #e11d48; border: none; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; transition: background 0.2s;">
                            ✖ この募集を削除する
                        </button>
                    `;
                }

                if (otherPosts.length === 0) {
                    listDiv.innerHTML = "<p style='color: #64748b; font-size: 14px; grid-column: 1 / -1; text-align: center; padding: 40px 0;'>現在、ユーザーの募集はありません</p>";
                } else {
                    const fragment = document.createDocumentFragment();
                    otherPosts.forEach(item => {
                        const card = document.createElement("div");
                        card.className = "user-card";
                        card.innerHTML = `
                            <div class="user-badge">${item.grade} | ${item.dept}</div>
                            <h3>${item.name}</h3>
                            <p>${item.content}</p>
                            <button class="btn-match" onclick="startChat('${item.email}')">チャットを始める</button>
                        `;
                        fragment.appendChild(card);
                    });
                    listDiv.appendChild(fragment);
                }

            } catch (e) {
                console.error(e);
                listDiv.innerHTML = "<p style='color: #ef4444; font-size: 14px; grid-column: 1 / -1; text-align: center; padding: 40px 0;'>読み込みエラーが発生しました。</p>";
            }
        }

        async function deleteMyRecruitment() {
            if (!confirm("本当にこの募集を削除しますか？")) return;
            const myEmail = localStorage.getItem("userEmail");
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "deleteRecruitment", email: myEmail })
                });
                const result = await res.json();
                if (result.status === "success") {
                    alert("募集を削除しました。");
                    loadRecruitments();
                } else {
                    alert("削除に失敗しました。");
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
            }
        }

        async function submitRecruitment() {
            const data = {
                mode: "postRecruitment",
                name: localStorage.getItem("userName"),
                grade: document.getElementById("rec-grade").value,
                dept: document.getElementById("rec-dept").value,
                content: document.getElementById("rec-content").value,
                email: localStorage.getItem("userEmail")
            };
            await fetch(GAS_URL, { method: "POST", body: JSON.stringify(data) });
            alert("投稿しました");
            switchTab('search');
            loadRecruitments();
            document.getElementById("rec-content").value = "";
        }

        function startChat(email) {
            localStorage.setItem("chatTarget", email);
            location.href = 'chat.html';
        }

        async function updateUnreadBadge() {
            const myEmail = localStorage.getItem("userEmail");
            const badge = document.getElementById("unread-badge");
            if (!myEmail || !badge) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getUnreadCount", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success" && result.message) {
                    const count = result.message.unreadCount || 0;
                    if (count > 0) {
                        badge.innerText = count > 99 ? "99+" : count;
                        badge.style.display = "inline-block";
                    } else {
                        badge.style.display = "none";
                    }
                }
            } catch (e) {
                console.error("未読チェックエラー:", e);
            }
        }

        // 🔔 新着メッセージのトースト通知処理
        async function checkNewIncomingMessage() {
            const myEmail = localStorage.getItem("userEmail");
            if (!myEmail) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getLatestIncomingMessage", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success" && result.message) {
                    const msg = result.message;

                    if (lastMessageTime === 0) {
                        lastMessageTime = msg.time;
                        return;
                    }

                    if (msg.time > lastMessageTime) {
                        lastMessageTime = msg.time;
                        activeTargetEmail = msg.fromEmail;
                        showToast(msg.fromName, msg.text);
                        updateUnreadBadge(); // 通知が出たタイミングで未読数も更新
                    }
                }
            } catch (e) {
                console.error("新着メッセージチェックエラー:", e);
            }
        }

        function showToast(senderName, text) {
            document.getElementById("toast-sender-name").innerText = senderName;
            document.getElementById("toast-text-body").innerText = text;
            const toast = document.getElementById("toast-notification");
            
            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 5000);
        }

        function clickToast() {
            if (activeTargetEmail) {
                startChat(activeTargetEmail);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = () => {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");

            const userName = localStorage.getItem("userName");
            const profileImage = localStorage.getItem("profileImage");
            document.getElementById("mypage-text").innerText = userName || "マイページ";

            if (profileImage && profileImage !== "null") {
                document.getElementById("profile-icon").src = profileImage;
            } else {
                document.getElementById("profile-icon").src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            }
            
            loadRecruitments();
            updateUnreadBadge();

            // 定期チェック（3秒ごと）
            checkNewIncomingMessage();
            setInterval(() => {
                checkNewIncomingMessage();
                updateUnreadBadge();
            }, 3000);
        };
    </script>
</body>

</html>
