<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザーを探す - 平工マッチング</title>
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="theme.css?v=20260917c">
    <script src="ui.js"></script>
    <script src="online.js?v=20260917b" defer></script>
    <style>
        .split-page { max-width:1120px; margin:0 auto; padding:46px 24px 80px; }
        .split-hero, .search-panel { background:var(--ui-paper); border:1px solid var(--ui-line); border-radius:20px; box-shadow:0 12px 30px rgba(36,60,50,.06); }
        .split-hero { padding:30px; margin-bottom:22px; background:linear-gradient(135deg,var(--ui-green),#47755b); color:#fff; }
        .split-hero p { margin:0 0 8px; font-size:11px; letter-spacing:.18em; font-weight:800; opacity:.8; }
        .split-hero h1 { margin:0; font-size:clamp(28px,4vw,44px); line-height:1.2; letter-spacing:-.06em; }
        .split-hero small { display:block; margin-top:14px; color:rgba(255,255,255,.8); }
        .search-panel { padding:22px; margin-bottom:20px; }
        .search-row { display:flex; gap:10px; align-items:center; }
        .search-row input { flex:1; min-height:48px; padding:10px 14px; }
        .search-row button { min-height:48px; padding:0 16px; border:1px solid var(--ui-line); border-radius:10px; background:var(--ui-paper); color:var(--ui-green); font-weight:700; cursor:pointer; }
        .user-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
        .post-card { background:var(--ui-paper); border:1px solid var(--ui-line); border-radius:16px; padding:22px; box-shadow:0 10px 24px rgba(36,60,50,.05); }
        .post-card h2 { margin:12px 0 8px; font-size:20px; letter-spacing:-.04em; }
        .post-card p { color:var(--ui-muted); white-space:pre-wrap; overflow-wrap:anywhere; }
        .post-meta { display:flex; justify-content:space-between; gap:8px; color:var(--ui-muted); font-size:12px; }
        .countdown-badge { padding:5px 8px; background:#f5eee0; color:#82612c; border-radius:5px; font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; }
        .tag-list { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
        .tag { border:0; padding:5px 9px; border-radius:99px; background:var(--ui-soft); color:var(--ui-green); font-size:11px; cursor:pointer; }
        .quick-reaction-row, .card-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
        .quick-reaction-row button, .card-actions button { padding:8px 10px; border:1px solid var(--ui-line); border-radius:8px; background:var(--ui-paper); color:var(--ui-green); font-size:11px; cursor:pointer; }
        .card-actions .primary { flex:1; background:var(--ui-green); color:#fff; border-color:var(--ui-green); }
        .card-actions .danger { color:var(--ui-danger); }
        .empty { padding:50px 10px; text-align:center; color:var(--ui-muted); }
        @media(max-width:760px){.split-page{padding:28px 14px 60px}.search-row{align-items:stretch;flex-direction:column}.user-grid{grid-template-columns:1fr}.post-meta{align-items:flex-start;flex-direction:column}}
    </style>
</head>

<body data-page="users">
    <header class="navbar">
        <div class="logo" onclick="location.href='users.html'">平工マッチング</div>
        <button class="hamburger-btn" id="hud-menu-btn" type="button" onclick="toggleMenu()" aria-label="メニューを開く"><span></span><span></span><span></span></button>
        <nav class="nav-links" id="nav-links">
            <a class="nav-item" href="main.html?guide=1">使い方</a><a class="nav-item" href="recruit.html">募集投稿</a><a class="nav-item active" href="users.html">ユーザーを探す</a><a class="nav-item" href="messages.html">メッセージ <span id="unread-badge" class="unread-badge" style="display:none;">0</span></a><a class="nav-item" href="profile.html">マイページ</a><a class="nav-item" href="ai-study.html">AI学習相談</a><a class="nav-item" id="nav-admin-btn" style="display:none;color:#a84738;" href="admin.html">管理者</a><button type="button" class="btn-logout" onclick="logout();return false;">ログアウト</button>
        </nav>
    </header>
    <main class="split-page">
        <section class="split-hero"><p>FIND STUDY PARTNERS</p><h1>一緒に勉強できる人を探す。</h1><small>気になる募集を見つけたら、リアクションやチャットで相談を始められます。</small></section>
        <section class="search-panel"><div class="search-row"><input id="search-input" type="search" placeholder="教科・学科・内容・タグで検索"><button type="button" onclick="loadPosts()">更新</button></div></section>
        <section id="user-list" class="user-grid"><div class="empty">募集を読み込み中...</div></section>
    </main>
    <footer class="footer"><div class="footer-container"><div class="footer-links"><a href="recruit.html">募集投稿</a><a href="users.html">ユーザーを探す</a><a href="messages.html">メッセージ</a><a href="profile.html">マイページ</a><a href="terms.html">利用規約</a><a href="privacy.html">プライバシーポリシー</a></div><p class="copyright">&copy; 2026 Heiko Matching. All rights reserved.</p></div></footer>
    <script>
        const GAS_URL="https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";
        const userEmail=localStorage.getItem("userEmail")||""; let posts=[]; let countdownTimer=null; let reloadScheduled=false;
        if(!userEmail) location.href="index.html";
        const adminButton=document.getElementById("nav-admin-btn"); if(adminButton&&(localStorage.getItem("userId")==="admin"||userEmail==="admin")&&localStorage.getItem("isImpersonating")!=="true") adminButton.style.display="inline-block";
        function toggleMenu(){document.getElementById("nav-links").classList.toggle("open");document.getElementById("hud-menu-btn").classList.toggle("open");}
        function logout(){localStorage.clear();location.href="index.html";}
        function escapeHtml(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
        function duration(value){const n=Number(value);return [15,30,45,60,120,180,240,300,360,420,480,540,600,660,720,780,840,900,960,1020,1080,1140,1200,1260,1320,1380,1440].includes(n)?n:1440;}
        async function fetchGas(payload,timeoutMs=20000){const read=["getRecruitments","getNotificationSummary"].includes(payload.mode);let error;for(let i=0;i<(read?2:1);i++){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);try{const res=await fetch(GAS_URL,{method:"POST",body:JSON.stringify(payload),signal:controller.signal});if(!res.ok)throw new Error("通信エラー");const result=await res.json();if(result.status!=="success")throw new Error(result.message||"処理に失敗しました");return result;}catch(e){error=e;if(i+1<(read?2:1))await new Promise(resolve=>setTimeout(resolve,1200));}finally{clearTimeout(timer);}}throw error;}
        function render(){if(countdownTimer)clearInterval(countdownTimer);const list=document.getElementById("user-list");const key=document.getElementById("search-input").value.trim().toLowerCase();const filtered=posts.filter(item=>item.email!==userEmail&&(`${item.name} ${item.grade} ${item.dept} ${item.content} ${item.tags||""}`).toLowerCase().includes(key));if(!filtered.length){list.innerHTML='<div class="empty">該当する募集が見つかりませんでした。</div>';return;}list.innerHTML="";const fragment=document.createDocumentFragment();filtered.forEach(item=>{const card=document.createElement("article");card.className="post-card";const expiry=new Date(item.time).getTime()+duration(item.durationMinutes)*60000;const tags=(item.tags||"").split(/[,、\s]+/).filter(Boolean).map(tag=>`<button class="tag" type="button" data-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</button>`).join("");card.innerHTML=`<div class="post-meta"><span>${escapeHtml(item.grade)} ｜ ${escapeHtml(item.dept)}</span><span class="countdown-badge" data-expire="${expiry}">計算中...</span></div><h2>${escapeHtml(item.name)}</h2><p>${escapeHtml(item.content)}</p><div class="tag-list">${tags}</div><div class="quick-reaction-row"><button type="button" data-reaction="気になる！">👀 気になる！</button><button type="button" data-reaction="一緒に勉強したい！">✋ 一緒に勉強したい！</button><button type="button" data-reaction="質問したい！">❓ 質問したい！</button></div><div class="card-actions"><button class="primary" type="button" data-chat>チャットを始める</button><button class="danger" type="button" data-block>ブロック</button><button class="danger" type="button" data-report>通報</button></div>`;card.querySelector("[data-chat]").onclick=()=>{localStorage.setItem("chatTarget",item.email);location.href="chat.html";};card.querySelector("[data-block]").onclick=()=>blockUser(item.email,item.name);card.querySelector("[data-report]").onclick=()=>reportContent(item.email,item.content);card.querySelectorAll("[data-reaction]").forEach(btn=>btn.onclick=()=>sendReaction(item.email,item.name,btn.dataset.reaction,btn));card.querySelectorAll("[data-tag]").forEach(btn=>btn.onclick=()=>{document.getElementById("search-input").value=btn.dataset.tag;render();});fragment.appendChild(card);});list.appendChild(fragment);updateCountdown();countdownTimer=setInterval(updateCountdown,1000);}
        function updateCountdown(){let expired=false;document.querySelectorAll("[data-expire]").forEach(el=>{const seconds=Math.ceil((Number(el.dataset.expire)-Date.now())/1000);if(seconds<=0){el.textContent="⏰ 終了";expired=true;return;}el.textContent=`⏳ 残り ${Math.floor(seconds/3600)}時間${String(Math.floor(seconds%3600/60)).padStart(2,"0")}分${String(seconds%60).padStart(2,"0")}秒`;});if(expired&&!reloadScheduled){reloadScheduled=true;setTimeout(()=>{loadPosts().finally(()=>{reloadScheduled=false;});},500);}}
        async function loadPosts(){document.getElementById("user-list").innerHTML='<div class="empty">募集を読み込み中...</div>';try{const result=await fetchGas({mode:"getRecruitments",email:userEmail});posts=Array.isArray(result.message)?[...result.message].reverse():[];render();}catch(e){document.getElementById("user-list").innerHTML=`<div class="empty">${e.name==="AbortError"?"通信に時間がかかっています。":"募集を読み込めませんでした。"}</div>`;}}
        async function sendReaction(target,name,reaction,button){const key=`quick-reaction:${userEmail}:${target}:${reaction}`;if(Date.now()-Number(sessionStorage.getItem(key)||0)<600000){showNotice("同じリアクションは少し時間をおいてから送れます","error");return;}button.disabled=true;try{await fetchGas({mode:"sendMessage",from:userEmail,to:target,text:`募集を見て「${reaction}」とリアクションしました。`});sessionStorage.setItem(key,String(Date.now()));button.textContent="送信しました ✓";showNotice(name+"さんにリアクションを送りました","success");}catch(e){button.disabled=false;showNotice(e.message||"リアクションを送信できませんでした","error");}}
        function reason(){const value=prompt("通報理由を番号で入力してください。\n1: 嫌がらせ・迷惑行為\n2: 不適切な内容\n3: 性的な内容\n4: 脅迫・危険な発言\n5: 個人情報の掲載\n6: なりすまし\n7: スパム\n8: その他");return {1:"嫌がらせ・迷惑行為",2:"不適切な内容",3:"性的な内容",4:"脅迫・危険な発言",5:"個人情報の掲載",6:"なりすまし",7:"スパム",8:"その他"}[String(value||"").trim()]||"";}
        async function reportContent(target,content){const reportReason=reason();if(!reportReason)return;try{await fetchGas({mode:"reportContent",reporterId:userEmail,targetUserId:target,targetType:"recruitment",targetId:target,targetContent:content,reason:reportReason,detail:prompt("詳細があれば入力してください（任意）")||""});showNotice("通報を受け付けました","success");}catch(e){showNotice(e.message||"通報に失敗しました","error");}}
        async function blockUser(target,name){if(!confirm(`「${name}」さんをブロックしますか？`))return;try{await fetchGas({mode:"blockUser",blockerId:userEmail,blockedId:target});showNotice("ユーザーをブロックしました","success");loadPosts();}catch(e){showNotice(e.message||"ブロックに失敗しました","error");}}
        async function updateNotificationSummary(){const badge=document.getElementById("unread-badge");if(!badge)return;try{const result=await fetchGas({mode:"getNotificationSummary",email:userEmail},20000);const count=result.message.unreadCount||0;badge.textContent=count>99?"99+":count;badge.style.display=count?"inline-block":"none";}catch(e){}}
        document.getElementById("search-input").addEventListener("input",render);document.addEventListener("DOMContentLoaded",()=>{loadPosts();updateNotificationSummary();setInterval(()=>{if(document.visibilityState==="visible")updateNotificationSummary();},8000);});
    </script>
</body>
</html>
