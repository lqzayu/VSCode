<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット - 平工マッチング</title>

    <!-- favicon 404エラー防止用のダミーアイコン設定 -->
    <link rel="icon" href="data:,">

    <style>
        /* =====================================
           💡 main.html と統一したモダン調基本スタイル
        ===================================== */
        body {
            margin: 0;
            background: radial-gradient(circle at 10% 20%, rgba(238, 252, 253, 1) 0%, rgba(218, 241, 245, 1) 90%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ナビゲーションバー：洗練されたグラスモフィズム */
        .navbar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item {
            cursor: pointer;
            color: #64748b;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-item:hover {
            background-color: rgba(28, 189, 197, 0.06);
            color: #1cbdc5;
        }

        .nav-item.active {
            color: #1cbdc5;
            background-color: rgba(28, 189, 197, 0.1);
        }

        /* 🔴 未読バッジ */
        .unread-badge {
            position: absolute;
            top: 2px;
            right: 4px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
            min-width: 14px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-logout {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background-color: #ef4444;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
            transition: all 0.2s;
        }

        .btn-logout:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.25);
        }

        /* ハンバーガーボタン */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 110;
        }

        .hamburger-btn span {
            width: 100%;
            height: 2.5px;
            background-color: #1e293b;
            border-radius: 3px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* =====================================
           レイアウト・チャットカードエリア
        ===================================== */
        .container {
            flex: 1;
            width: 100%;
            max-width: 680px;
            margin: 24px auto;
            padding: 0 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .chat-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px -4px rgba(24, 76, 92, 0.05);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 160px);
            min-height: 500px;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.5);
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            background: rgba(28, 189, 197, 0.1);
            color: #1cbdc5;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-back:hover {
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: #ffffff;
        }

        .target-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1e293b;
        }

        /* チャットログエリア */
        .chat-box {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .my-message {
            align-self: flex-end;
            align-items: flex-end;
        }

        .partner-message {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            white-space: pre-wrap;
        }

        .my-message .bubble {
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .partner-message .bubble {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-bottom-left-radius: 4px;
        }

        /* 入力エリア */
        .chat-input-area {
            padding: 16px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            font-size: 14.5px;
            color: #1e293b;
            background-color: rgba(248, 250, 252, 0.9);
            box-sizing: border-box;
            transition: all 0.25s ease;
            outline: none;
        }

        .chat-input:focus {
            border-color: #1cbdc5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(28, 189, 197, 0.15);
        }

        .btn-send {
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(28, 189, 197, 0.25);
            flex-shrink: 0;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(28, 189, 197, 0.4);
        }

        /* 洗練されたローディングアニメーション */
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 14px;
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(28, 189, 197, 0.2);
            border-top: 3px solid #1cbdc5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 📱 レスポンシブ対応 */
        @media screen and (max-width: 768px) {
            .container {
                margin: 10px auto;
                padding: 0 12px;
            }

            .chat-card {
                height: calc(100dvh - 120px);
                border-radius: 18px;
            }

            .hamburger-btn {
                display: flex !important;
            }

            .nav-links {
                position: fixed !important;
                top: 54px !important;
                left: 0 !important;
                width: 100% !important;
                background: rgba(255, 255, 255, 0.98) !important;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
                flex-direction: column !important;
                padding: 24px 0 !important;
                gap: 8px !important;
                z-index: 99 !important;
                opacity: 0 !important;
                pointer-events: none !important;
                transform: translateY(-10px) !important;
                transition: transform 0.3s ease, opacity 0.3s ease !important;
            }

            .nav-links.open {
                opacity: 1 !important;
                pointer-events: auto !important;
                transform: translateY(0) !important;
            }

            .nav-item {
                font-size: 16px !important;
                padding: 12px 0 !important;
                width: 80% !important;
                text-align: center !important;
                border-radius: 10px;
            }

            .btn-logout {
                width: 80% !important;
                padding: 12px 0 !important;
                margin: 0 auto !important;
            }

            .hamburger-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg) !important; }
            .hamburger-btn.open span:nth-child(2) { opacity: 0 !important; transform: scale(0) !important; }
            .hamburger-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg) !important; }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo" onclick="location.href='main.html'">平工マッチング</div>

        <button class="hamburger-btn" id="hud-menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" id="nav-links">
            <a class="nav-item" href="main.html">ホーム</a>
            <a class="nav-item active" href="messages.html">
                メッセージ
                <span id="unread-badge" class="unread-badge" style="display: none;">0</span>
            </a>
            <a class="nav-item" href="profile.html">マイページ</a>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </nav>
    </header>

    <main class="container">
        <div class="chat-card">
            <div class="chat-header">
                <div class="chat-header-info">
                    <a href="messages.html" class="btn-back">◀ 一覧へ</a>
                    <span class="target-name" id="target-display-name">チャット</span>
                </div>
            </div>

            <div class="chat-box" id="chat-box">
                <div class="loading-box">
                    <div class="spinner"></div>
                    <span>チャット履歴を読み込み中...</span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="message-input" class="chat-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">送信</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
    </footer>

    <script>
        // 🔒 未ログインガード
        if (!localStorage.getItem("userEmail")) {
            window.location.href = "index.html";
        }

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwgAQAPaBr-HNvqToDDrspDfL02s_YN89atcNrZfVGEESNnRLC_9vnqC0vz8hHyvUrS/exec";
        
        let lastMessagesJson = ""; 

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        function closeMenu() {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");
        }

        // 👁️ チャットを開いた時に既読処理を行う関数
        async function markAsRead() {
            const myEmail = localStorage.getItem("userEmail");
            const targetEmail = localStorage.getItem("chatTarget");
            if (!myEmail || !targetEmail) return;

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        mode: "markAsRead",
                        myEmail: myEmail,
                        targetEmail: targetEmail
                    })
                });
                updateUnreadBadge(); // 既読処理後にバッジも消去・更新
            } catch (e) {
                console.error("既読処理エラー:", e);
            }
        }

        // 🔴 未読件数の更新処理
        async function updateUnreadBadge() {
            const myEmail = localStorage.getItem("userEmail");
            const badge = document.getElementById("unread-badge");
            if (!myEmail || !badge) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getUnreadCount", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success" && result.message) {
                    const count = result.message.unreadCount || 0;
                    if (count > 0) {
                        badge.innerText = count > 99 ? "99+" : count;
                        badge.style.display = "inline-block";
                    } else {
                        badge.style.display = "none";
                    }
                }
            } catch (e) {
                console.error("未読チェックエラー:", e);
            }
        }

        // 🚀 1通のメッセージを画面に即時描画（ラグ0秒化）
        function appendSingleMessage(from, text) {
            const chatBox = document.getElementById("chat-box");
            
            const loadingBox = chatBox.querySelector(".loading-box");
            if (loadingBox) loadingBox.remove();

            const myEmail = localStorage.getItem("userEmail");
            const isMe = (from === myEmail);
            const msgDiv = document.createElement("div");
            msgDiv.className = isMe ? "message my-message" : "message partner-message";
            msgDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 💬 メッセージ取得処理
        async function loadMessages() {
            const myEmail = localStorage.getItem("userEmail");
            const targetEmail = localStorage.getItem("chatTarget");

            if (!targetEmail) {
                window.location.href = "messages.html";
                return;
            }

            document.getElementById("target-display-name").innerText = targetEmail;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        mode: "getMessages",
                        user1: myEmail,
                        user2: targetEmail
                    })
                });
                const result = await res.json();

                if (result.status === "success") {
                    const messages = result.message || [];
                    const currentJson = JSON.stringify(messages);

                    if (currentJson === lastMessagesJson) {
                        return;
                    }

                    lastMessagesJson = currentJson;
                    const chatBox = document.getElementById("chat-box");
                    chatBox.innerHTML = "";

                    if (messages.length === 0) {
                        chatBox.innerHTML = `
                            <div class="loading-box" style="color:#64748b;">
                                <span>メッセージはまだありません。<br>最初のメッセージを送信してみましょう！</span>
                            </div>
                        `;
                    } else {
                        messages.forEach(msg => {
                            const isMe = (msg.from === myEmail);
                            const msgDiv = document.createElement("div");
                            msgDiv.className = isMe ? "message my-message" : "message partner-message";
                            msgDiv.innerHTML = `
                                <div class="bubble">${escapeHtml(msg.text)}</div>
                            `;
                            chatBox.appendChild(msgDiv);
                        });
                    }

                    chatBox.scrollTop = chatBox.scrollHeight;
                    markAsRead(); // メッセージ取得に成功したら既読処理を実行
                }
            } catch (e) {
                console.error("メッセージ取得エラー:", e);
            }
        }

        // 💬 メッセージ送信処理
        async function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            const myEmail = localStorage.getItem("userEmail");
            const targetEmail = localStorage.getItem("chatTarget");

            if (!text || !targetEmail) return;

            input.value = "";
            appendSingleMessage(myEmail, text);

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        mode: "sendMessage",
                        from: myEmail,
                        to: targetEmail,
                        text: text
                    })
                });
            } catch (e) {
                console.error("送信通信エラー:", e);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = () => {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");

            loadMessages();
            updateUnreadBadge();

            // 1.5秒おきに自動更新
            setInterval(() => {
                loadMessages();
                updateUnreadBadge();
            }, 1500);
        };
    </script>
</body>

</html>
