<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - 平工マッチング</title>
    <link rel="stylesheet" href="home-style.css">
    <style>
        /* ========================================================
           レスポンシブ & ハンバーガーメニュー追加スタイル
        ======================================================== */

        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 110;
        }

        .menu-toggle span {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        /* 画像操作ボタンの共通スタイル（サイズ拡大とフォントバランス調整） */
        .profile-img-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 160px;
            /* 140px から 160px に拡大 */
            height: 52px;
            /* 45px から 52px に拡大し、より押しやすく */
            border-radius: 8px;
            /* 大きさに合わせて角丸を少し滑らかに */
            font-size: 16px;
            /* 文字サイズを 14px から 16px に上げて視認性を向上 */
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
            text-align: center;
            margin: 0 8px;
            /* ボタン間の隙間を少し広げて調整 */
        }

        /* 画像選択ボタン専用（ミントグリーンの枠線） */
        .btn-select-label {
            background-color: #f5f5f5;
            color: #1cbdc5;
            border: 2px solid #1cbdc5;
        }

        .btn-select-label:hover {
            background-color: #e6f9fa;
        }

        /* 画像削除ボタン専用（赤色の枠線） */
        .btn-delete-action {
            background-color: #f5f5f5;
            color: #ff4d4d;
            border: 2px solid #ff4d4d;
        }

        .btn-delete-action:hover {
            background-color: #fff5f5;
        }

        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column !important;
                display: flex;
                padding: 10px;
                box-sizing: border-box;
            }

            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: -100%;
                left: 0;
                width: 100%;
                background: rgba(255, 255, 255, 0.98);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
                flex-direction: column;
                padding: 80px 0 30px 0;
                gap: 20px;
                transition: top 0.4s cubic-bezier(0.25, 1, 0.5, 1);
                z-index: 100;
            }

            .nav-links.active {
                top: 0;
            }

            .nav-item {
                margin-right: 0 !important;
                font-size: 18px;
                padding: 10px 0;
                width: 100%;
                text-align: center;
            }

            .btn-logout {
                margin-top: 10px;
                width: 80%;
                text-align: center;
                padding: 12px 0;
            }

            .menu-toggle.active span:nth-child(1) {
                transform: translateY(9px) rotate(45deg);
            }

            .menu-toggle.active span:nth-child(2) {
                opacity: 0;
            }

            .menu-toggle.active span:nth-child(3) {
                transform: translateY(-9px) rotate(-45deg);
            }

            .profile-card {
                margin: 20px auto !important;
                padding: 40px 20px !important;
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
            }

            .input-large {
                font-size: 16px !important;
                padding: 12px !important;
            }

            .btn-large {
                font-size: 18px !important;
                padding: 14px 0 !important;
            }

            .profile-card h2 {
                font-size: 24px !important;
                margin-bottom: 25px !important;
            }

            /* スマホ環境でボタンが画面幅に収まるよう自動調整するコンテナ */
            .profile-btn-group {
                display: flex;
                justify-content: center;
                width: 100%;
            }

            /* 横幅が非常に狭いスマホでも並びが崩れないよう調整 */
            .profile-img-btn {
                width: 45% !important;
                /* スマホ時は画面幅に応じた比率に可変 */
                max-width: 160px;
                margin: 0 4px;
                font-size: 15px !important;
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="logo" onclick="location.href='home.html'">平工マッチング</div>

        <button class="menu-toggle" id="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" id="nav-links">
            <span class="nav-item" onclick="location.href='home.html'">ホーム</span>
            <span class="nav-item" onclick="location.href='messages.html'">メッセージ</span>
            <span class="nav-item active">マイページ</span>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </div>
    </header>

    <main class="container">
        <div class="profile-card">
            <h2>プロフィール設定</h2>

            <div class="mypage-area">
                <label>プロフィール画像</label>

                <div style="margin: 20px 0;">
                    <img id="profile-icon" class="big-profile-icon2" src="" alt="icon"
                        style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; cursor: pointer; margin: 0 auto; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
                </div>

                <div class="profile-btn-group"
                    style="margin: 25px auto; display: flex; justify-content: center; align-items: center;">
                    <label for="profile-image" class="profile-img-btn btn-select-label">
                        画像を選択
                    </label>
                    <input type="file" id="profile-image" accept="image/*" style="display: none;"
                        onchange="autoSaveImage()">

                    <button type="button" class="profile-img-btn btn-delete-action" onclick="clearProfileImage()">
                        画像を削除
                    </button>
                </div>

                <input type="text" id="rec-name" class="input-large" placeholder="名前を入力してください">
                <button class="btn-large" onclick="saveProfile()">保存する</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="home.html">ホーム</a>
                <a href="messages.html">メッセージ</a>
                <a href="mypages.html">マイページ</a>
            </div>
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById("menu-toggle").classList.toggle("active");
            document.getElementById("nav-links").classList.toggle("active");
        }

        window.onload = () => {
            document.getElementById("rec-name").value = localStorage.getItem("userName") || "";

            const profileImage = localStorage.getItem("profileImage");
            const profileIconEl = document.getElementById("profile-icon");

            if (profileImage) {
                profileIconEl.src = profileImage;
            } else {
                profileIconEl.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            }
        };

        function autoSaveImage() {
            const file = document.getElementById("profile-image").files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    localStorage.setItem("profileImage", e.target.result);
                    document.getElementById("profile-icon").src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function clearProfileImage() {
            if (!confirm("プロフィール画像を削除して初期アイコンに戻しますか？")) return;

            localStorage.removeItem("profileImage");
            document.getElementById("profile-icon").src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            document.getElementById("profile-image").value = "";

            alert("画像を削除しました。変更を確定するには保存ボタンを押してください。");
        }

        function saveProfile() {
            const name = document.getElementById("rec-name").value;
            if (!name) return alert("名前を入力してください");
            localStorage.setItem("userName", name);

            const file = document.getElementById("profile-image").files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    localStorage.setItem("profileImage", e.target.result);
                    finishSave();
                };
                reader.readAsDataURL(file);
            } else {
                finishSave();
            }
        }

        function finishSave() {
            alert("保存しました");
            location.href = 'home.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>

</html>
