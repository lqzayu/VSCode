        }

    <script>
        const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";

        let cropper = null;
        let videoStream = null;
        let faceMesh = null;
        let lastLandmarks = null;
        let faceFrameRequest = null;
        let faceFrameCallback = null;
        let faceProcessing = false;
        let lastFaceCheck = 0;
        let lastFaceSeen = 0;
        let cameraSession = 0;
        const faceCheckInterval = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 100 : 66;

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        async function syncProfileFromServer() {
            const userId = localStorage.getItem("userId") || localStorage.getItem("userEmail");
            if (!userId) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getUserProfile", userId: userId })
                });
                const result = await res.json();
                if (result.status !== "success" || !result.message) return;

                const name = String(result.message.name || result.message.userId || "").trim();
                const image = String(result.message.profileImage || "").trim();
                localStorage.setItem("userName", name);
                localStorage.setItem("profileImage", image);

                document.getElementById("username-input").value = name;
                document.getElementById("profile-icon").src = image || DEFAULT_AVATAR;
            } catch (e) {
                console.error("プロフィール情報の同期エラー:", e);
            }
        }

        async function updateUnreadBadge() {
            const myEmail = localStorage.getItem("userEmail");
            const badge = document.getElementById("unread-badge");
            if (!myEmail || !badge) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getUnreadCount", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success" && result.message) {
                    const count = result.message.unreadCount || 0;
                    if (count > 0) {
                        badge.innerText = count > 99 ? "99+" : count;
                        badge.style.display = "inline-block";
                    } else {
                        badge.style.display = "none";
                    }
                }
            } catch (e) {
                console.error("未読チェックエラー:", e);
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const cropImage = document.getElementById("cropImage");
                cropImage.src = e.target.result;

                document.getElementById("cropModal").style.display = "flex";

                if (cropper) { cropper.destroy(); }
                cropper = new Cropper(cropImage, {
                    aspectRatio: 1, viewMode: 1, autoCropArea: 0.8, background: false
                });
            };
            reader.readAsDataURL(file);
        }

        function executeCrop() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({
                width: 300,
                height: 300,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: "high"
            });
            document.getElementById("profile-icon").src = canvas.toDataURL("image/jpeg", 0.6);
            closeCropModal();
        }

        function closeCropModal() {
            document.getElementById("cropModal").style.display = "none";
            document.getElementById("image-input").value = "";
            if (cropper) { cropper.destroy(); cropper = null; }
        }

        function deleteImage() {
            document.getElementById("profile-icon").src = DEFAULT_AVATAR;
            document.getElementById("image-input").value = "";
        }

        async function saveProfile() {
            const name = document.getElementById("username-input").value.trim();
            const imageSrc = document.getElementById("profile-icon").src;
            const email = localStorage.getItem("userEmail");

            if (!name) { alert("表示名を入力してください"); return; }
            if (!email) { alert("ログイン情報が見つかりません。一度再ログインしてください。"); return; }

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        mode: "updateProfile",
                        email: email,
                        name: name,
                        profileImage: imageSrc
                    })
                });

                const result = await res.json();
                if (result.status === "success") {
                    localStorage.setItem("userName", name);
                    localStorage.setItem("profileImage", imageSrc);
                    alert("プロフィールを保存しました！");
                    location.href = "main.html";
                } else {
                    alert("保存に失敗しました: " + result.message);
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
                console.error(e);
            }
        }

        async function deleteAccount() {
            const isConfirmed = confirm("ユーザー情報を削除すると、現在のユーザーとして平工マッチングにアクセスすることができなくなります。よろしいですか？");
            if (!isConfirmed) return;

            const email = localStorage.getItem("userEmail");
            if (!email) {
                alert("ログイン情報が見つかりません。");
                return;
            }

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        mode: "deleteAccount",
                        email: email
                    })
                });

                const result = await res.json();
                if (result.status === "success") {
                    alert("ユーザー情報を削除しました。");
                    localStorage.clear();
                    window.location.href = "index.html";
                } else {
                    alert("削除に失敗しました: " + result.message);
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
                console.error(e);
            }
        }

        async function loadBlockedUsers() {
            const myEmail = localStorage.getItem("userEmail");
            const list = document.getElementById("blocked-users-list");

            if (!myEmail || !list) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        mode: "getBlockedUsers",
                        blockerId: myEmail
                    })
                });
                const result = await res.json();

                if (result.status !== "success" || !Array.isArray(result.message)) {
                    list.innerText = "ブロック一覧を取得できませんでした。";
                    return;
                }

                if (result.message.length === 0) {
                    list.innerText = "ブロック中のユーザーはいません。";
                    return;
                }

                list.innerHTML = "";

                result.message.forEach(user => {
                    const row = document.createElement("div");
                    row.style.cssText = "display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid rgba(0,0,0,0.06);";

                    const name = document.createElement("span");
                    name.textContent = `${user.name} (${user.userId})`;

                    const button = document.createElement("button");
                    button.type = "button";
                    button.textContent = "解除";
                    button.style.cssText = "border:none; border-radius:7px; padding:6px 10px; background:#e0f2fe; color:#0369a1; font-weight:700; cursor:pointer;";
                    button.addEventListener("click", () => unblockUser(user.userId, user.name));

                    row.appendChild(name);
                    row.appendChild(button);
                    list.appendChild(row);
                });
            } catch (e) {
                list.innerText = "通信エラーが発生しました。";
            }
        }

        async function unblockUser(blockedId, blockedName) {
            if (!confirm(`「${blockedName}」さんのブロックを解除しますか？`)) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        mode: "unblockUser",
                        blockerId: localStorage.getItem("userEmail"),
                        blockedId: blockedId
                    })
                });
                const result = await res.json();

                if (result.status === "success") {
                    loadBlockedUsers();
                } else {
                    alert("ブロック解除に失敗しました: " + result.message);
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        function drawFaceFeatures(landmarks) {
            const canvas = document.getElementById('face-mesh-canvas');
            const video = document.getElementById('face-video');
            const ctx = canvas.getContext('2d');

            const rect = video.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const width = Math.max(1, Math.round(rect.width));
            const height = Math.max(1, Math.round(rect.height));
            const pixelWidth = Math.round(width * dpr);
            const pixelHeight = Math.round(height * dpr);

            if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
                canvas.width = pixelWidth;
                canvas.height = pixelHeight;
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
            }

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!landmarks) return;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const videoWidth = video.videoWidth || 320;
            const videoHeight = video.videoHeight || 240;
            const scale = Math.max(width / videoWidth, height / videoHeight);
            const renderWidth = videoWidth * scale;
            const renderHeight = videoHeight * scale;
            const offsetX = (width - renderWidth) / 2;
            const offsetY = (height - renderHeight) / 2;

            ctx.fillStyle = "#00FF00";
            for (let i = 0; i < landmarks.length; i++) {
                const pt = landmarks[i];
                const x = pt.x * renderWidth + offsetX;
                const y = pt.y * renderHeight + offsetY;
                ctx.beginPath();
                ctx.arc(x, y, 1.5, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        async function checkFaceFrame() {
            const video = document.getElementById('face-video');
            if (!faceMesh || !videoStream || faceProcessing || video.readyState < 2) return;

            const now = performance.now();
            if (now - lastFaceCheck < faceCheckInterval) return;

            faceProcessing = true;
            lastFaceCheck = now;
            try {
                await faceMesh.send({ image: video });
            } catch (err) {
                if (videoStream) {
                    lastLandmarks = null;
                    drawFaceFeatures(null);
                }
            } finally {
                faceProcessing = false;
            }
        }

        function scheduleFaceFrame(session) {
            const video = document.getElementById('face-video');
            if (!videoStream || session !== cameraSession) return;

            if (typeof video.requestVideoFrameCallback === "function") {
                faceFrameCallback = video.requestVideoFrameCallback(async () => {
                    if (session !== cameraSession) return;
                    await checkFaceFrame();
                    scheduleFaceFrame(session);
                });
                return;
            }

            faceFrameRequest = requestAnimationFrame(async (time) => {
                if (session !== cameraSession) return;
                if (time - lastFaceCheck >= faceCheckInterval) await checkFaceFrame();
                scheduleFaceFrame(session);
            });
        }

        function stopFaceLoop() {
            const video = document.getElementById('face-video');
            if (faceFrameRequest !== null) {
                cancelAnimationFrame(faceFrameRequest);
                faceFrameRequest = null;
            }
            if (faceFrameCallback !== null && typeof video.cancelVideoFrameCallback === "function") {
                video.cancelVideoFrameCallback(faceFrameCallback);
                faceFrameCallback = null;
            }
        }

        function initFaceMesh() {
            if (faceMesh) return;
            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    lastLandmarks = results.multiFaceLandmarks[0];
                    lastFaceSeen = performance.now();
                    drawFaceFeatures(lastLandmarks);
                } else {
                    if (performance.now() - lastFaceSeen > 500) lastLandmarks = null;
                    drawFaceFeatures(null);
                }
            });
        }

        async function startFaceUpdate() {
            const myEmail = localStorage.getItem("userEmail");
            if (!myEmail) { alert("ログインセッションが見つかりません。一度ログインし直してください。"); return; }

            initFaceMesh();
            document.getElementById('faceModal').style.display = "flex";
            document.getElementById('face-status').innerText = "カメラを起動中...";
            document.getElementById('face-status').style.color = "#0095f6";

            const video = document.getElementById('face-video');
            try {
                const constraints = {
                    audio: false,
                    video: {
                        facingMode: { ideal: "user" },
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 },
                        frameRate: { ideal: 30, max: 30 }
                    }
                };

                try {
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    if (err.name === "NotAllowedError" || err.name === "SecurityError" || err.name === "AbortError") throw err;
                    videoStream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: { facingMode: "user" }
                    });
                }

                video.srcObject = videoStream;
                video.muted = true;
                video.setAttribute("playsinline", "");
                await new Promise(resolve => {
                    if (video.readyState >= 1) {
                        resolve();
                    } else {
                        video.addEventListener("loadedmetadata", resolve, { once: true });
                    }
                });
                await video.play();
                cameraSession++;
                lastFaceCheck = 0;
                scheduleFaceFrame(cameraSession);

                let seconds = 3;
                document.getElementById('face-status').innerText = `${seconds}秒後に自動で顔スキャンを実行します...`;

                const timer = setInterval(async () => {
                    seconds--;
                    if (seconds > 0) {
                        document.getElementById('face-status').innerText = `${seconds}秒後に自動で顔スキャンを実行します...`;
                    } else {
                        clearInterval(timer);
                        await captureAndSaveFace(myEmail);
                    }
                }, 1000);

            } catch (err) {
                if (videoStream) videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
                video.srcObject = null;
                document.getElementById('face-status').innerText = "カメラの起動に失敗しました。";
                document.getElementById('face-status').style.color = "#ed4956";
            }
        }

        async function captureAndSaveFace(email) {
            if (!lastLandmarks) {
                document.getElementById('face-status').innerText = "顔が検出されませんでした。もう一度試してください。";
                document.getElementById('face-status').style.color = "#ed4956";
                stopFaceCamera();
                return;
            }

            const featuresToSave = JSON.stringify(lastLandmarks);
            stopFaceCamera();

            document.getElementById('face-status').innerText = "顔の特徴点データを解析・アップデート中...";
            document.getElementById('face-status').style.color = "#e67e22";

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        mode: "updateFaceFeatures",
                        email: email,
                        faceFeatures: featuresToSave
                    })
                });
                const result = await res.json();

                if (result.status === "success") {
                    document.getElementById('face-status').innerText = "顔認証情報のアップデートが完了しました！";
                    document.getElementById('face-status').style.color = "#10b981";
                    setTimeout(() => { closeFaceModal(); }, 1500);
                } else {
                    document.getElementById('face-status').innerText = "アップデート失敗: " + result.message;
                    document.getElementById('face-status').style.color = "#ed4956";
                }
            } catch (err) {
                document.getElementById('face-status').innerText = "通信エラーが発生しました。";
                document.getElementById('face-status').style.color = "#ed4956";
            }
        }

        function stopFaceCamera() {
            cameraSession++;
            stopFaceLoop();
            if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); }
            videoStream = null;
            const video = document.getElementById('face-video');
            video.pause();
            video.srcObject = null;
            lastFaceSeen = 0;
            lastLandmarks = null;
            drawFaceFeatures(null);
        }

        function closeFaceModal() {
            stopFaceCamera();
            document.getElementById('faceModal').style.display = "none";
        }

        window.onload = () => {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");

            const userName = localStorage.getItem("userName");
            const profileImage = localStorage.getItem("profileImage");

            if (userName) document.getElementById("username-input").value = userName;

            if (profileImage && profileImage !== "null") {
                document.getElementById("profile-icon").src = profileImage;
            } else {
                document.getElementById("profile-icon").src = DEFAULT_AVATAR;
            }

            syncProfileFromServer();
            updateUnreadBadge();
            setInterval(updateUnreadBadge, 3000);
            loadBlockedUsers();
        };
    </script>
