    <style>

            margin: 0;

        .logo-text span {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        }

        .nav-links {
            display: flex;

        }

        .nav-item {
            cursor: pointer;

            font-weight: 700;

            padding: 8px 14px;

        .unread-badge {

        .btn-logout:hover {

        .hamburger-btn {

        .hamburger-btn span {

        }

        .container {
            flex: 1;
            width: 100%;
            max-width: 500px;
            margin: 30px auto;

        }

        .profile-card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 16px;

        }

        .profile-card h2 {
            font-size: 1.25rem;
            margin-top: 0;

            color: #262626;
            font-weight: 800;

        }

        .profile-image-group {

        .camera-box-mini canvas { z-index: 10; pointer-events: none; }

        .face-status-text {

    <script>
        const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwgAQAPaBr-HNvqToDDrspDfL02s_YN89atcNrZfVGEESNnRLC_9vnqC0vz8hHyvUrS/exec";
        
        let cropper = null;
        let videoStream = null;
        let faceMesh = null;
        let lastLandmarks = null; 
        let activeCamera = null;

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        async function updateUnreadBadge() {
            const myEmail = localStorage.getItem("userEmail");
            const badge = document.getElementById("unread-badge");
            if (!myEmail || !badge) return;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "getUnreadCount", email: myEmail })
                });
                const result = await res.json();

                if (result.status === "success" && result.message) {
                    const count = result.message.unreadCount || 0;
                    if (count > 0) {
                        badge.innerText = count > 99 ? "99+" : count;
                        badge.style.display = "inline-block";
                    } else {
                        badge.style.display = "none";
                    }
                }
            } catch (e) {
                console.error("未読チェックエラー:", e);
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const cropImage = document.getElementById("cropImage");
                cropImage.src = e.target.result;

                document.getElementById("cropModal").style.display = "flex";

                if (cropper) { cropper.destroy(); }
                cropper = new Cropper(cropImage, {
                    aspectRatio: 1, viewMode: 1, autoCropArea: 0.8, background: false
                });
            };
            reader.readAsDataURL(file);
        }

        function executeCrop() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 100, height: 100 });
            document.getElementById("profile-icon").src = canvas.toDataURL("image/jpeg", 0.3);
            closeCropModal();
        }

        function closeCropModal() {
            document.getElementById("cropModal").style.display = "none";
            document.getElementById("image-input").value = "";
            if (cropper) { cropper.destroy(); cropper = null; }
        }

        function deleteImage() {
            document.getElementById("profile-icon").src = DEFAULT_AVATAR;
            document.getElementById("image-input").value = "";
        }

        async function saveProfile() {
            const name = document.getElementById("username-input").value.trim();
            const imageSrc = document.getElementById("profile-icon").src;
            const email = localStorage.getItem("userEmail");

            if (!name) { alert("表示名を入力してください"); return; }
            if (!email) { alert("ログイン情報が見つかりません。一度再ログインしてください。"); return; }

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        mode: "updateProfile",
                        email: email,
                        name: name,
                        profileImage: imageSrc
                    })
                });

                const result = await res.json();
                if (result.status === "success") {
                    localStorage.setItem("userName", name);
                    localStorage.setItem("profileImage", imageSrc);
                    alert("プロフィールを保存しました！");
                    location.href = "main.html";
                } else {
                    alert("保存に失敗しました: " + result.message);
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
                console.error(e);
            }
        }

        // 🚨 ユーザー情報削除処理
        async function deleteAccount() {
            const isConfirmed = confirm("ユーザー情報を削除すると、現在のユーザーとして平工マッチングにアクセスすることができなくなります。よろしいですか？");
            if (!isConfirmed) return;

            const email = localStorage.getItem("userEmail");
            if (!email) {
                alert("ログイン情報が見つかりません。");
                return;
            }

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        mode: "deleteAccount",
                        email: email
                    })
                });

                const result = await res.json();
                if (result.status === "success") {
                    alert("ユーザー情報を削除しました。");
                    localStorage.clear();
                    window.location.href = "index.html";
                } else {
                    alert("削除に失敗しました: " + result.message);
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
                console.error(e);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        // 顔検出の描画
        function drawFaceFeatures(landmarks) {
            const canvas = document.getElementById('face-mesh-canvas');
            const video = document.getElementById('face-video');
            const ctx = canvas.getContext('2d');
            
            const rect = video.getBoundingClientRect();
            if (canvas.width !== rect.width || canvas.height !== rect.height) {
                canvas.width = rect.width; canvas.height = rect.height;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!landmarks) return;

            ctx.fillStyle = "#00FF00";
            for (let i = 0; i < landmarks.length; i++) {
                const pt = landmarks[i];
                ctx.beginPath(); ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 1, 0, 2 * Math.PI); ctx.fill();
            }
        }

        function initFaceMesh() {
            if (faceMesh) return;
            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    lastLandmarks = results.multiFaceLandmarks[0];
                    drawFaceFeatures(lastLandmarks);
                } else {
                    lastLandmarks = null;
                    drawFaceFeatures(null);
                }
            });
        }

        async function startFaceUpdate() {
            const myEmail = localStorage.getItem("userEmail");
            if (!myEmail) { alert("ログインセッションが見つかりません。一度ログインし直してください。"); return; }

            initFaceMesh();
            document.getElementById('faceModal').style.display = "flex";
            document.getElementById('face-status').innerText = "カメラを起動中...";
            document.getElementById('face-status').style.color = "#0095f6";

            const video = document.getElementById('face-video');
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
                video.srcObject = videoStream;
                
                activeCamera = new Camera(video, {
                    onFrame: async () => { await faceMesh.send({ image: video }); },
                    width: 320, height: 240
                });
                activeCamera.start();

                let seconds = 3;
                document.getElementById('face-status').innerText = `${seconds}秒後に自動で顔スキャンを実行します...`;
                
                const timer = setInterval(async () => {
                    seconds--;
                    if (seconds > 0) {
                        document.getElementById('face-status').innerText = `${seconds}秒後に自動で顔スキャンを実行します...`;
                    } else {
                        clearInterval(timer);
                        await captureAndSaveFace(myEmail);
                    }
                }, 1000);

            } catch (err) {
                document.getElementById('face-status').innerText = "カメラの起動に失敗しました。";
                document.getElementById('face-status').style.color = "#ed4956";
            }
        }

        async function captureAndSaveFace(email) {
            if (!lastLandmarks) {
                document.getElementById('face-status').innerText = "顔が検出されませんでした。もう一度試してください。";
                document.getElementById('face-status').style.color = "#ed4956";
                stopFaceCamera();
                return;
            }

            const featuresToSave = JSON.stringify(lastLandmarks);
            stopFaceCamera();

            document.getElementById('face-status').innerText = "顔の特徴点データを解析・アップデート中...";
            document.getElementById('face-status').style.color = "#e67e22";

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        mode: "updateFaceFeatures",
                        email: email,
                        faceFeatures: featuresToSave
                    })
                });
                const result = await res.json();

                if (result.status === "success") {
                    document.getElementById('face-status').innerText = "顔認証情報のアップデートが完了しました！";
                    document.getElementById('face-status').style.color = "#10b981";
                    setTimeout(() => { closeFaceModal(); }, 1500);
                } else {
                    document.getElementById('face-status').innerText = "アップデート失敗: " + result.message;
                    document.getElementById('face-status').style.color = "#ed4956";
                }
            } catch (err) {
                document.getElementById('face-status').innerText = "通信エラーが発生しました。";
                document.getElementById('face-status').style.color = "#ed4956";
            }
        }

        function stopFaceCamera() {
            if (activeCamera) { activeCamera.stop(); }
            if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); }
            drawFaceFeatures(null);
        }

        function closeFaceModal() {
            stopFaceCamera();
            document.getElementById('faceModal').style.display = "none";
        }

        window.onload = () => {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");

            const userName = localStorage.getItem("userName");
            const profileImage = localStorage.getItem("profileImage");

            if (userName) document.getElementById("username-input").value = userName;

            if (profileImage && profileImage !== "null") {
                document.getElementById("profile-icon").src = profileImage;
            } else {
                document.getElementById("profile-icon").src = DEFAULT_AVATAR;
            }

            updateUnreadBadge();
            setInterval(updateUnreadBadge, 3000);
        };
    </script>
</body>

</html>
