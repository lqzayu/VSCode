<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - 平工マッチング</title>

    <!-- 💡 追加: 画像切り抜き用ライブラリ Cropper.js の読み込み (CSS & JS) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" crossorigin="anonymous" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js" crossorigin="anonymous"></script>

    <style>
        /* =====================================
           💡 全体的なモダン調の基本スタイル
        ===================================== */
        body {
            margin: 0;
            background: radial-gradient(circle at 10% 20%, rgba(238, 252, 253, 1) 0%, rgba(218, 241, 245, 1) 90%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ナビゲーションバー：洗練されたグラスモフィズム */
        .navbar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item {
            cursor: pointer;
            color: #64748b;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: rgba(28, 189, 197, 0.06);
            color: #1cbdc5;
        }

        .nav-item.active {
            color: #1cbdc5;
            background-color: rgba(28, 189, 197, 0.1);
        }

        .btn-logout {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background-color: #ef4444;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
            transition: all 0.2s;
        }

        .btn-logout:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.25);
        }

        /* ハンバーガーボタン */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 110;
        }

        .hamburger-btn span {
            width: 100%;
            height: 2.5px;
            background-color: #1e293b;
            border-radius: 3px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* =====================================
           マイページ専用コンテンツレイアウト
        ===================================== */
        .container {
            flex: 1;
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 24px;
            box-sizing: border-box;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 32px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px -4px rgba(24, 76, 92, 0.05);
            text-align: center;
            box-sizing: border-box;
        }

        .profile-card h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 35px;
            color: #1e293b;
            font-weight: 800;
        }

        .profile-image-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 35px;
        }

        .big-profile-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(24, 76, 92, 0.12);
            border: 4px solid #ffffff;
            transition: transform 0.25s ease;
        }

        .image-btn-group {
            display: flex;
            gap: 10px;
        }

        .input-file-label {
            background-color: rgba(0, 0, 0, 0.04);
            color: #475569;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-file-label:hover {
            background-color: rgba(0, 0, 0, 0.08);
            color: #1e293b;
        }

        .btn-delete-image {
            background-color: #ffe4e6;
            color: #e11d48;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete-image:hover {
            background-color: #fecdd3;
            transform: translateY(-1px);
        }

        .form-group {
            text-align: left;
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 10px;
            padding-left: 2px;
        }

        .input-large {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: rgba(248, 250, 252, 0.8);
            color: #1e293b;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-large:focus {
            border-color: #1cbdc5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(28, 189, 197, 0.15);
        }

        .btn-large {
            width: 100%;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(28, 189, 197, 0.25);
        }

        .btn-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(28, 189, 197, 0.4);
        }

        /* ========================================================
           🌟 追加: クロップ（トリミング）用モーダルウィンドウのUI
        ======================================================== */
        .crop-modal {
            display: none; /* 初期状態は隠す */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.6); /* 背景をダークにぼかす */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .crop-modal-content {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            box-sizing: border-box;
        }

        .crop-modal-content h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 800;
        }

        /* ライブラリが画像を広げるエリアのサイズを適正に制限 */
        .img-container {
            width: 100%;
            max-height: 300px;
            margin-bottom: 20px;
            background-color: #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
        }

        .img-container img {
            max-width: 100%;
            display: block;
        }

        .crop-btn-group {
            display: flex;
            gap: 12px;
        }

        .btn-crop-cancel {
            background-color: #f1f5f9;
            color: #475569;
        }
        .btn-crop-cancel:hover { background-color: #e2e8f0; }

        .btn-crop-done {
            background: linear-gradient(135deg, #1cbdc5 0%, #119299 100%);
            color: white;
        }

        /* フッター */
        .footer {
            background-color: transparent;
            padding: 30px 20px;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .copyright {
            color: #94a3b8;
            font-size: 0.75rem;
            margin: 0;
            font-weight: 600;
        }

        /* =====================================
           📱 スマホ・レスポンシブ
        ===================================== */
        @media screen and (max-width: 768px) {
            .container {
                margin: 20px auto;
                padding: 0 16px;
            }

            .profile-card {
                padding: 32px 20px;
                border-radius: 20px;
            }

            .hamburger-btn {
                display: flex !important;
            }

            .nav-links {
                position: fixed !important;
                top: 54px !important;
                left: 0 !important;
                width: 100% !important;
                background: rgba(255, 255, 255, 0.98) !important;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
                flex-direction: column !important;
                padding: 24px 0 !important;
                gap: 8px !important;
                z-index: 99 !important;
                opacity: 0 !important;
                pointer-events: none !important;
                transform: translateY(-10px) !important;
                transition: transform 0.3s ease, opacity 0.3s ease !important;
            }

            .nav-links.open {
                opacity: 1 !important;
                pointer-events: auto !important;
                transform: translateY(0) !important;
            }

            .nav-item {
                margin-right: 0 !important;
                font-size: 16px !important;
                padding: 12px 0 !important;
                width: 80% !important;
                text-align: center !important;
                border-radius: 10px;
            }

            .btn-logout {
                margin-top: 8px !important;
                width: 80% !important;
                text-align: center !important;
                padding: 12px 0 !important;
                margin: 0 auto !important;
            }

            .hamburger-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg) !important; }
            .hamburger-btn.open span:nth-child(2) { opacity: 0 !important; transform: scale(0) !important; }
            .hamburger-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg) !important; }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo" onclick="location.href='main.html'">平工マッチング</div>

        <!-- 3本線ボタン -->
        <button class="hamburger-btn" id="hud-menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" id="nav-links">
            <a class="nav-item" href="main.html">ホーム</a>
            <a class="nav-item" href="messages.html">メッセージ</a>
            <a class="nav-item active" href="profile.html">マイページ</a>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </nav>
    </header>

    <main class="container">
        <div class="profile-card">
            <h2>プロフィール設定</h2>

            <div class="profile-image-group">
                <img id="profile-icon" class="big-profile-icon"
                    src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="icon">

                <div class="image-btn-group">
                    <label for="image-input" class="input-file-label">画像を選択</label>
                    <button type="button" class="btn-delete-image" onclick="deleteImage()">削除</button>
                </div>

                <input type="file" id="image-input" accept="image/*" style="display: none;"
                    onchange="previewImage(event)">
            </div>

            <div class="form-group">
                <label for="username-input">表示名</label>
                <input type="text" id="username-input" class="input-large" placeholder="名前を入力してください">
            </div>

            <button class="btn-large" onclick="saveProfile()">設定を保存する</button>
        </div>
    </main>

    <!-- 💡 追加: 範囲指定トリミング用モーダル画面の配置 -->
    <div id="cropModal" class="crop-modal">
        <div class="crop-modal-content">
            <h3>プロフィールの表示範囲を選択</h3>
            <div class="img-container">
                <img id="cropImage" src="" alt="トリミング対象">
            </div>
            <div class="crop-btn-group">
                <button type="button" class="btn-crop-cancel" onclick="closeCropModal()">キャンセル</button>
                <button type="button" class="btn-crop-done" onclick="executeCrop()">確定する</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        let cropper = null; // Cropperインスタンス保持用変数

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        function closeMenu() {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");
        }

        // 💡 変更: 画像が選択されたらすぐプレビューせず、範囲指定用モーダルを起動する
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const cropImage = document.getElementById("cropImage");
                cropImage.src = e.target.result;

                // モーダルを表示
                document.getElementById("cropModal").style.display = "flex";

                // 以前のCropperが残っていれば一度破棄
                if (cropper) {
                    cropper.destroy();
                }

                // Cropper.jsの初期化 (正方形 1:1 に固定して綺麗なアイコン枠を作る)
                cropper = new Cropper(cropImage, {
                    aspectRatio: 1, // 縦横比を1:1(正方形)に固定
                    viewMode: 1,    // キャンバス外への切り抜き枠のはみ出しを防ぐ
                    autoCropArea: 0.8, // 初期選択範囲の大きさ (80%)
                    background: false  // 背景の格子模様を非表示
                });
            };
            reader.readAsDataURL(file);
        }

        // 💡 追加: クロップの確定処理
        function executeCrop() {
            if (!cropper) return;

            // 選択された範囲を 300x300 ピクセルの高画質なBase64画像として抽出
            const canvas = cropper.getCroppedCanvas({
                width: 300,
                height: 300
            });

            // 抽出した画像をメイン画面の丸アイコンにセット
            document.getElementById("profile-icon").src = canvas.toDataURL();
            
            // 後処理
            closeCropModal();
        }

        // 💡 追加: モーダルを閉じる処理
        function closeCropModal() {
            document.getElementById("cropModal").style.display = "none";
            document.getElementById("image-input").value = ""; // ファイル選択をリセット
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        function deleteImage() {
            document.getElementById("profile-icon").src = DEFAULT_AVATAR;
            document.getElementById("image-input").value = "";
        }

        function saveProfile() {
            const name = document.getElementById("username-input").value.trim();
            const imageSrc = document.getElementById("profile-icon").src;

            if (!name) {
                alert("表示名を入力してください");
                return;
            }

            localStorage.setItem("userName", name);
            localStorage.setItem("profileImage", imageSrc);
            alert("プロフィールを保存しました！");
            location.href = "main.html";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = () => {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");

            const userName = localStorage.getItem("userName");
            const profileImage = localStorage.getItem("profileImage");

            if (userName) document.getElementById("username-input").value = userName;

            if (profileImage && profileImage !== "null") {
                document.getElementById("profile-icon").src = profileImage;
            } else {
                document.getElementById("profile-icon").src = DEFAULT_AVATAR;
            }
        };
    </script>
</body>

</html>
