    <script>
        const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/149/149071.png";	// 定数を定義
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";	// GAS APIの接続先を設定

        let cropper = null;	// 状態を保持
        let videoStream = null;	// 状態を保持
        let faceMesh = null;	// 状態を保持
        let lastLandmarks = null;	// 状態を保持
        let faceFrameRequest = null;	// 状態を保持
        let faceFrameCallback = null;	// 状態を保持
        let faceProcessing = false;	// 状態を保持
        let lastFaceCheck = 0;	// 状態を保持
        let lastFaceSeen = 0;	// 状態を保持
        let cameraSession = 0;	// 状態を保持
        let unreadRequest = null;	// 状態を保持
        const faceCheckInterval = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 100 : 66;	// 定数を定義

        function compactFaceLandmarks(landmarks) {	// 関数を定義
            if (!Array.isArray(landmarks)) return [];	// 条件に応じて処理を分ける
            return landmarks.map(point => ({	// 結果を返す
                x: Number(Number(point.x || 0).toFixed(5)),	// 処理を続ける
                y: Number(Number(point.y || 0).toFixed(5)),	// 処理を続ける
                z: Number(Number(point.z || 0).toFixed(5))	// 処理を続ける
            }));	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function makeProfileImage(sourceCanvas) {	// 関数を定義
            const sizes = [300, 240, 180];	// 定数を定義
            for (const size of sizes) {	// 対象を順番に処理する
                const canvas = document.createElement("canvas");	// 定数を定義
                canvas.width = size;	// 処理を続ける
                canvas.height = size;	// 処理を続ける
                const context = canvas.getContext("2d", { alpha: false });	// 定数を定義
                context.drawImage(sourceCanvas, 0, 0, size, size);	// 処理を完了する
                for (const quality of [0.68, 0.55, 0.42]) {	// 対象を順番に処理する
                    const dataUrl = canvas.toDataURL("image/jpeg", quality);	// 定数を定義
                    if (dataUrl.length < 48000) return dataUrl;	// 条件に応じて処理を分ける
                }	// 処理のまとまりを閉じる
            }	// 処理のまとまりを閉じる
            return "";	// 結果を返す
        }	// 処理のまとまりを閉じる

        async function postGas(payload, timeoutMs = 12000) {	// 関数を定義
            const controller = new AbortController();	// 定数を定義
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);	// 定数を定義
            try {	// 失敗に備えて処理を始める
                const res = await fetch(GAS_URL, {	// 定数を定義
                    method: "POST",	// 処理を続ける
                    body: JSON.stringify(payload),	// 処理を続ける
                    signal: controller.signal	// 処理を続ける
                });	// 処理を完了する
                if (!res.ok) throw new Error(`HTTP ${res.status}`);	// 条件に応じて処理を分ける
                return await res.json();	// 結果を返す
            } finally {	// 処理のまとまりを始める
                clearTimeout(timeoutId);	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function toggleMenu() {	// 関数を定義
            document.getElementById("hud-menu-btn").classList.toggle("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.toggle("open");	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        async function syncProfileFromServer() {	// 関数を定義
            const userId = localStorage.getItem("userId") || localStorage.getItem("userEmail");	// 定数を定義
            if (!userId) return;	// 条件に応じて処理を分ける

            try {	// 失敗に備えて処理を始める
                const result = await postGas({ mode: "getUserProfile", userId: userId });	// 定数を定義
                if (result.status !== "success" || !result.message) return;	// 条件に応じて処理を分ける

                const name = String(result.message.name || result.message.userId || "").trim();	// 定数を定義
                const image = String(result.message.profileImage || "").trim();	// 定数を定義
                localStorage.setItem("userName", name);	// 端末内の保存情報を扱う
                localStorage.setItem("profileImage", image);	// 端末内の保存情報を扱う

                document.getElementById("username-input").value = name;	// 処理を続ける
                document.getElementById("profile-icon").src = image || DEFAULT_AVATAR;	// 処理を続ける
            } catch (e) {	// 処理のまとまりを始める
                console.error("プロフィール情報の同期エラー:", e);	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        async function updateUnreadBadge() {	// 関数を定義
            const myEmail = localStorage.getItem("userEmail");	// 定数を定義
            const badge = document.getElementById("unread-badge");	// 定数を定義
            if (!myEmail || !badge || unreadRequest) return unreadRequest;	// 条件に応じて処理を分ける

            unreadRequest = (async () => {	// 処理のまとまりを始める
                try {	// 失敗に備えて処理を始める
                    const result = await postGas({ mode: "getUnreadCount", email: myEmail });	// 定数を定義

                    if (result.status === "success" && result.message) {	// 条件に応じて処理を分ける
                        const count = result.message.unreadCount || 0;	// 定数を定義
                        if (count > 0) {	// 条件に応じて処理を分ける
                            badge.innerText = count > 99 ? "99+" : count;	// 処理を続ける
                            badge.style.display = "inline-block";	// 処理を続ける
                        } else {	// 処理のまとまりを始める
                            badge.style.display = "none";	// 処理を続ける
                        }	// 処理のまとまりを閉じる
                    }	// 処理のまとまりを閉じる
                } catch (e) {	// 処理のまとまりを始める
                    console.error("未読チェックエラー:", e);	// 処理を完了する
                } finally {	// 処理のまとまりを始める
                    unreadRequest = null;	// 処理を続ける
                }	// 処理のまとまりを閉じる
            })();	// 処理を完了する

            return unreadRequest;	// 結果を返す
        }	// 処理のまとまりを閉じる

        function previewImage(event) {	// 関数を定義
            const file = event.target.files[0];	// 定数を定義
            if (!file) return;	// 条件に応じて処理を分ける

            const reader = new FileReader();	// 定数を定義
            reader.onload = function (e) {	// 処理のまとまりを始める
                const cropImage = document.getElementById("cropImage");	// 定数を定義
                cropImage.src = e.target.result;	// 処理を続ける

                document.getElementById("cropModal").style.display = "flex";	// 画面表示を更新する

                if (cropper) { cropper.destroy(); }	// 条件に応じて処理を分ける
                cropper = new Cropper(cropImage, {	// 処理のまとまりを始める
                    aspectRatio: 1, viewMode: 1, autoCropArea: 0.8, background: false	// 処理を続ける
                });	// 処理を完了する
            };	// 処理のまとまりを閉じる
            reader.readAsDataURL(file);	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function executeCrop() {	// 関数を定義
            if (!cropper) return;	// 条件に応じて処理を分ける
            const canvas = cropper.getCroppedCanvas({	// 定数を定義
                width: 300,	// 処理を続ける
                height: 300,	// 処理を続ける
                imageSmoothingEnabled: true,	// 処理を続ける
                imageSmoothingQuality: "high"	// 処理を続ける
            });	// 処理を完了する
            const profileImage = makeProfileImage(canvas);	// 定数を定義
            if (!profileImage) {	// 条件に応じて処理を分ける
                alert("画像を十分に小さくできませんでした。別の画像を選んでください。");	// 処理結果を知らせる
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる
            document.getElementById("profile-icon").src = profileImage;	// 処理を続ける
            closeCropModal();	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function closeCropModal() {	// 関数を定義
            document.getElementById("cropModal").style.display = "none";	// 画面表示を更新する
            document.getElementById("image-input").value = "";	// 処理を続ける
            if (cropper) { cropper.destroy(); cropper = null; }	// 条件に応じて処理を分ける
        }	// 処理のまとまりを閉じる

        function deleteImage() {	// 関数を定義
            document.getElementById("profile-icon").src = DEFAULT_AVATAR;	// 処理を続ける
            document.getElementById("image-input").value = "";	// 処理を続ける
        }	// 処理のまとまりを閉じる

        async function saveProfile() {	// 関数を定義
            const name = document.getElementById("username-input").value.trim();	// 定数を定義
            const imageSrc = document.getElementById("profile-icon").src;	// 定数を定義
            const email = localStorage.getItem("userEmail");	// 定数を定義

            if (!name) { alert("表示名を入力してください"); return; }	// 条件に応じて処理を分ける
            if (!email) { alert("ログイン情報が見つかりません。一度再ログインしてください。"); return; }	// 条件に応じて処理を分ける

            try {	// 失敗に備えて処理を始める
                const result = await postGas({	// 定数を定義
                    mode: "updateProfile",	// 処理を続ける
                    email: email,	// 処理を続ける
                    name: name,	// 処理を続ける
                    profileImage: imageSrc	// 処理を続ける
                });	// 処理を完了する
                if (result.status === "success") {	// 条件に応じて処理を分ける

        async function deleteAccount() {	// 関数を定義
            const isConfirmed = confirm("ユーザー情報を削除すると、現在のユーザーとして平工マッチングにアクセスすることができなくなります。よろしいですか？");	// 定数を定義

            }	// 処理のまとまりを閉じる

                } else {	// 処理のまとまりを始める

            } catch (e) {	// 処理のまとまりを始める
                alert("通信エラーが発生しました。");	// 処理結果を知らせる

        async function loadBlockedUsers() {	// 関数を定義
            const myEmail = localStorage.getItem("userEmail");	// 定数を定義
            const list = document.getElementById("blocked-users-list");	// 定数を定義

            try {	// 失敗に備えて処理を始める

        async function unblockUser(blockedId, blockedName) {	// 関数を定義
            if (!confirm(`「${blockedName}」さんのブロックを解除しますか？`)) return;	// 条件に応じて処理を分ける

            try {	// 失敗に備えて処理を始める
                const result = await postGas({	// 定数を定義
                    mode: "unblockUser",	// 処理を続ける
                    blockerId: localStorage.getItem("userEmail"),	// 端末内の保存情報を扱う
                    blockedId: blockedId	// 処理を続ける
                });	// 処理を完了する

                if (result.status === "success") {	// 条件に応じて処理を分ける

                    alert("ブロック解除に失敗しました: " + result.message);	// 処理結果を知らせる
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                alert("通信エラーが発生しました。");	// 処理結果を知らせる

        function logout() {	// 関数を定義
            localStorage.clear();	// 端末内の保存情報を扱う
            window.location.href = "index.html";	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        function drawFaceFeatures(landmarks) {	// 関数を定義
            const canvas = document.getElementById('face-mesh-canvas');	// 定数を定義
            const video = document.getElementById('face-video');	// 定数を定義
            const ctx = canvas.getContext('2d');	// 定数を定義

            const rect = video.getBoundingClientRect();	// 定数を定義
            const dpr = Math.min(window.devicePixelRatio || 1, 2);	// 定数を定義
            const width = Math.max(1, Math.round(rect.width));	// 定数を定義
            const height = Math.max(1, Math.round(rect.height));	// 定数を定義
            const pixelWidth = Math.round(width * dpr);	// 定数を定義
            const pixelHeight = Math.round(height * dpr);	// 定数を定義

            if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {	// 条件に応じて処理を分ける
                canvas.width = pixelWidth;	// 処理を続ける
                canvas.height = pixelHeight;	// 処理を続ける
                canvas.style.width = `${width}px`;	// 処理を続ける
                canvas.style.height = `${height}px`;	// 処理を続ける
            }	// 処理のまとまりを閉じる

            ctx.setTransform(1, 0, 0, 1, 0, 0);	// 処理を完了する
            ctx.clearRect(0, 0, canvas.width, canvas.height);	// 処理を完了する
            if (!landmarks) return;	// 条件に応じて処理を分ける

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);	// 処理を完了する

            const videoWidth = video.videoWidth || 320;	// 定数を定義
            const videoHeight = video.videoHeight || 240;	// 定数を定義
            const scale = Math.max(width / videoWidth, height / videoHeight);	// 定数を定義
            const renderWidth = videoWidth * scale;	// 定数を定義
            const renderHeight = videoHeight * scale;	// 定数を定義
            const offsetX = (width - renderWidth) / 2;	// 定数を定義
            const offsetY = (height - renderHeight) / 2;	// 定数を定義

            ctx.fillStyle = "#00FF00";	// 処理を続ける
            for (let i = 0; i < landmarks.length; i++) {	// 対象を順番に処理する
                const pt = landmarks[i];	// 定数を定義
                const x = pt.x * renderWidth + offsetX;	// 定数を定義
                const y = pt.y * renderHeight + offsetY;	// 定数を定義
                ctx.beginPath();	// 処理を完了する
                ctx.arc(x, y, 1.5, 0, 2 * Math.PI);	// 処理を完了する
                ctx.fill();	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        async function checkFaceFrame() {	// 関数を定義
            const video = document.getElementById('face-video');	// 定数を定義
            if (!faceMesh || !videoStream || faceProcessing || video.readyState < 2) return;	// 条件に応じて処理を分ける

            const now = performance.now();	// 定数を定義
            if (now - lastFaceCheck < faceCheckInterval) return;	// 条件に応じて処理を分ける

            faceProcessing = true;	// 処理を続ける
            lastFaceCheck = now;	// 処理を続ける
            try {	// 失敗に備えて処理を始める
                await faceMesh.send({ image: video });	// 処理を完了する
            } catch (err) {	// 処理のまとまりを始める
                if (videoStream) {	// 条件に応じて処理を分ける
                    lastLandmarks = null;	// 処理を続ける
                    drawFaceFeatures(null);	// 処理を完了する
                }	// 処理のまとまりを閉じる
            } finally {	// 処理のまとまりを始める
                faceProcessing = false;	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function scheduleFaceFrame(session) {	// 関数を定義
            const video = document.getElementById('face-video');	// 定数を定義
            if (!videoStream || session !== cameraSession) return;	// 条件に応じて処理を分ける

            if (typeof video.requestVideoFrameCallback === "function") {	// 条件に応じて処理を分ける
                faceFrameCallback = video.requestVideoFrameCallback(async () => {	// 処理のまとまりを始める
                    if (session !== cameraSession) return;	// 条件に応じて処理を分ける
                    await checkFaceFrame();	// 処理を完了する
                    scheduleFaceFrame(session);	// 処理を完了する
                });	// 処理を完了する
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる

            faceFrameRequest = requestAnimationFrame(async (time) => {	// 処理のまとまりを始める
                if (session !== cameraSession) return;	// 条件に応じて処理を分ける
                if (time - lastFaceCheck >= faceCheckInterval) await checkFaceFrame();	// 条件に応じて処理を分ける
                scheduleFaceFrame(session);	// 処理を完了する
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function stopFaceLoop() {	// 関数を定義
            const video = document.getElementById('face-video');	// 定数を定義
            if (faceFrameRequest !== null) {	// 条件に応じて処理を分ける
                cancelAnimationFrame(faceFrameRequest);	// 処理を完了する
                faceFrameRequest = null;	// 処理を続ける
            }	// 処理のまとまりを閉じる
            if (faceFrameCallback !== null && typeof video.cancelVideoFrameCallback === "function") {	// 条件に応じて処理を分ける
                video.cancelVideoFrameCallback(faceFrameCallback);	// 処理を完了する
                faceFrameCallback = null;	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function initFaceMesh() {	// 関数を定義
            if (faceMesh) return;	// 条件に応じて処理を分ける
            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });	// 処理を完了する
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });	// 処理を完了する
            faceMesh.onResults((results) => {	// 処理のまとまりを始める
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {	// 条件に応じて処理を分ける
                    lastLandmarks = results.multiFaceLandmarks[0];	// 処理を続ける
                    lastFaceSeen = performance.now();	// 処理を完了する
                    drawFaceFeatures(lastLandmarks);	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    if (performance.now() - lastFaceSeen > 500) lastLandmarks = null;	// 条件に応じて処理を分ける
                    drawFaceFeatures(null);	// 処理を完了する
                }	// 処理のまとまりを閉じる
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        async function startFaceUpdate() {	// 関数を定義
            const myEmail = localStorage.getItem("userEmail");	// 定数を定義
            if (!myEmail) { alert("ログインセッションが見つかりません。一度ログインし直してください。"); return; }	// 条件に応じて処理を分ける

            initFaceMesh();	// 処理を完了する
            document.getElementById('faceModal').style.display = "flex";	// 画面表示を更新する
            document.getElementById('face-status').innerText = "カメラを起動中...";	// 処理を続ける
            document.getElementById('face-status').style.color = "#0095f6";	// 画面表示を更新する

            const video = document.getElementById('face-video');	// 定数を定義
            try {	// 失敗に備えて処理を始める
                const constraints = {	// 定数を定義
                    audio: false,	// 処理を続ける
                    video: {	// 処理のまとまりを始める
                        facingMode: { ideal: "user" },	// 処理を続ける
                        width: { ideal: 1280, max: 1920 },	// 処理を続ける
                        height: { ideal: 720, max: 1080 },	// 処理を続ける
                        frameRate: { ideal: 30, max: 30 }	// 処理を完了する
                    }	// 処理のまとまりを閉じる
                };	// 処理のまとまりを閉じる

                try {	// 失敗に備えて処理を始める
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);	// 処理を完了する
                } catch (err) {	// 処理のまとまりを始める
                    if (err.name === "NotAllowedError" || err.name === "SecurityError" || err.name === "AbortError") throw err;	// 条件に応じて処理を分ける
                    videoStream = await navigator.mediaDevices.getUserMedia({	// 処理のまとまりを始める
                        audio: false,	// 処理を続ける
                        video: { facingMode: "user" }	// 処理を完了する
                    });	// 処理を完了する
                }	// 処理のまとまりを閉じる

                video.srcObject = videoStream;	// 処理を続ける
                video.muted = true;	// 処理を続ける
                video.setAttribute("playsinline", "");	// 処理を完了する
                await new Promise(resolve => {	// 処理のまとまりを始める
                    if (video.readyState >= 1) {	// 条件に応じて処理を分ける
                        resolve();	// 処理を完了する
                    } else {	// 処理のまとまりを始める
                        video.addEventListener("loadedmetadata", resolve, { once: true });	// 操作イベントを登録
                    }	// 処理のまとまりを閉じる
                });	// 処理を完了する
                await video.play();	// 処理を完了する
                cameraSession++;	// 処理を続ける
                lastFaceCheck = 0;	// 処理を続ける
                scheduleFaceFrame(cameraSession);	// 処理を完了する

                let seconds = 3;	// 状態を保持
                document.getElementById('face-status').innerText = `${seconds}秒後に自動で顔スキャンを実行します...`;	// 処理を続ける

                const timer = setInterval(async () => {	// 定数を定義
                    seconds--;	// 処理を続ける
                    if (seconds > 0) {	// 条件に応じて処理を分ける
                        document.getElementById('face-status').innerText = `${seconds}秒後に自動で顔スキャンを実行します...`;	// 処理を続ける
                    } else {	// 処理のまとまりを始める
                        clearInterval(timer);	// 処理を完了する
                        await captureAndSaveFace(myEmail);	// 処理を完了する
                    }	// 処理のまとまりを閉じる
                }, 1000);	// 処理を完了する

            } catch (err) {	// 処理のまとまりを始める
                if (videoStream) videoStream.getTracks().forEach(track => track.stop());	// 条件に応じて処理を分ける
                videoStream = null;	// 処理を続ける
                video.srcObject = null;	// 処理を続ける
                document.getElementById('face-status').innerText = "カメラの起動に失敗しました。";	// 処理を続ける
                document.getElementById('face-status').style.color = "#ed4956";	// 画面表示を更新する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        async function captureAndSaveFace(email) {	// 関数を定義
            if (!lastLandmarks) {	// 条件に応じて処理を分ける
                document.getElementById('face-status').innerText = "顔が検出されませんでした。もう一度試してください。";	// 処理を続ける
                document.getElementById('face-status').style.color = "#ed4956";	// 画面表示を更新する
                stopFaceCamera();	// 処理を完了する
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる

            const featuresToSave = JSON.stringify(compactFaceLandmarks(lastLandmarks));	// 定数を定義
            stopFaceCamera();	// 処理を完了する

            document.getElementById('face-status').innerText = "顔の特徴点データを解析・アップデート中...";	// 処理を続ける
            document.getElementById('face-status').style.color = "#e67e22";	// 画面表示を更新する

            try {	// 失敗に備えて処理を始める
                const result = await postGas({	// 定数を定義
                    mode: "updateFaceFeatures",	// 処理を続ける
                    email: email,	// 処理を続ける
                    faceFeatures: featuresToSave	// 処理を続ける
                });	// 処理を完了する

                if (result.status === "success") {	// 条件に応じて処理を分ける
                    document.getElementById('face-status').innerText = "顔認証情報のアップデートが完了しました！";	// 処理を続ける
                    document.getElementById('face-status').style.color = "#10b981";	// 画面表示を更新する
                    setTimeout(() => { closeFaceModal(); }, 1500);	// 時間を置いて処理する
                } else {	// 処理のまとまりを始める
                    document.getElementById('face-status').innerText = "アップデート失敗: " + result.message;	// 処理を続ける
                    document.getElementById('face-status').style.color = "#ed4956";	// 画面表示を更新する
                }	// 処理のまとまりを閉じる
            } catch (err) {	// 処理のまとまりを始める
                document.getElementById('face-status').innerText = "通信エラーが発生しました。";	// 処理を続ける
                document.getElementById('face-status').style.color = "#ed4956";	// 画面表示を更新する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function stopFaceCamera() {	// 関数を定義
            cameraSession++;	// 処理を続ける
            stopFaceLoop();	// 処理を完了する
            if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); }	// 条件に応じて処理を分ける
            videoStream = null;	// 処理を続ける
            const video = document.getElementById('face-video');	// 定数を定義
            video.pause();	// 処理を完了する
            video.srcObject = null;	// 処理を続ける
            lastFaceSeen = 0;	// 処理を続ける
            lastLandmarks = null;	// 処理を続ける
            drawFaceFeatures(null);	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function closeFaceModal() {	// 関数を定義
            stopFaceCamera();	// 処理を完了する
            document.getElementById('faceModal').style.display = "none";	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        window.onload = () => {	// 処理のまとまりを始める
            document.getElementById("hud-menu-btn").classList.remove("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.remove("open");	// 画面表示を更新する

            const userName = localStorage.getItem("userName");	// 定数を定義
            const profileImage = localStorage.getItem("profileImage");	// 定数を定義
            const currentUserId = localStorage.getItem("userId") || localStorage.getItem("userEmail");	// 定数を定義
            const adminButton = document.getElementById("nav-admin-btn");	// 定数を定義
            if (adminButton && currentUserId === "admin" && localStorage.getItem("isImpersonating") !== "true") {	// 端末内の保存情報を扱う
                adminButton.style.display = "inline-block";	// 処理を続ける
            }	// 処理のまとまりを閉じる

            if (userName) document.getElementById("username-input").value = userName;	// 条件に応じて処理を分ける

            if (profileImage && profileImage !== "null") {	// 条件に応じて処理を分ける
                document.getElementById("profile-icon").src = profileImage;	// 処理を続ける
            } else {	// 処理のまとまりを始める
                document.getElementById("profile-icon").src = DEFAULT_AVATAR;	// 処理を続ける
            }	// 処理のまとまりを閉じる

            syncProfileFromServer();	// 処理を完了する
            updateUnreadBadge();	// 処理を完了する
            setInterval(() => {	// 時間を置いて処理する
                if (document.visibilityState === "visible") updateUnreadBadge();	// 条件に応じて処理を分ける
            }, 8000);	// 処理を完了する
            loadBlockedUsers();	// 処理を完了する
        };	// 処理のまとまりを閉じる
    </script>
