    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";	// GAS APIの接続先を設定
        const ADMIN_ID = "admin";	// 定数を定義

        const currentEmail = localStorage.getItem("userEmail");	// 定数を定義
        const currentUserId = localStorage.getItem("userId") || currentEmail;	// 定数を定義
        const isImpersonating = localStorage.getItem("isImpersonating");	// 定数を定義
        const adminToken = localStorage.getItem("adminToken") || "";	// 定数を定義
        let overviewLoading = false;	// 状態を保持
        let unreadRequest = null;	// 状態を保持
        let adminAccessDenied = false;	// 状態を保持

        async function postGas(payload, timeoutMs = 12000) {	// 関数を定義
            const controller = new AbortController();	// 定数を定義
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);	// 定数を定義
            try {	// 失敗に備えて処理を始める
                const res = await fetch(GAS_URL, {	// 定数を定義
                    method: "POST",	// 処理を続ける
                    body: JSON.stringify(payload),	// 処理を続ける
                    signal: controller.signal	// 処理を続ける
                });	// 処理を完了する
                if (!res.ok) throw new Error(`HTTP ${res.status}`);	// 条件に応じて処理を分ける
                return await res.json();	// 結果を返す
            } finally {	// 処理のまとまりを始める
                clearTimeout(timeoutId);	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        if (isImpersonating === "true") {	// 条件に応じて処理を分ける
            localStorage.setItem("userEmail", ADMIN_ID);	// 端末内の保存情報を扱う
            localStorage.setItem("userId", ADMIN_ID);	// 端末内の保存情報を扱う
            localStorage.setItem("userName", "管理者");	// 端末内の保存情報を扱う
            localStorage.removeItem("isImpersonating");	// 端末内の保存情報を扱う
        }	// 処理のまとまりを閉じる
        if ((currentUserId !== ADMIN_ID && currentEmail !== ADMIN_ID && isImpersonating !== "true") || !adminToken) {	// 条件に応じて処理を分ける
            adminAccessDenied = true;	// 処理を続ける
            alert("管理者権限が必要です。");	// 処理結果を知らせる
            window.location.replace(currentEmail ? "main.html" : "index.html");	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        function toggleMenu() {	// 関数を定義
            document.getElementById("hud-menu-btn").classList.toggle("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.toggle("open");	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        async function updateUnreadBadge() {	// 関数を定義
            const myEmail = localStorage.getItem("userEmail");	// 定数を定義
            const badge = document.getElementById("unread-badge");	// 定数を定義
            if (!myEmail || !badge || unreadRequest) return unreadRequest;	// 条件に応じて処理を分ける

            unreadRequest = (async () => {	// 処理のまとまりを始める
                try {	// 失敗に備えて処理を始める
                    const result = await postGas({ mode: "getUnreadCount", email: myEmail });	// 定数を定義

                    if (result.status === "success" && result.message) {	// 条件に応じて処理を分ける
                        const count = result.message.unreadCount || 0;	// 定数を定義
                        if (count > 0) {	// 条件に応じて処理を分ける
                            badge.innerText = count > 99 ? "99+" : count;	// 処理を続ける
                            badge.style.display = "inline-block";	// 処理を続ける
                        } else {	// 処理のまとまりを始める
                            badge.style.display = "none";	// 処理を続ける
                        }	// 処理のまとまりを閉じる
                    }	// 処理のまとまりを閉じる
                } catch (e) {	// 処理のまとまりを始める
                    console.error("未読チェックエラー:", e);	// 処理を完了する
                } finally {	// 処理のまとまりを始める
                    unreadRequest = null;	// 処理を続ける
                }	// 処理のまとまりを閉じる
            })();	// 処理を完了する

            return unreadRequest;	// 結果を返す
        }	// 処理のまとまりを閉じる

        async function loadOverview(silent = false) {	// 関数を定義
            if (overviewLoading) return;	// 条件に応じて処理を分ける
            overviewLoading = true;	// 処理を続ける

            const userBody = document.getElementById("user-table-body");	// 定数を定義
            const postBody = document.getElementById("post-table-body");	// 定数を定義

            if (!silent) {	// 条件に応じて処理を分ける
                userBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">読み込み中...</td></tr>`;	// 処理を続ける
                postBody.innerHTML = `<tr><td colspan="3" style="text-align:center;">読み込み中...</td></tr>`;	// 処理を続ける
            }	// 処理のまとまりを閉じる

            try {	// 失敗に備えて処理を始める
                const result = await postGas({ mode: "adminGetOverview", adminId: ADMIN_ID, adminToken: adminToken });	// 定数を定義
                if (result.status === "success") {	// 条件に応じて処理を分ける
                    renderUsers(result.message.users);	// 処理を完了する
                    renderPosts(result.message.posts);	// 処理を完了する
                    updateOnlineCount(result.message.onlineCount);	// 処理を完了する
                    loadReports(silent);	// 処理を完了する
                } else if (!silent) {	// 処理のまとまりを始める
                    alert("取得失敗: " + result.message);	// 処理結果を知らせる
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                if (!silent) alert("通信エラーが発生しました");	// 条件に応じて処理を分ける
            } finally {	// 処理のまとまりを始める
                overviewLoading = false;	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function updateOnlineCount(count) {	// 関数を定義
            const countEl = document.getElementById("online-user-count");	// 定数を定義
            if (countEl) countEl.innerText = Number.isFinite(Number(count)) ? Number(count) : 0;	// 条件に応じて処理を分ける
        }	// 処理のまとまりを閉じる

        function renderUsers(users) {	// 関数を定義
            const userBody = document.getElementById("user-table-body");	// 定数を定義
            userBody.innerHTML = "";	// 処理を続ける

            if (users.length === 0) {	// 条件に応じて処理を分ける
                userBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">ユーザーがいません</td></tr>`;	// 処理を続ける
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる

            users.forEach(u => {	// 処理のまとまりを始める
                const tr = document.createElement("tr");	// 定数を定義
                const idCell = document.createElement("td");	// 定数を定義
                const idButton = document.createElement("button");	// 定数を定義
                idButton.type = "button";	// 処理を続ける
                idButton.style.cssText = "border:0;background:none;padding:0;color:#1cbdc5;cursor:pointer;text-decoration:underline;font:inherit;font-weight:700;";	// 処理を続ける
                idButton.title = "このユーザーとして代理ログインする";	// 処理を続ける
                idButton.textContent = `${u.userId} 🔗`;	// 処理を続ける
                idButton.addEventListener("click", () => impersonateUser(u.userId, u.name));	// 操作イベントを登録
                idCell.appendChild(idButton);	// 処理を完了する

                const nameCell = document.createElement("td");	// 定数を定義
                nameCell.textContent = u.name;	// 処理を続ける

                const statusCell = document.createElement("td");	// 定数を定義
                const statusBadge = document.createElement("span");	// 定数を定義
                statusBadge.className = `status-badge ${u.isVerified ? "badge-active" : "badge-inactive"}`;	// 処理を続ける
                statusBadge.textContent = u.isVerified ? "正常" : "凍結/未認証";	// 処理を続ける
                statusCell.appendChild(statusBadge);	// 処理を完了する

                const actionCell = document.createElement("td");	// 定数を定義
                if (u.userId === ADMIN_ID) {	// 条件に応じて処理を分ける
                    actionCell.textContent = "-";	// 処理を続ける
                } else {	// 処理のまとまりを始める
                    const actionButton = document.createElement("button");	// 定数を定義
                    actionButton.className = u.isVerified ? "btn-action-ban" : "btn-action-unban";	// 処理を続ける
                    actionButton.textContent = u.isVerified ? "BAN (凍結)" : "BAN 解除";	// 処理を続ける
                    actionButton.addEventListener("click", () => toggleBanUser(u.userId, u.isVerified));	// 操作イベントを登録
                    actionCell.appendChild(actionButton);	// 処理を完了する
                }	// 処理のまとまりを閉じる

                tr.append(idCell, nameCell, statusCell, actionCell);	// 処理を完了する
                userBody.appendChild(tr);	// 処理を完了する
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        async function impersonateUser(targetUserId, targetUserName) {	// 関数を定義
            if (!confirm(`ユーザー [ ${targetUserId} (${targetUserName}) ] として代理ログインしますか？`)) return;	// 条件に応じて処理を分ける

            try {	// 失敗に備えて処理を始める
                const result = await postGas({ mode: "getUserProfile", userId: targetUserId });	// 定数を定義
                if (result.status !== "success" || !result.message) {	// 条件に応じて処理を分ける
                    alert("ユーザー情報を取得できませんでした。");	// 処理結果を知らせる
                    return;	// 結果を返す
                }	// 処理のまとまりを閉じる

                const profile = result.message;	// 定数を定義
                localStorage.setItem("userEmail", targetUserId);	// 端末内の保存情報を扱う
                localStorage.setItem("userId", targetUserId);	// 端末内の保存情報を扱う
                localStorage.setItem("userName", String(profile.name || targetUserName || targetUserId));	// 端末内の保存情報を扱う
                localStorage.setItem("profileImage", String(profile.profileImage || ""));	// 端末内の保存情報を扱う
                localStorage.setItem("isImpersonating", "true");	// 端末内の保存情報を扱う
                window.location.href = "main.html";	// 画面表示を更新する
            } catch (error) {	// 処理のまとまりを始める
                alert("ユーザー情報の取得中に通信エラーが発生しました。");	// 処理結果を知らせる
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function renderPosts(posts) {	// 関数を定義
            const postBody = document.getElementById("post-table-body");	// 定数を定義
            postBody.innerHTML = "";	// 処理を続ける

            if (posts.length === 0) {	// 条件に応じて処理を分ける
                postBody.innerHTML = `<tr><td colspan="3" style="text-align:center;">募集はありません</td></tr>`;	// 処理を続ける
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる

            posts.forEach(p => {	// 処理のまとまりを始める
                const tr = document.createElement("tr");	// 定数を定義
                const userCell = document.createElement("td");	// 定数を定義
                const name = document.createElement("strong");	// 定数を定義
                name.textContent = p.name;	// 処理を続ける
                const email = document.createElement("small");	// 定数を定義
                email.style.color = "#64748b";	// 処理を続ける
                email.textContent = p.email;	// 処理を続ける
                userCell.append(name, document.createElement("br"), email);	// 処理を完了する

                const contentCell = document.createElement("td");	// 定数を定義
                contentCell.textContent = p.content;	// 処理を続ける

                const actionCell = document.createElement("td");	// 定数を定義
                const deleteButton = document.createElement("button");	// 定数を定義
                deleteButton.className = "btn-action-delete";	// 処理を続ける
                deleteButton.textContent = "強制削除";	// 処理を続ける
                deleteButton.addEventListener("click", () => deletePost(p.email));	// 操作イベントを登録
                actionCell.appendChild(deleteButton);	// 処理を完了する

                tr.append(userCell, contentCell, actionCell);	// 処理を完了する
                postBody.appendChild(tr);	// 処理を完了する
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function escapeHtml(value) {	// 関数を定義
            return String(value ?? "")	// 結果を返す
                .replace(/&/g, "&amp;")	// 処理を続ける
                .replace(/</g, "&lt;")	// 処理を続ける
                .replace(/>/g, "&gt;")	// 処理を続ける
                .replace(/"/g, "&quot;")	// 処理を続ける
                .replace(/'/g, "&#039;");	// 処理を完了する
        }	// 処理のまとまりを閉じる

        async function loadReports(silent = false) {	// 関数を定義
            const body = document.getElementById("report-table-body");	// 定数を定義
            if (!body) return;	// 条件に応じて処理を分ける

            if (!silent) {	// 条件に応じて処理を分ける
                body.innerHTML = `<tr><td colspan="5" style="text-align:center;">読み込み中...</td></tr>`;	// 処理を続ける
            }	// 処理のまとまりを閉じる

            try {	// 失敗に備えて処理を始める
                const result = await postGas({ mode: "getReports", adminId: ADMIN_ID, adminToken: adminToken });	// 定数を定義

                if (result.status === "success") {	// 条件に応じて処理を分ける
                    renderReports(result.message);	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    body.innerHTML = `<tr><td colspan="5" style="text-align:center;">取得失敗</td></tr>`;	// 処理を続ける
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                body.innerHTML = `<tr><td colspan="5" style="text-align:center;">通信エラー</td></tr>`;	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function renderReports(reports) {	// 関数を定義
            const body = document.getElementById("report-table-body");	// 定数を定義
            body.innerHTML = "";	// 処理を続ける

            if (!reports || reports.length === 0) {	// 条件に応じて処理を分ける
                body.innerHTML = `<tr><td colspan="5" style="text-align:center;">通報はありません</td></tr>`;	// 処理を続ける
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる

            reports.slice().reverse().forEach(report => {	// 処理のまとまりを始める
                const tr = document.createElement("tr");	// 定数を定義
                const statuses = ["未対応", "確認中", "対応済み", "却下"];	// 定数を定義
                const statusOptions = statuses.map(status =>	// 定数を定義
                    `<option value="${status}" ${report.status === status ? "selected" : ""}>${status}</option>`	// 処理を続ける
                ).join("");	// 処理を完了する

                tr.innerHTML = `
                    <td>${escapeHtml(report.reportedAt)}</td>
                    <td>${escapeHtml(report.targetUserId)}<br><small>${escapeHtml(report.targetType)}</small></td>
                    <td>${escapeHtml(report.reason)}</td>
                    <td style="max-width:260px; white-space:pre-wrap; word-break:break-word;">${escapeHtml(report.targetContent || report.detail || "—")}</td>
                    <td>
                        <select onchange="updateReportStatus('${escapeHtml(report.reportId)}', this.value)">
                            ${statusOptions}
                        </select>
                    </td>
                `;

                body.appendChild(tr);	// 処理を完了する
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        async function updateReportStatus(reportId, status) {	// 関数を定義
            const adminMemo = prompt("管理者メモを入力してください（任意）") || "";	// 定数を定義

            try {	// 失敗に備えて処理を始める
                const result = await postGas({	// 定数を定義
                    mode: "updateReportStatus",	// 処理を続ける
                    adminId: ADMIN_ID,	// 処理を続ける
                    adminToken: adminToken,	// 処理を続ける
                    reportId: reportId,	// 処理を続ける
                    status: status,	// 処理を続ける
                    adminMemo: adminMemo	// 処理を続ける
                });	// 処理を完了する

                if (result.status === "success") {	// 条件に応じて処理を分ける
                    loadReports();	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    alert("通報の更新に失敗しました: " + result.message);	// 処理結果を知らせる
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                alert("通信エラーが発生しました。");	// 処理結果を知らせる
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        async function deletePost(targetEmail) {	// 関数を定義
            if (!confirm("この投稿を強制削除しますか？")) return;	// 条件に応じて処理を分ける

            try {	// 失敗に備えて処理を始める
                const result = await postGas({ mode: "adminDeletePost", adminId: ADMIN_ID, adminToken: adminToken, targetEmail: targetEmail });	// 定数を定義
                if (result.status === "success") {	// 条件に応じて処理を分ける
                    alert("投稿を削除しました");	// 処理結果を知らせる
                    loadOverview();	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    alert("削除失敗: " + result.message);	// 処理結果を知らせる
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                alert("通信エラーが発生しました");	// 処理結果を知らせる
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        async function toggleBanUser(targetUserId, isCurrentVerified) {	// 関数を定義
            const actionName = isCurrentVerified ? "凍結（BAN）" : "BAN解除";	// 定数を定義
            const confirmMsg = isCurrentVerified	// 定数を定義
                ? `ユーザー [ ${targetUserId} ] を凍結（BAN）しますか？\n※ログイン不可になり、該当ユーザーの募集も削除されます。`	// 処理を続ける
                : `ユーザー [ ${targetUserId} ] のBANを解除しますか？\n※正常にログインできるようになります。`;	// 処理を続ける

            if (!confirm(confirmMsg)) return;	// 条件に応じて処理を分ける

            try {	// 失敗に備えて処理を始める
                const result = await postGas({ mode: "adminBanUser", adminId: ADMIN_ID, adminToken: adminToken, targetUserId: targetUserId });	// 定数を定義
                if (result.status === "success") {	// 条件に応じて処理を分ける
                    alert(`ユーザーの${actionName}が完了しました`);	// 処理結果を知らせる
                    loadOverview();	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    alert("処理失敗: " + result.message);	// 処理結果を知らせる
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                alert("通信エラーが発生しました");	// 処理結果を知らせる
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function logout() {	// 関数を定義
            localStorage.clear();	// 端末内の保存情報を扱う
            window.location.href = "index.html";	// 画面表示を更新する
        }	// 処理のまとまりを閉じる

        window.onload = () => {	// 処理のまとまりを始める
            if (adminAccessDenied) return;	// 条件に応じて処理を分ける
            document.getElementById("hud-menu-btn").classList.remove("open");	// 画面表示を更新する
            document.getElementById("nav-links").classList.remove("open");	// 画面表示を更新する

            loadOverview();	// 処理を完了する
            updateUnreadBadge();	// 処理を完了する
            setInterval(() => {	// 時間を置いて処理する
                if (document.visibilityState === "visible") updateUnreadBadge();	// 条件に応じて処理を分ける
            }, 8000);	// 処理を完了する
            setInterval(() => {	// 時間を置いて処理する
                if (document.visibilityState === "visible") loadOverview(true);	// 条件に応じて処理を分ける
            }, 20000);	// 処理を完了する
        };	// 処理のまとまりを閉じる
    </script>
