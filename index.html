        input {	/* 対象要素のスタイルを始める */

            box-shadow: 0 0 0 4px rgba(28, 189, 197, 0.15);	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

            padding: 0;	/* 見た目の設定を指定 */

        }	/* スタイル定義を閉じる */

            color: white;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        .btn-flat {	/* 対象要素のスタイルを始める */
            background-color: transparent;	/* 見た目の設定を指定 */
            color: #64748b;	/* 見た目の設定を指定 */
            text-decoration: none;	/* 見た目の設定を指定 */
            font-size: 13px;	/* 見た目の設定を指定 */

            transition: all 0.2s ease;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        .btn-flat:hover {	/* 対象要素のスタイルを始める */
            background-color: rgba(28, 189, 197, 0.08);	/* 見た目の設定を指定 */
            color: #1cbdc5;	/* 見た目の設定を指定 */
            transform: none;	/* 見た目の設定を指定 */
            box-shadow: none;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        .camera-box {	/* 対象要素のスタイルを始める */
            display: none;	/* 見た目の設定を指定 */
            width: 100%;	/* 見た目の設定を指定 */
            max-width: 400px;	/* 見た目の設定を指定 */
            margin: 0 auto 20px auto;	/* 見た目の設定を指定 */
            border-radius: 16px;	/* 見た目の設定を指定 */
            overflow: hidden;	/* 見た目の設定を指定 */
            transform: scaleX(-1);	/* 見た目の設定を指定 */
            box-shadow: 0 10px 25px rgba(28, 189, 197, 0.15);	/* 見た目の設定を指定 */
            position: relative;	/* 見た目の設定を指定 */
            aspect-ratio: 4 / 3;	/* 見た目の設定を指定 */
            border: 2px solid rgba(28, 189, 197, 0.3);	/* 見た目の設定を指定 */
            background-color: #000;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        video {	/* 対象要素のスタイルを始める */
            width: 100%;	/* 見た目の設定を指定 */
            height: 100%;	/* 見た目の設定を指定 */
            object-fit: cover;	/* 見た目の設定を指定 */
            display: block;	/* 見た目の設定を指定 */
            position: absolute;	/* 見た目の設定を指定 */
            top: 0;	/* 見た目の設定を指定 */
            left: 0;	/* 見た目の設定を指定 */
            z-index: 1;	/* 見た目の設定を指定 */
            background: #000;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        canvas#face-overlay {	/* 対象要素のスタイルを始める */
            position: absolute;	/* 見た目の設定を指定 */
            top: 0;	/* 見た目の設定を指定 */
            left: 0;	/* 見た目の設定を指定 */
            width: 100%;	/* 見た目の設定を指定 */
            height: 100%;	/* 見た目の設定を指定 */
            z-index: 10;	/* 見た目の設定を指定 */
            pointer-events: none;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        #auth-status {	/* 対象要素のスタイルを始める */

            margin: 8px 0 0 0;	/* 見た目の設定を指定 */
            min-height: 20px;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        .page-transition-overlay {	/* 対象要素のスタイルを始める */
            position: fixed;	/* 見た目の設定を指定 */
            top: 0;	/* 見た目の設定を指定 */
            left: 0;	/* 見た目の設定を指定 */
            width: 100vw;	/* 見た目の設定を指定 */
            height: 100vh;	/* 見た目の設定を指定 */
            background-color: #ffffff;	/* 見た目の設定を指定 */
            z-index: 9999;	/* 見た目の設定を指定 */
            opacity: 0;	/* 見た目の設定を指定 */
            pointer-events: none;	/* 見た目の設定を指定 */
            transition: opacity 0.5s ease-in-out;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        .page-transition-overlay.active {	/* 対象要素のスタイルを始める */
            opacity: 1;	/* 見た目の設定を指定 */
            pointer-events: auto;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

        .login-card.fade-out-exit {	/* 対象要素のスタイルを始める */

            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;	/* 見た目の設定を指定 */
        }	/* スタイル定義を閉じる */

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";	// GAS APIの接続先を設定

        let videoStream = null;	// 状態を保持
        let faceMesh = null;	// 状態を保持
        let lastLandmarks = null;	// 状態を保持
        let faceFrameRequest = null;	// 状態を保持
        let faceFrameCallback = null;	// 状態を保持
        let faceProcessing = false;	// 状態を保持
        let lastFaceCheck = 0;	// 状態を保持
        let cameraStartPromise = null;	// 状態を保持
        let cameraSession = 0;	// 状態を保持
        let lastFaceSeen = 0;	// 状態を保持
        const faceCheckInterval = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 100 : 66;	// 定数を定義
        let faceSamples = [];	// 状態を保持
        let collectingFaceSamples = false;	// 状態を保持
        let lastFaceSampleAt = 0;	// 状態を保持
        let faceLoginTimer = null;	// 状態を保持
        let savedFeaturesText = "";	// 状態を保持
        let isCapturing = false;	// 状態を保持
        let pendingUserId = "";	// 状態を保持

        function compactFaceLandmarks(landmarks) {	// 関数を定義
            if (!Array.isArray(landmarks)) return [];	// 条件に応じて処理を分ける
            return landmarks.map(point => ({	// 結果を返す
                x: Number(Number(point.x || 0).toFixed(5)),	// 処理を続ける
                y: Number(Number(point.y || 0).toFixed(5)),	// 処理を続ける
                z: Number(Number(point.z || 0).toFixed(5))	// 処理を続ける
            }));	// 処理を完了する
        }	// 処理のまとまりを閉じる

        async function postGas(payload, timeoutMs = 15000) {	// 関数を定義
            const controller = new AbortController();	// 定数を定義
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);	// 定数を定義
            try {	// 失敗に備えて処理を始める
                const res = await fetch(GAS_URL, {	// 定数を定義
                    method: "POST",	// 処理を続ける
                    body: JSON.stringify(payload),	// 処理を続ける
                    signal: controller.signal	// 処理を続ける
                });	// 処理を完了する
                if (!res.ok) throw new Error(`HTTP ${res.status}`);	// 条件に応じて処理を分ける
                return await res.json();	// 結果を返す
            } finally {	// 処理のまとまりを始める
                clearTimeout(timeoutId);	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function hasWeakNumberSequence(password) {	// 関数を定義
            const numberRuns = String(password).match(/\d{4,}/g) || [];	// 定数を定義
            return numberRuns.some(run => {	// 結果を返す
                for (let i = 0; i <= run.length - 4; i++) {	// 対象を順番に処理する
                    const digits = run.slice(i, i + 4).split("").map(Number);	// 定数を定義
                    const same = digits.every(digit => digit === digits[0]);	// 定数を定義
                    const ascending = digits.slice(1).every((digit, index) => digit === (digits[index] + 1) % 10);	// 定数を定義
                    const descending = digits.slice(1).every((digit, index) => digit === (digits[index] + 9) % 10);	// 定数を定義
                    if (same || ascending || descending) return true;	// 条件に応じて処理を分ける
                }	// 処理のまとまりを閉じる
                return false;	// 結果を返す
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function validatePassword(password) {	// 関数を定義
            if (password.length < 4) return "パスワードは4文字以上で入力してください";	// 条件に応じて処理を分ける
            if (password.length > 128) return "パスワードは128文字以内で入力してください";	// 条件に応じて処理を分ける
            if (!/^[\x21-\x7E]+$/.test(password)) return "パスワードは半角英数字・記号のみ使用できます";	// 条件に応じて処理を分ける
            if (!/[A-Z]/.test(password)) return "パスワードに英大文字を1文字以上含めてください";	// 条件に応じて処理を分ける
            if (!/[a-z]/.test(password)) return "パスワードに英小文字を1文字以上含めてください";	// 条件に応じて処理を分ける
            if (!/[0-9]/.test(password)) return "パスワードに数字を1文字以上含めてください";	// 条件に応じて処理を分ける
            if (!/[^A-Za-z0-9]/.test(password)) return "パスワードに記号を1文字以上含めてください";	// 条件に応じて処理を分ける
            if (hasWeakNumberSequence(password)) return "同じ数字4桁の繰り返しや、1234・4321のような4桁の連番は使用できません";	// 条件に応じて処理を分ける
            return "";	// 結果を返す
        }	// 処理のまとまりを閉じる

        function drawFeatures(landmarks) {	// 関数を定義
            const canvas = document.getElementById('face-overlay');	// 定数を定義
            const video = document.getElementById('video');	// 定数を定義
            const ctx = canvas.getContext('2d');	// 定数を定義

            const rect = video.getBoundingClientRect();	// 定数を定義
            const dpr = Math.min(window.devicePixelRatio || 1, 2);	// 定数を定義
            const width = Math.max(1, Math.round(rect.width));	// 定数を定義
            const height = Math.max(1, Math.round(rect.height));	// 定数を定義
            const pixelWidth = Math.round(width * dpr);	// 定数を定義
            const pixelHeight = Math.round(height * dpr);	// 定数を定義

            if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {	// 条件に応じて処理を分ける
                canvas.width = pixelWidth;	// 処理を続ける
                canvas.height = pixelHeight;	// 処理を続ける
                canvas.style.width = `${width}px`;	// 処理を続ける
                canvas.style.height = `${height}px`;	// 処理を続ける
            }	// 処理のまとまりを閉じる

            ctx.setTransform(1, 0, 0, 1, 0, 0);	// 処理を完了する
            ctx.clearRect(0, 0, canvas.width, canvas.height);	// 処理を完了する
            if (!landmarks) return;	// 条件に応じて処理を分ける

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);	// 処理を完了する

            const vWidth = video.videoWidth || 320;	// 定数を定義
            const vHeight = video.videoHeight || 240;	// 定数を定義

            const scale = Math.max(width / vWidth, height / vHeight);	// 定数を定義
            const renderWidth = vWidth * scale;	// 定数を定義
            const renderHeight = vHeight * scale;	// 定数を定義
            const offsetX = (width - renderWidth) / 2;	// 定数を定義
            const offsetY = (height - renderHeight) / 2;	// 定数を定義

            ctx.fillStyle = "#00FF00";	// 処理を続ける
            for (let i = 0; i < landmarks.length; i++) {	// 対象を順番に処理する
                const pt = landmarks[i];	// 定数を定義
                const x = pt.x * renderWidth + offsetX;	// 定数を定義
                const y = pt.y * renderHeight + offsetY;	// 定数を定義
                ctx.beginPath();	// 処理を完了する
                ctx.arc(x, y, 1.5, 0, 2 * Math.PI);	// 処理を完了する
                ctx.fill();	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        async function checkFace() {	// 関数を定義
            const video = document.getElementById('video');	// 定数を定義
            if (!faceMesh || !videoStream || faceProcessing || video.readyState < 2) return;	// 条件に応じて処理を分ける

            const now = performance.now();	// 定数を定義
            if (now - lastFaceCheck < faceCheckInterval) return;	// 条件に応じて処理を分ける

            faceProcessing = true;	// 処理を続ける
            lastFaceCheck = now;	// 処理を続ける
            try {	// 失敗に備えて処理を始める
                await faceMesh.send({ image: video });	// 処理を完了する
            } catch (err) {	// 処理のまとまりを始める
                if (videoStream) {	// 条件に応じて処理を分ける
                    lastLandmarks = null;	// 処理を続ける
                    drawFeatures(null);	// 処理を完了する
                }	// 処理のまとまりを閉じる
            } finally {	// 処理のまとまりを始める
                faceProcessing = false;	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function scheduleFaceFrame(session) {	// 関数を定義
            const video = document.getElementById('video');	// 定数を定義
            if (!videoStream || session !== cameraSession) return;	// 条件に応じて処理を分ける

            if (typeof video.requestVideoFrameCallback === "function") {	// 条件に応じて処理を分ける
                faceFrameCallback = video.requestVideoFrameCallback(async () => {	// 処理のまとまりを始める
                    if (session !== cameraSession) return;	// 条件に応じて処理を分ける
                    await checkFace();	// 処理を完了する
                    scheduleFaceFrame(session);	// 処理を完了する
                });	// 処理を完了する
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる

            faceFrameRequest = requestAnimationFrame(async (time) => {	// 処理のまとまりを始める
                if (session !== cameraSession) return;	// 条件に応じて処理を分ける
                if (time - lastFaceCheck >= faceCheckInterval) await checkFace();	// 条件に応じて処理を分ける
                scheduleFaceFrame(session);	// 処理を完了する
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function stopFaceLoop() {	// 関数を定義
            const video = document.getElementById('video');	// 定数を定義
            if (faceFrameRequest !== null) {	// 条件に応じて処理を分ける
                cancelAnimationFrame(faceFrameRequest);	// 処理を完了する
                faceFrameRequest = null;	// 処理を続ける
            }	// 処理のまとまりを閉じる
            if (faceFrameCallback !== null && typeof video.cancelVideoFrameCallback === "function") {	// 条件に応じて処理を分ける
                video.cancelVideoFrameCallback(faceFrameCallback);	// 処理を完了する
                faceFrameCallback = null;	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function initFaceMesh() {	// 関数を定義
            if (faceMesh) return;	// 条件に応じて処理を分ける
            faceMesh = new FaceMesh({	// 処理のまとまりを始める
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`	// 処理を続ける
            });	// 処理を完了する
            faceMesh.setOptions({	// 処理のまとまりを始める
                maxNumFaces: 1,	// 処理を続ける
                refineLandmarks: true,	// 処理を続ける
                minDetectionConfidence: 0.5,	// 処理を続ける
                minTrackingConfidence: 0.5	// 処理を続ける
            });	// 処理を完了する
            faceMesh.onResults((results) => {	// 処理のまとまりを始める
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {	// 条件に応じて処理を分ける
                    lastLandmarks = results.multiFaceLandmarks[0];	// 処理を続ける
                    const now = performance.now();	// 定数を定義
                    lastFaceSeen = now;	// 処理を続ける
                    if (collectingFaceSamples && now - lastFaceSampleAt >= 350) {	// 条件に応じて処理を分ける
                        faceSamples.push(compactFaceLandmarks(lastLandmarks));	// 処理を完了する
                        if (faceSamples.length > 5) faceSamples.shift();	// 条件に応じて処理を分ける
                        lastFaceSampleAt = now;	// 処理を続ける
                    }	// 処理のまとまりを閉じる
                    drawFeatures(lastLandmarks);	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    if (performance.now() - lastFaceSeen > 500) lastLandmarks = null;	// 条件に応じて処理を分ける
                    drawFeatures(null);	// 処理を完了する
                }	// 処理のまとまりを閉じる
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる

        async function startCamera() {	// 関数を定義
            if (videoStream) return true;	// 条件に応じて処理を分ける
            if (cameraStartPromise) return cameraStartPromise;	// 条件に応じて処理を分ける

            cameraStartPromise = startCameraInternal();	// 処理を完了する
            try {	// 失敗に備えて処理を始める
                return await cameraStartPromise;	// 結果を返す
            } finally {	// 処理のまとまりを始める
                cameraStartPromise = null;	// 処理を続ける
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        async function startCameraInternal() {	// 関数を定義
            initFaceMesh();	// 処理を完了する
            const container = document.getElementById('camera-container');	// 定数を定義
            const video = document.getElementById('video');	// 定数を定義
            const authStatus = document.getElementById('auth-status');	// 定数を定義
            container.style.display = "block";	// 処理を続ける

            try {	// 失敗に備えて処理を始める
                const constraints = {	// 定数を定義
                    audio: false,	// 処理を続ける
                    video: {	// 処理のまとまりを始める
                        facingMode: { ideal: "user" },	// 処理を続ける
                        width: { ideal: 1280, max: 1920 },	// 処理を続ける
                        height: { ideal: 720, max: 1080 },	// 処理を続ける
                        frameRate: { ideal: 30, max: 30 }	// 処理を完了する
                    }	// 処理のまとまりを閉じる
                };	// 処理のまとまりを閉じる

                try {	// 失敗に備えて処理を始める
                    videoStream = await navigator.mediaDevices.getUserMedia(constraints);	// 処理を完了する
                } catch (err) {	// 処理のまとまりを始める
                    if (err.name === "NotAllowedError" || err.name === "SecurityError" || err.name === "AbortError") {	// 条件に応じて処理を分ける
                        throw err;	// エラーを通知する
                    }	// 処理のまとまりを閉じる
                    videoStream = await navigator.mediaDevices.getUserMedia({	// 処理のまとまりを始める
                        audio: false,	// 処理を続ける
                        video: { facingMode: "user" }	// 処理を完了する
                    });	// 処理を完了する

                document.getElementById("forgot-userid").value = userId;	// 処理を続ける
            }	// 処理のまとまりを閉じる
            updateMsg("", "");	// 処理を完了する
        }	// 処理のまとまりを閉じる

        function hideForgotPasswordForm() {	// 関数を定義
            document.getElementById("forgot-password-section").style.display = "none";	// 画面表示を更新する
            document.getElementById("login-section").style.display = "block";	// 画面表示を更新する
            updateMsg("", "");	// 処理を完了する
        }	// 処理のまとまりを閉じる

        async function submitForgotPassword() {	// 関数を定義
            const targetUserId = document.getElementById("forgot-userid").value.trim();	// 定数を定義
            if (!targetUserId) {	// 条件に応じて処理を分ける
                updateMsg("ユーザIDを入力してください", "error");	// 処理を完了する
                return;	// 結果を返す
            }	// 処理のまとまりを閉じる

            updateMsg("送信中...", "");	// 処理を完了する
            try {	// 失敗に備えて処理を始める
                const result = await postGas({	// 定数を定義
                    mode: "forgotPassword",	// 処理を続ける
                    userId: targetUserId	// 処理を続ける
                }, 25000);	// 処理を完了する
                if (result.status === "success") {	// 条件に応じて処理を分ける
                    updateMsg("登録済みのメールアドレス宛に、再設定用のリンクを送信しました。メールをご確認ください。", "success");	// 処理を完了する
                } else {	// 処理のまとまりを始める
                    updateMsg(result.message, "error");	// 処理を完了する
                }	// 処理のまとまりを閉じる
            } catch (e) {	// 処理のまとまりを始める
                updateMsg("通信エラーが発生しました。", "error");	// 処理を完了する
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        function togglePasswordVisibility() {	// 関数を定義
            const passwordInput = document.getElementById('password');	// 定数を定義
            const toggleButton = document.getElementById('toggle-password');	// 定数を定義
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';	// 処理を続ける
            toggleButton.textContent = passwordInput.type === 'password' ? '表示' : '非表示';	// 処理を続ける
        }	// 処理のまとまりを閉じる

        function toggleconfirmVisibility() {	// 関数を定義
            const confirmpasswordInput = document.getElementById('confirm-password');	// 定数を定義
            const toggleconfirmButton = document.getElementById('toggle-confirm');	// 定数を定義
            confirmpasswordInput.type = confirmpasswordInput.type === 'password' ? 'text' : 'password';	// 処理を続ける
            toggleconfirmButton.textContent = confirmpasswordInput.type === 'password' ? '表示' : '非表示';	// 処理を続ける
        }	// 処理のまとまりを閉じる

        function updateMsg(txt, type) {	// 関数を定義
            const el = document.getElementById("message");	// 定数を定義
            el.innerText = txt;	// 処理を続ける
            el.className = "message " + type;	// 処理を続ける
        }	// 処理のまとまりを閉じる

        function handleKeyPress(event) {	// 関数を定義
            if (event.key === 'Enter') {	// 条件に応じて処理を分ける
                event.preventDefault();	// 処理を完了する
                if (document.getElementById("login-section").style.display !== "none") {	// 画面表示を更新する
                    handleLogin();	// 処理を完了する
                }	// 処理のまとまりを閉じる
            }	// 処理のまとまりを閉じる
        }	// 処理のまとまりを閉じる

        if ('serviceWorker' in navigator) {	// 条件に応じて処理を分ける
            window.addEventListener('load', () => {	// 操作イベントを登録
                navigator.serviceWorker.register('sw.js')	// 処理を続ける
                    .then(reg => console.log('ServiceWorker 登録成功:', reg.scope))	// 処理を続ける
                    .catch(err => console.log('ServiceWorker 登録失敗:', err));	// 処理を完了する
            });	// 処理を完了する
        }	// 処理のまとまりを閉じる
    </script>
