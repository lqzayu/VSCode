<!DOCTYPE html>  
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 平工マッチング</title>
    <link rel="stylesheet" href="index-style.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <h1 id="form-title">ログイン</h1>

        <div class="input-group">
            <input type="text" id="email" placeholder="ユーザID" inputmode="email" onkeypress="handleKeyPress(event)">

            <div class="password-wrapper">
                <input type="password" id="password" placeholder="パスワード" class="password-input">
                <button type="button" id="toggle-password" onclick="togglePasswordVisibility()" class="toggle-password-btn" >表示</button>
            </div>    
            <div class="confirm-password-wrapper">
            <input type="password" id="confirm-password" placeholder="Confirm Password" class="confirm-password-input">
            <button type="button" id="toggle-confirm" onclick="toggleconfirmVisibility()" class="toggle-confirm-btn" >表示</button>
        </div>
        <p id="message" class="message"></p>
        <div class="button-group">
            <div id="login-section">
                <button class="btn-primary" onclick="handleLogin()">ログイン</button>
                <button class="btn-flat" onclick="toggleMode('register')">新規登録はこちら</button>
            </div>
            <div id="register-section" style="display: none;">
                <button class="btn-primary" onclick="handleRegister()">アカウント作成</button>
                <button class="btn-flat" onclick="toggleMode('login')">ログインに戻る</button>
            </div>
        </div>
    </div>
</div>
<script src="index-script.js"></script>
</body>
</html>

/* ========================================================
   Googleログイン成功時に実行される関数

async function handleCredentialResponse(response) {
    try {
        // Googleから送られてきた暗号化データ（JWT）を解読してユーザー情報を取得
        const responsePayload = parseJwt(response.credential);
        const email = responsePayload.email;
        const name = responsePayload.name;
        const picture = responsePayload.picture; // Googleのアイコン画像URL

        }

        // 認証が通ったら、ユーザー情報をブラウザ（localStorage）に安全に保存

        alert("ログイン処理に失敗しました。もう一度お試しください。");
    }
}

/* ========================================================
   JWT（Googleの暗号化データ）を解読するための補助関数
======================================================== */
function parseJwt(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
}

// 既にログイン済みの場合は自動でホームへ飛ばす処理
