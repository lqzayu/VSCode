<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 平工マッチング</title>
    <link rel="stylesheet" href="index-style.css">

    <style>
        /* スマホでの表示崩れ（左ずれ）修正スタイル */
        @media screen and (max-width: 480px) {
            .login-container {
                padding: 10px;
                box-sizing: border-box;
            }

            .login-card {
                width: 100% !important;
                max-width: 100% !important;
                padding: 30px 20px !important;
                margin: 0 auto !important;
                box-sizing: border-box !important;
                border-radius: 12px;
            }

            h1 {
                font-size: 24px !important;
                margin-bottom: 25px !important;
            }

            .input-group input {
                padding: 12px 15px !important;
                font-size: 16px !important;
                border-radius: 8px !important;
            }

            .btn-primary,
            .btn-flat {
                padding: 12px !important;
                font-size: 16px !important;
                border-radius: 8px !important;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <h1 id="form-title">ログイン</h1>

            <div class="input-group">
                <input type="text" id="email" placeholder="ユーザID" inputmode="email" onkeypress="handleKeyPress(event)">

                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="パスワード" class="password-input"
                        onkeypress="handleKeyPress(event)">
                    <button type="button" id="toggle-password" onclick="togglePasswordVisibility()"
                        class="toggle-password-btn">表示</button>
                </div>

                <div class="confirm-password-wrapper" style="display: none;">
                    <input type="password" id="confirm-password" placeholder="Confirm Password"
                        class="confirm-password-input" onkeypress="handleKeyPress(event)">
                    <button type="button" id="toggle-confirm" onclick="toggleconfirmVisibility()"
                        class="toggle-confirm-btn">表示</button>
                </div>

                <p id="message" class="message"></p>

                <div class="button-group">
                    <div id="login-section">
                        <button class="btn-primary" onclick="handleLogin()">ログイン</button>
                        <button class="btn-flat" onclick="toggleMode('register')">新規登録はこちら</button>
                    </div>
                    <div id="register-section" style="display: none;">
                        <button class="btn-primary" onclick="handleRegister()">アカウント作成</button>
                        <button class="btn-flat" onclick="toggleMode('login')">ログインに戻る</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <p class="copyright">&copy; 2026 平工マッチング. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwITrmNEOqPX9Xe59kAN7gEeyz4R3RocqhC4H6P27n66TS5oWsTQdhyCo1-gl8trb5F/exec";

        // ログイン画面と新規登録画面の切り替え処理
        function toggleMode(mode) {
            const title = document.getElementById("form-title");
            const confirmWrapper = document.querySelector(".confirm-password-wrapper");
            const confirmInput = document.getElementById("confirm-password");
            const toggleConfirmBtn = document.getElementById("toggle-confirm");
            const loginSec = document.getElementById("login-section");
            const registerSec = document.getElementById("register-section");
            const msg = document.getElementById("message");

            msg.innerText = "";

            if (mode === 'register') {
                title.innerText = "新規登録";
                confirmWrapper.style.display = "flex";
                confirmInput.style.display = "block";
                toggleConfirmBtn.style.display = "block";

                loginSec.style.display = "none";
                registerSec.style.display = "block";
            } else {
                title.innerText = "ログイン";
                confirmWrapper.style.display = "none";
                confirmInput.style.display = "none";
                toggleConfirmBtn.style.display = "none";

                loginSec.style.display = "block";
                registerSec.style.display = "none";

                document.getElementById("confirm-password").value = "";
            }
        }

        // ログインボタンを押したときの処理
        async function handleLogin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            if (!email || !password) return updateMsg("入力してください", "error");

            try {
                updateMsg("照合中...", "");
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "login", email, password })
                });
                const result = await res.json();

                // GASの戻り値（status === "success"）を正しく判定
                if (result.status === "success") {
                    localStorage.setItem("userEmail", email);
                    updateMsg("成功！移動します...", "success");
                    setTimeout(() => { window.location.href = "home.html"; }, 1000);
                } else {
                    // エラーメッセージ（文字列）をそのまま表示
                    updateMsg(result.message, "error");
                }
            } catch (e) { updateMsg("通信エラー", "error"); }
        }

        // パスワードの表示／非表示切り替え
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.getElementById('toggle-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.textContent = '非表示';
            } else {
                passwordInput.type = 'password';
                toggleButton.textContent = '表示';
            }
        }

        // 確認用パスワードの表示／非表示切り替え
        function toggleconfirmVisibility() {
            const confirmpasswordInput = document.getElementById('confirm-password');
            const toggleconfirmButton = document.getElementById('toggle-confirm');

            if (confirmpasswordInput.type === 'password') {
                confirmpasswordInput.type = 'text';
                toggleconfirmButton.textContent = '非表示';
            } else {
                confirmpasswordInput.type = 'password';
                toggleconfirmButton.textContent = '表示';
            }
        }

        // アカウント作成ボタンを押したときの処理
        async function handleRegister() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirm = document.getElementById("confirm-password").value.trim();

            if (!email || !password || !confirm) {
                return updateMsg("入力してください", "error");
            }
            if (password !== confirm) return updateMsg("パスワード不一致", "error");

            try {
                updateMsg("登録中...", "");
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ mode: "register", email, password })
                });
                const result = await res.json();

                // GAS側から正常終了（"success"）が返ってきたら画面を切り替える
                if (result.status === "success") {
                    updateMsg("登録完了！", "success");
                    setTimeout(() => toggleMode('login'), 2000);
                } else {
                    updateMsg(result.message, "error");
                }
            } catch (e) { updateMsg("通信エラー", "error"); }
        }

        // 画面上のメッセージ書き換え処理
        function updateMsg(txt, type) {
            const el = document.getElementById("message");
            el.innerText = txt;
            el.className = "message " + type;
        }

        // Enterキーが押された時の操作制御
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();

                const loginSection = document.getElementById("login-section");
                const registerSection = document.getElementById("register-section");

                if (loginSection.style.display !== "none") {
                    handleLogin();
                } else if (registerSection.style.display !== "none") {
                    handleRegister();
                }
            }
        }
    </script>
</body>

</html>
